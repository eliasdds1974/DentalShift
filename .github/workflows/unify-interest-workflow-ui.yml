name: Unify interest workflow UI
on:
  push:
    paths:
      - '.github/workflows/unify-interest-workflow-ui.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply unified interest patch
        run: python .github/scripts/unify-interest-workflow-ui.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dentalshift.ts components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx components/AnonymousAvailableStaffPanel.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply unified interest workflow logic"
          git push
