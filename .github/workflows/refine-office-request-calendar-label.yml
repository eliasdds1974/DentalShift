name: Refine office request calendar label
on:
  push:
    paths:
      - 'scripts/refine-office-request-calendar-label.py'
      - '.github/workflows/refine-office-request-calendar-label.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine office request label
        run: python3 scripts/refine-office-request-calendar-label.py
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit source changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m 'Refine office request placement in professional calendar'
          git push
