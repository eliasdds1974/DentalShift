name: Restore professional office card details
on:
  push:
    paths:
      - '.github/workflows/restore-professional-office-card-details.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore office card details
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/WorkflowWorkspaceV2.tsx')
          s = p.read_text()
          s = s.replace('import { CalendarDays, Check, ChevronLeft, ChevronRight, Clock3, MapPin } from "lucide-react";', 'import { CalendarDays, Check, ChevronLeft, ChevronRight, Clock3, ExternalLink, MapPin, ShieldCheck } from "lucide-react";', 1)
          s = s.replace('  respondToInvitation,\n  type AccountProfile,', '  respondToInvitation,\n  normalizeWebsite,\n  type AccountProfile,', 1)
          s = s.replace('function ShiftCard({ shift, action, tone = "blue", status }: { shift: LiveShift; action?: React.ReactNode; tone?: "blue" | "red" | "green" | "navy"; status?: string }) {\n  const tones = {', 'function ShiftCard({ shift, action, tone = "blue", status }: { shift: LiveShift; action?: React.ReactNode; tone?: "blue" | "red" | "green" | "navy"; status?: string }) {\n  const [expanded, setExpanded] = useState(false);\n  const website = normalizeWebsite(shift.offices?.website);\n  const tones = {', 1)
          s = s.replace('          <strong className="truncate text-sm text-[#002757] sm:text-base">{officeName(shift)}</strong>\n        </div>\n        <p className="mt-2 flex items-center', '          <strong className="truncate text-sm text-[#002757] sm:text-base">{officeName(shift)}</strong>\n        </div>\n        <p className="mt-1 text-xs font-black text-slate-700">{shift.profession}</p>\n        <p className="mt-2 flex items-center', 1)
          s = s.replace('        <p className="mt-1 flex items-center gap-1.5 text-xs text-slate-500"><MapPin size={14} />{shift.offices?.city || "City"}, {shift.offices?.province || "Province"}</p>', '        <p className="mt-1 flex items-center gap-1.5 text-xs text-slate-500"><MapPin size={14} />{shift.offices?.city || "City"}, {shift.offices?.province || "Province"}</p>\n        {website && <a href={website} target="_blank" rel="noreferrer" className="mt-1 inline-flex items-center gap-1 text-xs font-black text-[#002757] underline decoration-[#34A853]/60 underline-offset-4"><ExternalLink size={13} />Visit website</a>}', 1)
          old = '    {shift.required_software && <p className="mt-3 text-xs font-bold text-slate-500">Software: {shift.required_software}</p>}\n    {action && <div className="mt-4">{action}</div>}'
          new = '    <div className="mt-3 flex flex-wrap items-center justify-between gap-2 border-t border-slate-200/70 pt-3"><div className="flex flex-wrap gap-2 text-[11px] font-bold text-slate-500">{shift.required_software && <span className="rounded-full bg-white/80 px-2 py-1">Software: {shift.required_software}</span>}{shift.notes && <span className="rounded-full bg-white/80 px-2 py-1">Shift notes available</span>}</div><button type="button" onClick={() => setExpanded((value) => !value)} className="secondary-btn px-3 py-1.5 text-xs">{expanded ? "Hide details" : "Details"}</button></div>\n    {expanded && <div className="mt-3 rounded-xl border border-slate-200 bg-white/80 p-3"><div className="grid gap-3 text-sm sm:grid-cols-2"><div><p className="text-[10px] font-black uppercase tracking-wide text-slate-400">Practice software</p><p className="mt-1 font-extrabold text-[#002757]">{shift.required_software || "No specific software required"}</p></div><div><p className="text-[10px] font-black uppercase tracking-wide text-slate-400">Shift notes</p><p className="mt-1 font-semibold text-slate-700">{shift.notes || "No additional notes provided."}</p></div></div><p className="mt-3 text-xs font-semibold text-slate-500"><ShieldCheck size={14} className="mr-1 inline text-[#34A853]" />Office contact information remains protected until booking confirmation.</p></div>}\n    {action && <div className="mt-4">{action}</div>}'
          assert old in s, 'card details insertion point not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet || git commit -m "Restore professional office card details"
          git push