name: Restore professional office card details
on:
  push:
    paths:
      - '.github/workflows/restore-professional-office-card-details.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore rich office cards in professional calendar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('components/WorkflowWorkspaceV2.tsx')
          s = p.read_text()
          s = s.replace(
            'import { CalendarDays, Check, ChevronLeft, ChevronRight, Clock3, MapPin } from "lucide-react";',
            'import { CalendarDays, Check, ChevronLeft, ChevronRight, Clock3, ExternalLink, MapPin, ShieldCheck } from "lucide-react";',
            1,
          )
          s = s.replace(
            '  respondToInvitation,\n  type AccountProfile,',
            '  respondToInvitation,\n  normalizeWebsite,\n  type AccountProfile,',
            1,
          )

          replacement = r'''function ShiftCard({ shift, action, tone = "blue", status }: { shift: LiveShift; action?: React.ReactNode; tone?: "blue" | "red" | "green" | "navy"; status?: string }) {
  const [expanded, setExpanded] = useState(false);
  const tones = {
    blue: "border-[#4285F4]/25 bg-blue-50/50",
    red: "border-[#EA4335]/25 bg-red-50/60",
    green: "border-[#34A853]/25 bg-green-50/60",
    navy: "border-[#002757]/20 bg-slate-50",
  };
  const dot = { blue: "bg-[#4285F4]", red: "bg-[#EA4335]", green: "bg-[#34A853]", navy: "bg-[#002757]" }[tone];
  const website = normalizeWebsite(shift.offices?.website);
  return <article className={`overflow-hidden rounded-2xl border ${tones[tone]}`}>
    <div className="p-4">
      <div className="flex items-start justify-between gap-3">
        <div className="min-w-0">
          <div className="flex items-center gap-2">
            <span className={`h-2.5 w-2.5 shrink-0 rounded-full ${dot}`} />
            <strong className="truncate text-sm text-[#002757] sm:text-base">{officeName(shift)}</strong>
          </div>
          <p className="mt-1 text-xs font-black text-slate-700">{shift.profession}</p>
          <div className="mt-2 flex flex-wrap gap-x-3 gap-y-1 text-xs font-bold text-slate-600">
            <span className="flex items-center gap-1.5"><Clock3 size={14} />{shortTime(shift.starts_at)}–{shortTime(shift.ends_at)}</span>
            <span className="flex items-center gap-1.5"><MapPin size={14} />{shift.offices?.city || "City"}, {shift.offices?.province || "Province"}</span>
            {website && <a href={website} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 font-black text-[#002757] underline decoration-[#34A853]/60 underline-offset-4 hover:text-[#34A853]"><ExternalLink size={13} />Visit website</a>}
          </div>
        </div>
        <div className="shrink-0 text-right">
          <p className="text-base font-black text-[#002757]">${Number(shift.hourly_rate)}/hr</p>
          {status && <span className="mt-1 inline-flex rounded-full bg-white px-2 py-1 text-[10px] font-black uppercase tracking-wide text-slate-600 shadow-sm">{status}</span>}
        </div>
      </div>

      <div className="mt-3 flex flex-wrap items-center justify-between gap-2 border-t border-slate-200/70 pt-3">
        <div className="flex flex-wrap gap-2 text-[11px] font-bold text-slate-500">
          {shift.required_software && <span className="rounded-full bg-white/80 px-2 py-1">Software: {shift.required_software}</span>}
          {shift.notes && <span className="rounded-full bg-white/80 px-2 py-1">Shift notes available</span>}
        </div>
        <button type="button" onClick={() => setExpanded((value) => !value)} className="secondary-btn px-3 py-1.5 text-xs">{expanded ? "Hide details" : "Details"}</button>
      </div>

      {expanded && <div className="mt-3 rounded-xl border border-slate-200 bg-white/80 p-3">
        <div className="grid gap-3 text-sm sm:grid-cols-2">
          <div><p className="text-[10px] font-black uppercase tracking-wide text-slate-400">Practice software</p><p className="mt-1 font-extrabold text-[#002757]">{shift.required_software || "No specific software required"}</p></div>
          <div><p className="text-[10px] font-black uppercase tracking-wide text-slate-400">Shift notes</p><p className="mt-1 font-semibold text-slate-700">{shift.notes || "No additional notes provided."}</p></div>
        </div>
        <p className="mt-3 text-xs font-semibold text-slate-500"><ShieldCheck size={14} className="mr-1 inline text-[#34A853]" />Office contact information remains protected until booking confirmation.</p>
      </div>}

      {action && <div className="mt-4">{action}</div>}
    </div>
  </article>;
}

function ProfessionalCalendarWorkspace'''

          pattern = r'function ShiftCard\(\{ shift, action, tone = "blue", status \}: \{ shift: LiveShift; action\?: React\.ReactNode; tone\?: "blue" \| "red" \| "green" \| "navy"; status\?: string \}\) \{.*?\n\}\n\nfunction ProfessionalCalendarWorkspace'
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert count == 1, 'ShiftCard block not found'
          p.write_text(s2)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet || git commit -m "Restore professional office card details"
          git push