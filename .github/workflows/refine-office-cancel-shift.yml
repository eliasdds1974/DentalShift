name: Refine office cancel shift button

on:
  push:
    paths:
      - '.github/scripts/refine-office-cancel-shift.py'
      - '.github/workflows/refine-office-cancel-shift.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cancel shift styling
        run: python .github/scripts/refine-office-cancel-shift.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit refinement
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refine Office Portal Cancel Shift button"
            git push
          fi
