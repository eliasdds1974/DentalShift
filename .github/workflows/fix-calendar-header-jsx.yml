name: Fix calendar header JSX

on:
  push:
    paths:
      - '.github/workflows/fix-calendar-header-jsx.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix extra closing div
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/WorkflowWorkspaceV2.tsx')
          text = path.read_text()
          old = '''          </div>
        </div>
      </div>

      {calendarView === "list" ?'''
          new = '''          </div>
        </div>

      {calendarView === "list" ?'''
          if old not in text:
              raise SystemExit('Expected calendar header closing structure not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit source fix
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m 'Fix calendar header JSX structure'
          git push
