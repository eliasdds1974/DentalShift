name: Compact professional account address

on:
  push:
    paths:
      - "scripts/compact-professional-account-address.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/compact-professional-account-address.py
      - run: npm install --no-audit --no-fund && npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx lib/dentalshift.ts components/GoogleAddressAutocomplete.tsx
          git diff --cached --quiet || git commit -m "Add compact professional Google address"
          git push
