name: Enhance office cancellation

on:
  push:
    paths:
      - '.github/workflows/enhance-office-cancellation.yml'
      - '.github/scripts/enhance-office-cancellation.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply office cancellation patch
        run: python .github/scripts/enhance-office-cancellation.py
      - name: Commit changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add office cancellation card and notification flow"
            git push
          fi
