name: Add CPR expiry renewal flow

on:
  push:
    paths:
      - '.github/workflows/add-cpr-expiry-renewal-flow.yml'
      - '.github/scripts/add-cpr-expiry-renewal-flow.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CPR expiry and renewal patch
        run: python .github/scripts/add-cpr-expiry-renewal-flow.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/page.tsx lib/dentalshift.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add CPR expiry review and renewal grace flow"
            git push
          fi
