name: Add Office scheduled location
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add-office-scheduled-location.py'
      - '.github/workflows/add-office-scheduled-location.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Office scheduled location patch
        run: python .github/scripts/add-office-scheduled-location.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit Office scheduled location
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dentalshift.ts components/OfficeWorkspaceV2.tsx
          git commit -m "Show professional location and distance on Office scheduled card" || exit 0
          git push origin main
