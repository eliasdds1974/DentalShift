name: Apply V2 availability mobile UX

on:
  push:
    paths:
      - .github/workflows/availability-v2-mobile-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V2 availability card
        run: |
          echo '' | base64 --decode > /tmp/patch-v2.py
          python /tmp/patch-v2.py
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Highlight availability entry on selected date"
          git push
