name: Fix professional workflow loading watchdog

on:
  push:
    paths:
      - '.github/workflows/fix-professional-workflow-watchdog.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch professional workflow refresh
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/WorkflowWorkspace.tsx')
          s = p.read_text()
          old = '''  const refresh = async () => {
            setLoading(true); setError("");
            try { setData(await loadProfessionalWorkflow(userId)); }
            catch (value) { setError(value instanceof Error ? value.message : "Could not load your shifts."); }
            finally { setLoading(false); }
          };'''
          new = '''  const refresh = async () => {
            setLoading(true);
            setError("");
            const watchdog = window.setTimeout(() => {
              setLoading(false);
              setError((current) => current || "Live shift data is taking longer than expected. You can keep using DentalShift while it reconnects.");
            }, 8000);
            try {
              const nextData = await Promise.race([
                loadProfessionalWorkflow(userId),
                new Promise<never>((_, reject) => window.setTimeout(
                  () => reject(new Error("DentalShift could not finish loading your workflow. Please refresh and try again.")),
                  9000,
                )),
              ]);
              setData(nextData);
            } catch (value) {
              setError(value instanceof Error ? value.message : "Could not load your shifts.");
            } finally {
              window.clearTimeout(watchdog);
              setLoading(false);
            }
          };'''
          if old not in s:
              raise SystemExit('Target refresh block not found; refusing to modify file')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add components/WorkflowWorkspace.tsx
          git commit -m "Prevent professional workflow loading screen from hanging"
          git push
