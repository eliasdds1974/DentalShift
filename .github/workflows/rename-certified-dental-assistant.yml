name: Rename Certified Dental Assistant

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-certified-dental-assistant.yml'

permissions:
  contents: write

jobs:
  rename-profession:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update profession label everywhere in the app
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix not in {'.ts', '.tsx', '.js', '.jsx', '.sql', '.md', '.yml', '.yaml'}:
                  continue
              text = path.read_text(encoding='utf-8')
              new = text.replace('Registered Dental Assistant', 'Certified Dental Assistant')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Updated:', ', '.join(changed))
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/rename-certified-dental-assistant.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Use Certified Dental Assistant profession label"
          git push
