name: Update homepage hero callouts

on:
  push:
    paths:
      - '.github/scripts/update-homepage-hero-callouts.py'
      - '.github/workflows/update-homepage-hero-callouts.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage refinements
        run: python .github/scripts/update-homepage-hero-callouts.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit homepage refinements
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/MarketingHome.tsx components/MarketingCalendarPreview.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refine homepage hero and calendar callouts"
            git push
          fi
