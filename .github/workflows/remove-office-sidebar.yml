name: Remove office sidebar
on:
  push:
    paths:
      - '.github/workflows/remove-office-sidebar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove office sidebar and reclaim workspace width
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = '{role !== "professional" && <Sidebar role={role} setRole={(nextRole) => {'
          new = '{role === "admin" && <Sidebar role={role} setRole={(nextRole) => {'
          if old not in s:
              raise SystemExit('Sidebar condition not found')
          s = s.replace(old, new, 1)
          old = '<div className={role === "professional" ? "" : "lg:pl-[270px]"}>'
          new = '<div className={role === "admin" ? "lg:pl-[270px]" : ""}>'
          if old not in s:
              raise SystemExit('Workspace padding condition not found')
          s = s.replace(old, new, 1)
          old = '{role !== "professional" && <button className="rounded-xl border border-slate-200 p-2 lg:hidden" onClick={onMenu}><Menu size={21} /></button>}'
          new = '{role === "admin" && <button className="rounded-xl border border-slate-200 p-2 lg:hidden" onClick={onMenu}><Menu size={21} /></button>}'
          if old not in s:
              raise SystemExit('Header menu condition not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit source change
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Remove office sidebar to match professional workspace'
          git push
