name: Add professional calendar availability marker
on:
  push:
    paths:
      - '.github/workflows/add-professional-calendar-availability-marker.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add availability marker to professional calendar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/WorkflowWorkspaceV2.tsx')
          s = p.read_text()
          anchor = '            const today = key === localDateKey(new Date());\n'
          addition = '            const availableOnDate = workflow.availability.some((slot) => slot.available && localDateKey(slot.starts_at) === key);\n'
          assert anchor in s, 'calendar day anchor not found'
          if addition not in s:
              s = s.replace(anchor, anchor + addition, 1)
          start = s.index(addition)
          close = '            </button>;'
          end = s.index(close, start)
          marker = '              {availableOnDate && <span className="absolute bottom-1 left-1 right-1 rounded-md bg-[#eaf8ee] px-1 py-0.5 text-center text-[8px] font-black leading-tight text-[#017f27] sm:bottom-2 sm:left-2 sm:right-2 sm:py-1 sm:text-[10px]"><span className="sm:hidden">✓</span><span className="hidden sm:inline">✓ I’m Available</span></span>}\n'
          if marker not in s[start:end]:
              s = s[:end] + marker + s[end:]
          s = s.replace('>Your availability</p>', '>✓ I’m Available</p>', 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet || git commit -m "Show professional availability on calendar"
          git push
