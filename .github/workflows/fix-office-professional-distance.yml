name: Fix office professional distance

on:
  push:
    paths:
      - '.github/scripts/fix-office-professional-distance.py'
      - '.github/workflows/fix-office-professional-distance.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply secure distance fix
        run: python .github/scripts/fix-office-professional-distance.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit distance fix
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add lib/dentalshift.ts components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Office Portal professional distance display"
            git push
          fi
