name: Authenticated professional gate migration
on:
  push:
    paths:
      - '.github/workflows/one-time-authenticated-professional-gate.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch professional gate
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit source change
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add app/page.tsx
          git commit -m "Keep authenticated professionals in live workspace"
          git push
