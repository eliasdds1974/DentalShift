name: Show all role shifts to professionals

on:
  push:
    branches:
      - fix/rdh-all-office-shifts
    paths:
      - "scripts/show-all-role-shifts-to-professionals.py"
      - ".github/workflows/show-all-role-shifts-to-professionals.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply professional shift visibility patch
        run: python scripts/show-all-role-shifts-to-professionals.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit source change and clean helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git rm scripts/show-all-role-shifts-to-professionals.py .github/workflows/show-all-role-shifts-to-professionals.yml
          git commit -m "Show all office shifts to matching professional roles"
          git push
