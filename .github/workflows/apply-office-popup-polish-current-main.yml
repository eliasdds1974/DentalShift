name: Apply office popup polish current main
on:
  push:
    branches: [fix/office-popup-polish-current-main]
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/office-popup-polish-current-main
      - name: Apply patch
        run: python scripts/patch_office_popup_polish.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          rm scripts/patch_office_popup_polish.py .github/workflows/apply-office-popup-polish-current-main.yml
          git add app/page.tsx components/OfficeWorkspaceV2.tsx scripts/patch_office_popup_polish.py .github/workflows/apply-office-popup-polish-current-main.yml
          git commit -m "Polish office post shift popup and software options"
          git push origin HEAD:fix/office-popup-polish-current-main
