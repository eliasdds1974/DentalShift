name: Hide booked match cards

on:
  push:
    paths:
      - '.github/workflows/hide-booked-match-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/hide-booked-match-cards.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx
          git commit -m "Hide booked professionals from active match cards" || exit 0
          git push
