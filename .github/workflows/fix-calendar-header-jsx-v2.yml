name: Fix calendar header JSX v2

on:
  push:
    paths:
      - '.github/workflows/fix-calendar-header-jsx-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix JSX structure
        run: |
          echo '' | base64 --decode > /tmp/fix.py
          python /tmp/fix.py
      - name: Commit source fix
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m 'Fix calendar header JSX structure'
          git push
