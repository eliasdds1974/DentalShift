name: Patch office Google location
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-office-google-location.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch office account Google location
        run: python3 .github/scripts/patch_office_google.py
      - name: Verify patch
        run: |
          grep -F 'Clinic location' app/page.tsx
          grep -F 'google_place_id: office.google_place_id' lib/dentalshift.ts
          grep -F 'name: initialAddress?.name' components/GoogleAddressAutocomplete.tsx
      - name: Commit
        run: |
          git config user.name 'eliasdds1974'
          git config user.email 'eliasdds@gmail.com'
          git add app/page.tsx lib/dentalshift.ts components/GoogleAddressAutocomplete.tsx
          git commit -m 'Use Google office search for office account location'
          git push
