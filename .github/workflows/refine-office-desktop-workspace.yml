name: Refine office desktop workspace
on:
  push:
    paths:
      - '.github/workflows/refine-office-desktop-workspace.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine office desktop calendar and selected day panel
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/OfficeWorkspaceV2.tsx')
          s = p.read_text()
          def r(old,new,label):
            global s
            if old not in s: raise SystemExit('Missing '+label)
            s=s.replace(old,new,1)

          r('''      </div> : <div className="grid md:grid-cols-[minmax(0,1.8fr)_minmax(300px,.72fr)]">''','''      </div> : <div className="grid lg:grid-cols-[minmax(0,3fr)_minmax(340px,1fr)]">''','desktop 75 25 grid')
          r('''        <div className="border-b border-slate-200 p-3 sm:p-5 md:border-b-0 md:border-r">''','''        <div className="border-b border-slate-200 p-3 sm:p-5 lg:border-b-0 lg:border-r">''','calendar border')
          r('''        <aside ref={resultsRef} className="scroll-mt-[92px] border-t border-slate-200 bg-white p-4 sm:p-5 lg:border-t-0">''','''        <aside ref={resultsRef} className="scroll-mt-[92px] border-t border-slate-200 bg-white p-4 sm:p-5 lg:border-t-0 lg:p-0"><div className="lg:sticky lg:top-[84px] lg:max-h-[calc(100vh-100px)] lg:overflow-y-auto lg:p-5">''','sticky panel')
          r('''          </div>
        </aside>
      </div>}''','''          </div>
          </div>
        </aside>
      </div>}''','sticky close')
          r('''<h3 className="mb-4 text-center text-xl font-black text-white sm:text-2xl">Shift(s) Posted</h3>''','''<h3 className="mb-4 text-center text-xl font-black text-white sm:text-2xl">Posted Shifts</h3>''','posted label')
          r('''<h4 className="mb-3 text-center text-lg font-black text-white">Who’s Interested</h4>''','''<h4 className="mb-3 text-center text-lg font-black text-white">Applicants</h4>''','applicant label')
          r('''<p className="text-xs font-black uppercase tracking-wide text-slate-500">Available matches</p>''','''<p className="text-xs font-black uppercase tracking-wide text-slate-500">Available Professionals</p>''','available matches label')
          r('''{selectedAvailability.length > 0 && <AnonymousAvailableStaffPanel staff={anonymousStaff} />}''','''{selectedAvailability.length > 0 && <section><div className="mb-2 flex items-center justify-between gap-2"><h3 className="text-base font-black text-[#002757]">Available Professionals</h3><span className="rounded-full bg-slate-100 px-2 py-1 text-[10px] font-black text-slate-600">{selectedAvailability.length} available</span></div><AnonymousAvailableStaffPanel staff={anonymousStaff} /></section>}''','available professionals section')
          r('''{selectedBookings.map((booking) => <article key={booking.id}''','''{selectedBookings.length > 0 && <h3 className="pt-1 text-base font-black text-[#002757]">Booked</h3>}{selectedBookings.map((booking) => <article key={booking.id}''','booked heading')

          # Desktop-friendly selected date header with quick counts.
          old='''<div className="flex items-start justify-between gap-3"><div><p className="text-xs font-black uppercase tracking-[.12em] text-[#0078FE]">Selected date</p><h3 className="mt-1 text-xl font-black text-[#0f172a]">{longDate(selectedDate)}</h3></div><span className="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-black text-slate-600">Office</span></div>
          <div className="my-5 border-t border-slate-200" />'''
          new='''<div><p className="text-xs font-black uppercase tracking-[.12em] text-[#0078FE]">Selected date</p><h3 className="mt-1 text-xl font-black text-[#0f172a]">{longDate(selectedDate)}</h3><div className="mt-3 flex flex-wrap gap-2 text-[10px] font-black"><span className="rounded-full bg-[#4285F4]/10 px-2.5 py-1 text-[#2f6fd0]">{selectedShifts.length} Posted</span><span className="rounded-full bg-[#FBBC05]/20 px-2.5 py-1 text-amber-800">{selectedShifts.reduce((n, shift) => n + (shift.applications || []).filter((a) => a.status === "applied").length, 0)} Applicants</span><span className="rounded-full bg-slate-100 px-2.5 py-1 text-slate-600">{selectedAvailability.length} Available Professionals</span><span className="rounded-full bg-[#34A853]/15 px-2.5 py-1 text-[#278841]">✓ {selectedBookings.length} Booked</span></div></div>
          <div className="my-4 border-t border-slate-200" />'''
          r(old,new,'selected day summary')

          p.write_text(s)
          PY
      - name: Commit source update
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Refine office desktop calendar workspace'
          git push
