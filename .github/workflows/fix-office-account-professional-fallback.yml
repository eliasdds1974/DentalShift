name: Fix office account professional fallback

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_office_account_professional_fallback.py'
      - '.github/workflows/fix-office-account-professional-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix office account fallback
        run: python .github/scripts/fix_office_account_professional_fallback.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Keep office account on office form"
            git push
          fi
