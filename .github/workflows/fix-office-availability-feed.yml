name: Fix office availability feed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-office-availability-feed.yml'
      - '.github/scripts/fix_office_availability_feed.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch office availability communication
        run: python .github/scripts/fix_office_availability_feed.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/dentalshift.ts components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use secure nearby availability feed for office portal"
            git push
          fi
