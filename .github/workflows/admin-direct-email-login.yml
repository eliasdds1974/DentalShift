name: Admin direct email login
on:
  push:
    paths:
      - '.github/workflows/admin-direct-email-login.yml'
      - '.github/scripts/patch_admin_login.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch admin login flow
        run: python .github/scripts/patch_admin_login.py
      - name: Verify patch
        run: |
          grep -q 'Admin email sign in' app/page.tsx
          grep -q 'onAdmin={() =>' app/page.tsx
          grep -q 'emailPortalRole === "admin"' app/page.tsx
      - name: Commit
        run: |
          git config user.name 'eliasdds1974'
          git config user.email 'eliasdds@gmail.com'
          git rm .github/workflows/admin-direct-email-login.yml .github/scripts/patch_admin_login.py
          git add app/page.tsx
          git commit -m 'Route temporary admin to admin email login'
          git push
