name: Integrate Preferred First marketplace

on:
  push:
    paths:
      - '.github/workflows/integrate-preferred-first.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Preferred First integration patch
        run: python .github/scripts/integrate-preferred-first.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit Preferred First integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dentalshift.ts components/AnonymousAvailableStaffPanel.tsx components/OfficeWorkspaceV2.tsx components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Preferred First posting and priority views"
          git push
