name: Update office calendar Posted Shift label

on:
  push:
    paths:
      - '.github/scripts/update-posted-shift-calendar-label.py'
      - '.github/workflows/update-posted-shift-calendar-label.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Posted Shift label update
        run: python .github/scripts/update-posted-shift-calendar-label.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit refinement
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Improve office calendar Posted Shift wording"
            git push
          fi
