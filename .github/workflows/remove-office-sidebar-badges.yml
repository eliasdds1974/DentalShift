name: Remove office sidebar badges
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/remove-office-sidebar-badges.py'
      - '.github/workflows/remove-office-sidebar-badges.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/remove-office-sidebar-badges.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Remove office sidebar date badges" && git push; fi
