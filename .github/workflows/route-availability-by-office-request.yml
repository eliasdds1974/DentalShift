name: Route availability by office request

on:
  push:
    paths:
      - "scripts/route-availability-by-office-request.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/route-availability-by-office-request.py
      - run: npm install --no-audit --no-fund && npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet || git commit -m "Show availability in sidebar for office request days"
          git push
