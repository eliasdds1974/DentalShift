name: Set DentalJobs top 3 ads 4

on:
  push:
    paths:
      - '.github/scripts/set-dentaljobs-top3-ads4.py'
      - '.github/workflows/set-dentaljobs-top3-ads4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout changes
        run: python .github/scripts/set-dentaljobs-top3-ads4.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/classifieds/page.tsx components/DentalJobsNativeMarketplace.tsx
          git diff --cached --quiet || git commit -m "Set DentalJobs top actions to 3 columns and ads to 4"
          git push
