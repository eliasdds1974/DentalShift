name: Remove Preferred First notes

on:
  push:
    paths:
      - 'scripts/remove-preferred-first-notes.py'
      - '.github/workflows/remove-preferred-first-notes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply notes removal patch
        run: python scripts/remove-preferred-first-notes.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit notes removal
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add components/PreferredFirstPostShiftModal.tsx components/PreferredFirstPostAvailabilityModal.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove notes from Preferred First posting forms"
            git push origin main
          fi
