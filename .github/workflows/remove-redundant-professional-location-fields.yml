name: Remove redundant professional location fields

on:
  push:
    paths:
      - "scripts/remove-redundant-professional-location-fields.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/remove-redundant-professional-location-fields.py
      - run: npm install --no-audit --no-fund && npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet || git commit -m "Remove redundant professional location fields"
          git push
