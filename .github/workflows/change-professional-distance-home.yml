name: Change professional DentalJobs distance label

on:
  push:
    paths:
      - '.github/scripts/change-professional-distance-home.py'
      - '.github/workflows/change-professional-distance-home.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply label change
        run: python .github/scripts/change-professional-distance-home.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/DentalJobsNativeMarketplace.tsx
          git diff --cached --quiet || git commit -m "Change professional DentalJobs distance label to home"
          git push
