name: Passwordless migration

on:
  push:
    paths:
      - '.github/workflows/passwordless-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply passwordless auth changes
        run: node scripts/migrate-passwordless.mjs
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit source changes
        run: |
          git config user.name "DentalShift Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Use passwordless email verification for all accounts"
          git push
