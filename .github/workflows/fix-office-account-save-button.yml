name: Fix office account save button

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_office_account_save_button.py'
      - '.github/workflows/fix-office-account-save-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix office account save button
        run: python .github/scripts/fix_office_account_save_button.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix office account save button"
            git push
          fi
