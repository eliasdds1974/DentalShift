name: Fix CPR expiry renewal build

on:
  push:
    paths:
      - '.github/workflows/fix-cpr-expiry-renewal-build.yml'
      - '.github/scripts/fix-cpr-expiry-renewal-build.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CPR expiry renewal patch and build fix
        run: python .github/scripts/fix-cpr-expiry-renewal-build.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee cpr-renewal-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpr-renewal-build-log-fixed
          path: cpr-renewal-build.log
          if-no-files-found: ignore
      - name: Commit changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/page.tsx lib/dentalshift.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add CPR expiry review and renewal grace flow"
            git push
          fi
