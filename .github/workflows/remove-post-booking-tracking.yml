name: Remove post-booking tracking

on:
  push:
    paths:
      - '.github/scripts/remove-post-booking-tracking.py'
      - '.github/workflows/remove-post-booking-tracking.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/remove-post-booking-tracking.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspace.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "End workflow at confirmed booking handoff"
            git push origin main
          fi
