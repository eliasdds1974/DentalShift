name: Fix Office View Shift software experience

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-office-view-shift-software.py'
      - '.github/workflows/fix-office-view-shift-software.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Office View Shift software patch
        run: python .github/scripts/fix-office-view-shift-software.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit Office View Shift software experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dentalshift.ts components/OfficeWorkspaceV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use professional software experience in Office View Shift"
          git push
