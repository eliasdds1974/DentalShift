name: Default DentalJobs office location

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/default-dentaljobs-office-location.py'
      - '.github/workflows/default-dentaljobs-office-location.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply office location defaults
        run: python .github/scripts/default-dentaljobs-office-location.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified application change
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/classifieds/page.tsx
          if git diff --cached --quiet; then
            echo "No application change needed"
          else
            git commit -m "Default job location from office account"
            git push
          fi
