name: Apply professional availability office matching

on:
  push:
    branches:
      - fix/professional-availability-office-radius
    paths:
      - scripts/patch_professional_availability_to_offices.py
      - .github/workflows/apply-professional-availability-office-radius.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply professional availability matching patch
        run: python scripts/patch_professional_availability_to_offices.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source changes and remove helpers
        run: |
          rm scripts/patch_professional_availability_to_offices.py
          rm .github/workflows/apply-professional-availability-office-radius.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx components/AnonymousAvailableStaffPanel.tsx lib/dentalshift.ts scripts/patch_professional_availability_to_offices.py .github/workflows/apply-professional-availability-office-radius.yml
          git commit -m "Match professional availability to offices by professional travel radius"
          git push
