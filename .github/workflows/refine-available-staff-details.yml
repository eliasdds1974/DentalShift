name: Refine available staff details
on:
  push:
    paths:
      - '.github/workflows/refine-available-staff-details.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update available staff details and sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('lib/dentalshift.ts')
          s = lib.read_text()
          old = 'professional_profiles: { profession: string; licence_province: string; rating: number; completed_shifts: number; reliability_score: number; hourly_rate: number | null } | null;'
          new = 'professional_profiles: { profession: string; licence_province: string; rating: number; completed_shifts: number; reliability_score: number; hourly_rate: number | null; years_experience: number | null } | null;'
          if old not in s:
              raise SystemExit('AvailableProfessionalSlot type anchor not found')
          s = s.replace(old, new, 1)
          old = 'professional_profiles!availability_professional_id_fkey(profession,licence_province,rating,completed_shifts,reliability_score,hourly_rate)'
          new = 'professional_profiles!availability_professional_id_fkey(profession,licence_province,rating,completed_shifts,reliability_score,hourly_rate,years_experience)'
          if old not in s:
              raise SystemExit('availability select anchor not found')
          lib.write_text(s.replace(old, new, 1))

          office = Path('components/OfficeWorkspaceV2.tsx')
          s = office.read_text()
          old = '<span className="mt-2 inline-block rounded-lg bg-[#04A62F] px-3 py-2 text-[11px] font-black text-white">{shortTime(slot.starts_at)}–{shortTime(slot.ends_at)}</span>'
          new = '<span className="mt-2 inline-block rounded-lg bg-[#04A62F] px-3 py-2 text-xs font-black text-white">{shortTime(slot.starts_at)}–{shortTime(slot.ends_at)}</span>'
          if old not in s:
              raise SystemExit('time badge anchor not found')
          s = s.replace(old, new, 1)
          old = '<span className="shrink-0 rounded-lg bg-[#04A62F] px-3 py-2 text-[11px] font-black uppercase tracking-wide text-white">Available</span>'
          new = '<span className="shrink-0 rounded-lg bg-[#04A62F] px-3 py-2 text-xs font-black uppercase tracking-wide text-white">Available</span>'
          if old not in s:
              raise SystemExit('available badge anchor not found')
          s = s.replace(old, new, 1)
          old = '<div className="mt-3 grid grid-cols-2 gap-2 text-[11px] font-bold text-slate-600">'
          new = '<div className="mt-3 grid grid-cols-2 gap-2 text-xs font-bold leading-tight text-slate-600">'
          if old not in s:
              raise SystemExit('detail grid anchor not found')
          s = s.replace(old, new, 1)
          old = '<span>Province: <strong className="text-[#032757]">{profile?.licence_province || "—"}</strong></span>'
          new = '<span>Experience: <strong className="text-[#032757]">{profile?.years_experience != null ? `${profile.years_experience} ${profile.years_experience === 1 ? "yr" : "yrs"}` : "—"}</strong></span>'
          if old not in s:
              raise SystemExit('province detail anchor not found')
          office.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/dentalshift.ts components/OfficeWorkspaceV2.tsx
          git commit -m 'Show experience and enlarge available staff details'
          git push
