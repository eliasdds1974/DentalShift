name: Diagnose Next build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-next-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
