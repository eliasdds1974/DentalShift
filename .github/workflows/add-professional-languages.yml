name: Add professional languages

on:
  push:
    paths:
      - '.github/workflows/add-professional-languages.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply professional languages patch
        run: python .github/scripts/add-professional-languages.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit professional languages support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx lib/dentalshift.ts components/OfficeWorkspaceV2.tsx components/AnonymousAvailableStaffPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add professional languages across account and staffing details"
          git push
