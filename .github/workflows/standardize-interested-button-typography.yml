name: Standardize interested button typography
on:
  push:
    paths:
      - '.github/workflows/standardize-interested-button-typography.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply typography patch
        run: python .github/scripts/standardize-interested-button-typography.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx components/AnonymousAvailableStaffPanel.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Standardize I'm Interested button typography"
          git push
