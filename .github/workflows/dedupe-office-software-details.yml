name: Dedupe office software details
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/dedupe-office-software-details.py'
      - '.github/workflows/dedupe-office-software-details.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/dedupe-office-software-details.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Remove duplicate office software display" && git push; fi
