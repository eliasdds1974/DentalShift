name: Unify sign out button styling
on:
  push:
    paths:
      - '.github/workflows/unify-signout-buttons.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update sign out button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'className="inline-flex items-center gap-2 rounded-xl border border-[#8f1d2c] bg-[#8f1d2c] px-3 py-2 text-sm font-extrabold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-[#741723] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#8f1d2c]/25"'
          new = 'className="inline-flex items-center gap-2 rounded-xl border border-[#24547f] bg-[#24547f] px-3 py-2 text-sm font-black text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-[#163f68] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#24547f]/30"'
          if old not in s:
              raise SystemExit('Current sign out button class not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Use brand-aligned bold sign out button'
          git push
