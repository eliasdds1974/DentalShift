name: Align header actions to DentalShift logo
on:
  push:
    paths:
      - '.github/workflows/unify-signout-buttons.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact logo colors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, colorsys
          from collections import Counter

          logo = Path('public/dentalshift-logo.svg').read_text()
          fills = re.findall(r'fill="#([0-9A-Fa-f]{6})"', logo)
          counts = Counter(c.upper() for c in fills)

          def hsv(hexv):
              r,g,b = [int(hexv[i:i+2],16)/255 for i in (0,2,4)]
              return colorsys.rgb_to_hsv(r,g,b)

          yellow_candidates = []
          green_candidates = []
          for c,n in counts.items():
              h,s,v = hsv(c)
              if 0.10 <= h <= 0.20 and s >= 0.35 and v >= 0.45:
                  yellow_candidates.append((n,s,v,c))
              if 0.22 <= h <= 0.48 and s >= 0.35 and v >= 0.30:
                  green_candidates.append((n,s,v,c))

          if not yellow_candidates:
              raise SystemExit('No yellow logo color found')
          if not green_candidates:
              raise SystemExit('No green logo color found')

          yellow = max(yellow_candidates)[3]
          green = max(green_candidates)[3]
          dental = '032757'

          def darken(hexv, factor=0.82):
              r,g,b = [int(hexv[i:i+2],16) for i in (0,2,4)]
              return ''.join(f'{max(0,min(255,round(x*factor))):02X}' for x in (r,g,b))

          page = Path('app/page.tsx')
          s = page.read_text()

          old_account = 'className="inline-flex items-center gap-2 rounded-xl border border-[#002757] bg-[#002757] px-3 py-2 text-sm font-extrabold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-[#001b3d] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#002757]/30"'
          new_account = f'className="inline-flex items-center gap-2 rounded-xl border border-[#{yellow}] bg-[#{yellow}] px-3 py-2 text-sm font-black text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-[#{darken(yellow)}] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#{yellow}]/30"'

          old_messages = 'className="inline-flex items-center gap-2 rounded-xl border border-[#017f27] bg-[#017f27] px-3 py-2 text-sm font-extrabold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-[#00681f] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#017f27]/25"'
          new_messages = f'className="inline-flex items-center gap-2 rounded-xl border border-[#{green}] bg-[#{green}] px-3 py-2 text-sm font-black text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-[#{darken(green)}] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#{green}]/30"'

          old_signout = 'className="inline-flex items-center gap-2 rounded-xl border border-[#24547f] bg-[#24547f] px-3 py-2 text-sm font-black text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-[#163f68] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#24547f]/30"'
          new_signout = f'className="inline-flex items-center gap-2 rounded-xl border border-[#{dental}] bg-[#{dental}] px-3 py-2 text-sm font-black text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-[#{darken(dental)}] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#{dental}]/30"'

          for old,new,label in [(old_account,new_account,'Account'),(old_messages,new_messages,'Messages'),(old_signout,new_signout,'Sign out')]:
              if old not in s:
                  raise SystemExit(f'{label} button class not found')
              s = s.replace(old,new,1)

          # Keep any secondary Sign out variant consistent with the Dental word color.
          s = s.replace('className="secondary-btn text-rose-700 hover:border-rose-200 hover:bg-rose-50"', new_signout)

          page.write_text(s)
          print(f'Dental color: #{dental}')
          print(f'Yellow color: #{yellow}')
          print(f'Green color: #{green}')
          PY
      - name: Commit changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Align header buttons to exact logo colors'
          git push
