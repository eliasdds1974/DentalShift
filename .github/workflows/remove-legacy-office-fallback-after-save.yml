name: Keep current office portal after account save

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/remove_legacy_office_fallback_after_save.py'
      - '.github/workflows/remove-legacy-office-fallback-after-save.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy office fallback
        run: python .github/scripts/remove_legacy_office_fallback_after_save.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Keep current office portal after account save"
            git push
          fi
