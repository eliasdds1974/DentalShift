name: Fix mobile Back To Calendar buttons

on:
  push:
    paths:
      - '.github/scripts/fix-mobile-back-calendar.py'
      - '.github/workflows/fix-mobile-back-calendar.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile Back To Calendar updates
        run: python .github/scripts/fix-mobile-back-calendar.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit refinement
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix mobile Back To Calendar buttons"
            git push
          fi
