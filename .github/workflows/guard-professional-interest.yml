name: Guard professional interest actions
on:
  push:
    paths:
      - '.github/workflows/guard-professional-interest.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Guard interest actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/WorkflowWorkspaceV2.tsx')
          s = p.read_text()
          old = 'const minimumHourlyRate = Number(details?.professional?.hourly_rate || 0);'
          new = 'const minimumHourlyRate = Number(details?.professional?.hourly_rate || 0);\n  const professionalVerified = details?.professional?.licence_status === "verified";'
          if old not in s:
            raise SystemExit('minimumHourlyRate marker not found')
          s = s.replace(old, new, 1)
          old = 'disabled={busy === application.id} onClick={() => void act(application.id, () => respondToInvitation(application.id, true))} className="primary-btn mt-2 w-full justify-center">{busy === application.id ? "Booking…" : "I’m Interested"}'
          new = 'disabled={!professionalVerified || busy === application.id} onClick={() => void act(application.id, () => respondToInvitation(application.id, true))} className="primary-btn mt-2 w-full justify-center">{!professionalVerified ? "Verification required" : busy === application.id ? "Booking…" : "I’m Interested"}'
          if old not in s:
            raise SystemExit('invited interest button marker not found')
          s = s.replace(old, new, 1)
          old = 'disabled={busy === `apply-${shift.id}`} onClick={() => void act(`apply-${shift.id}`, () => applyForShift({ shiftId: shift.id, professionalId: userId }))} className="primary-btn w-full justify-center">{busy === `apply-${shift.id}` ? "Saving…" : "I’m Interested"}'
          new = 'disabled={!professionalVerified || busy === `apply-${shift.id}`} onClick={() => void act(`apply-${shift.id}`, () => applyForShift({ shiftId: shift.id, professionalId: userId }))} className="primary-btn w-full justify-center">{!professionalVerified ? "Verification required" : busy === `apply-${shift.id}` ? "Saving…" : "I’m Interested"}'
          if old not in s:
            raise SystemExit('apply interest button marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -F 'const professionalVerified = details?.professional?.licence_status === "verified"' components/WorkflowWorkspaceV2.tsx
          grep -F 'Verification required' components/WorkflowWorkspaceV2.tsx
      - name: Commit
        run: |
          rm .github/workflows/guard-professional-interest.yml
          git config user.name 'eliasdds1974'
          git config user.email 'eliasdds@gmail.com'
          git add components/WorkflowWorkspaceV2.tsx .github/workflows/guard-professional-interest.yml
          git commit -m 'Guard interest actions until verification'
          git push origin main
