name: Switch DentalShift to passwordless email sign-in
on:
  push:
    paths:
      - '.github/workflows/switch-to-passwordless-email.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert account access to email verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/page.tsx')
          s=p.read_text()

          start=s.index('  const submit = async (event: React.FormEvent<HTMLFormElement>) => {')
          end=s.index('  const sendPasswordReset = async () => {', start)
          new_submit='''  const submit = async (event: React.FormEvent<HTMLFormElement>) => {
    event.preventDefault();
    setBusy(true);
    setError("");
    setNotice("");
    const form = new FormData(event.currentTarget);
    const email = String(form.get("email") || "").trim().toLowerCase();
    const metadata = mode === "signup" ? {
      role,
      first_name: String(form.get("first_name") || ""),
      last_name: String(form.get("last_name") || ""),
      office_name: String(form.get("office_name") || ""),
      profession: String(form.get("profession") || ""),
      licence_number: String(form.get("licence_number") || ""),
      address: String(form.get("address") || ""),
      city: String(form.get("city") || ""),
      province: String(form.get("province") || "BC"),
      postal_code: String(form.get("postal_code") || ""),
      google_place_id: String(form.get("google_place_id") || ""),
      latitude: String(form.get("latitude") || ""),
      longitude: String(form.get("longitude") || ""),
    } : undefined;

    if (mode === "signup" && metadata && (!metadata.address || !metadata.city || !metadata.province || !metadata.postal_code || (role === "office" && !metadata.office_name))) {
      setError("Select an address from Google or enter the complete address manually.");
      setBusy(false);
      return;
    }

    window.localStorage.setItem("dentalshift_email_signin_role", role);
    const redirectTo = `${window.location.origin}/?portal_role=${role}`;
    const { error: emailError } = await supabase.auth.signInWithOtp({
      email,
      options: {
        shouldCreateUser: mode === "signup",
        emailRedirectTo: redirectTo,
        ...(metadata ? { data: metadata } : {}),
      },
    });

    if (emailError) {
      setError(mode === "signin" ? "We could not send your secure sign-in email. Check the email address and try again." : emailError.message);
    } else {
      setResetEmailAddress(email);
      setResetEmailSent(true);
      setNotice("");
    }
    setBusy(false);
  };

'''
          s=s[:start]+new_submit+s[end:]

          # Remove legacy password-reset implementation; passwordless access makes it unnecessary.
          reset_start=s.index('  const sendPasswordReset = async () => {')
          reset_end=s.index('  const saveProfile = async', reset_start)
          s=s[:reset_start]+s[reset_end:]

          # Remove password input and forgot-password link, and update CTA.
          s=s.replace('''            <label className="field sm:col-span-2"><span>Password</span><input name="password" type="password" minLength={8} required /></label>\n''','')
          s=s.replace('''            {mode === "signin" && <button type="button" onClick={() => void sendPasswordReset()} disabled={busy} className="justify-self-start text-sm font-extrabold text-[#002757] underline underline-offset-4 sm:col-span-2">Forgot password?</button>}\n''','')
          s=s.replace('''            <button disabled={busy} className="primary-btn sm:col-span-2">{busy ? "Please wait…" : mode === "signin" ? "Sign in securely" : "Create account"}</button>''','''            <p className="text-xs leading-5 text-slate-500 sm:col-span-2">DentalShift will email you a secure one-time sign-in link. No password is required.</p>\n            <button disabled={busy} className="primary-btn sm:col-span-2">{busy ? "Sending secure email…" : mode === "signin" ? "Email me a sign-in link" : "Create account & verify email"}</button>''')

          # The existing confirmation screen is now used for both sign-in and account creation.
          s=s.replace('''<h3 className="mt-6 text-2xl font-extrabold tracking-tight text-[#002757]">Password setup email sent</h3>''','''<h3 className="mt-6 text-2xl font-extrabold tracking-tight text-[#002757]">Secure sign-in email sent</h3>''')
          s=s.replace('''<p className="font-extrabold text-[#002757]">What to do next</p><ol className="mt-3 space-y-2 text-sm leading-6 text-slate-600"><li><strong className="text-[#002757]">1.</strong> Check your inbox and junk folder.</li><li><strong className="text-[#002757]">2.</strong> Open the email from DentalShift.</li><li><strong className="text-[#002757]">3.</strong> Select the secure link and create a new password for the account type you chose.</li></ol>''','''<p className="font-extrabold text-[#002757]">What to do next</p><ol className="mt-3 space-y-2 text-sm leading-6 text-slate-600"><li><strong className="text-[#002757]">1.</strong> Check your inbox and junk folder.</li><li><strong className="text-[#002757]">2.</strong> Open the email from DentalShift.</li><li><strong className="text-[#002757]">3.</strong> Select the secure link to enter the account type you chose.</li></ol>''')
          s=s.replace('''For security, the message is the same whether or not the address is registered.''','''For security, DentalShift does not reveal whether an email address is registered.''')

          # Remove password language from cross-workspace account copy.
          s=s.replace('''Use the same email address for both sides of DentalShift. Your Dental Office and Dental Professional accounts can have different passwords. Professional verification is handled separately.''','''Use the same email address for both sides of DentalShift. Each time you sign in, choose the workspace you want and verify through your email. Professional verification is handled separately.''')
          s=s.replace('''Keep the same email address, then complete a separate professional verification profile. Your Professional account can use its own password.''','''Keep the same email address, then complete a separate professional verification profile. You will choose the Professional workspace when signing in by email.''')
          s=s.replace('''Office account saved. Your Dental Professional workspace can use the same email with its own password.''','''Office account saved. Your Dental Professional workspace can use the same email and passwordless verification.''')

          # Carry the chosen workspace through the emailed link, even when it opens in a new tab/browser context.
          needle='''    supabase.auth.getSession().then(({ data }) => syncAccount(data.session));\n    const { data: listener } = supabase.auth.onAuthStateChange((event, nextSession) => {\n      const savedRecoveryRole = window.localStorage.getItem("dentalshift_password_recovery_role");'''
          replacement='''    const emailPortalRole = new URLSearchParams(window.location.search).get("portal_role");\n    if (emailPortalRole === "office" || emailPortalRole === "professional") {\n      window.sessionStorage.setItem("dentalshift_signin_role", emailPortalRole);\n      window.localStorage.setItem("dentalshift_portal_role", emailPortalRole);\n    }\n    supabase.auth.getSession().then(({ data }) => syncAccount(data.session));\n    const { data: listener } = supabase.auth.onAuthStateChange((event, nextSession) => {\n      const portalRole = new URLSearchParams(window.location.search).get("portal_role");\n      if (event === "SIGNED_IN" && (portalRole === "office" || portalRole === "professional")) {\n        window.sessionStorage.setItem("dentalshift_signin_role", portalRole);\n        window.localStorage.setItem("dentalshift_portal_role", portalRole);\n      }\n      const savedRecoveryRole = window.localStorage.getItem("dentalshift_password_recovery_role");'''
          if needle not in s: raise SystemExit('auth listener anchor not found')
          s=s.replace(needle,replacement,1)

          p.write_text(s)
          PY
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit source
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Use passwordless email verification for account access'
          git push
