name: Refine professional Still Looking card
on:
  push:
    paths:
      - 'scripts/refine-professional-still-looking-card.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Still Looking card
        run: python scripts/refine-professional-still-looking-card.py
      - name: Commit source change
        run: |
          if git diff --quiet -- components/WorkflowWorkspaceV2.tsx; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m "Refine professional Still Looking card"
          git push
