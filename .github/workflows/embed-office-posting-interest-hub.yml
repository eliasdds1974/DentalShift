name: Embed office posting interest hub

on:
  push:
    paths:
      - '.github/scripts/embed-office-posting-interest-hub.py'
      - '.github/workflows/embed-office-posting-interest-hub.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply office posting interest hub
        run: python3 .github/scripts/embed-office-posting-interest-hub.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/classifieds/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Embed professional interest in office postings"
          git push origin main
