name: Add professional interest clock
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add-professional-interest-clock.py'
      - '.github/workflows/add-professional-interest-clock.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add professional interest clock
        run: python .github/scripts/add-professional-interest-clock.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Show clock on professional interest timer"
            git push
          fi
