name: Match office calendar controls
on:
  push:
    paths:
      - '.github/workflows/match-office-calendar-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match office summary cards and calendar selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/OfficeWorkspaceV2.tsx')
          s = p.read_text()

          s = s.replace('type CalendarView = "month" | "week";', 'type CalendarView = "month" | "week" | "list";', 1)

          old = '''      <div className="grid gap-3 border-b border-slate-200 p-3 sm:p-4 lg:grid-cols-[minmax(0,1fr)_170px]">
        <div className="contents">
          <div className="min-w-0 lg:col-start-1 lg:row-start-1">
            <h2 className="text-xl font-black tracking-tight text-[#032757] sm:text-2xl">Office calendar</h2>
            <p className="mt-1 text-xs font-bold text-[#032757]">Manage every shift from posting through confirmation.</p>
          </div>
          <div className="grid w-full gap-1 sm:w-[170px] lg:col-start-2 lg:row-span-2 lg:row-start-1 lg:shrink-0">
            <button type="button" onClick={onPost} className="group flex h-9 w-full items-center gap-2 rounded-xl border-2 border-[#0078FE]/35 bg-gradient-to-r from-blue-50 to-white px-2.5 text-left shadow-sm transition hover:-translate-y-0.5 hover:border-[#0078FE]/70 hover:shadow-md"><CalendarDays size={15} className="text-[#0078FE]" /><span><span className="block text-[10px] font-extrabold text-slate-500">Open shifts</span><strong className="block text-sm leading-none text-[#032757]">{openShifts.length}</strong></span></button>
            <button type="button" className="group flex h-9 w-full items-center gap-2 rounded-xl border-2 border-amber-300 bg-gradient-to-r from-amber-50 to-white px-2.5 text-left shadow-sm transition hover:-translate-y-0.5 hover:border-amber-500 hover:shadow-md"><UsersRound size={15} className="text-amber-700" /><span><span className="block text-[10px] font-extrabold text-slate-500">Applicants</span><strong className="block text-sm leading-none text-[#032757]">{applicantCount}</strong></span></button>
            <button type="button" className="group flex h-9 w-full items-center gap-2 rounded-xl border-2 border-[#04A62F]/35 bg-gradient-to-r from-[#eaf8ee] to-white px-2.5 text-left shadow-sm transition hover:-translate-y-0.5 hover:border-[#04A62F]/70 hover:shadow-md"><Check size={15} className="text-[#04A62F]" /><span><span className="block text-[10px] font-extrabold text-slate-500">Booked</span><strong className="block text-sm leading-none text-[#032757]">{upcomingBookings.length}</strong></span></button>
          </div>
        </div>

        <div className="flex flex-wrap items-center gap-2 lg:col-start-1 lg:row-start-2 lg:self-end">
          <button type="button" aria-label="Previous period" onClick={() => moveCalendar(-1)} className="grid h-9 w-9 place-items-center rounded-xl border border-slate-200 bg-white text-[#032757] hover:bg-slate-50"><ChevronLeft size={17} /></button>
          <button type="button" onClick={() => { const now = new Date(); setCalendarCursor(now); setSelectedDate(localDateKey(now)); }} className="rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-black text-[#032757]">Today</button>
          <button type="button" aria-label="Next period" onClick={() => moveCalendar(1)} className="grid h-9 w-9 place-items-center rounded-xl border border-slate-200 bg-white text-[#032757] hover:bg-slate-50"><ChevronRight size={17} /></button>
          <div className="ml-1 flex rounded-xl bg-slate-100 p-1">
            {(["month", "week"] as CalendarView[]).map((mode) => <button key={mode} onClick={() => setCalendarView(mode)} className={`rounded-lg px-3 py-1.5 text-xs font-black capitalize ${calendarView === mode ? "bg-white text-[#032757] shadow-sm" : "text-slate-500"}`}>{mode}</button>)}
          </div>
        </div>
      </div>'''

          new = '''      <div className="grid gap-3 border-b border-slate-200 p-3 sm:p-4 md:grid-cols-[minmax(0,1fr)_170px]">
        <div className="contents">
          <div className="min-w-0 md:col-start-1 md:row-start-1">
            <h2 className="text-xl font-black tracking-tight text-[#032757] sm:text-2xl">Office calendar</h2>
            <p className="mt-1 text-xs font-bold text-[#032757]">Manage every shift from posting through confirmation.</p>
          </div>
          <div className="grid w-full gap-1 sm:w-[170px] md:col-start-2 md:row-span-2 md:row-start-1 md:shrink-0">
            <button type="button" onClick={onPost} className="group flex h-9 w-full items-center gap-2 rounded-xl border-2 border-[#0078FE]/35 bg-gradient-to-r from-blue-50 to-white px-2.5 text-left shadow-sm transition hover:-translate-y-0.5 hover:border-[#0078FE]/70 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#0078FE]/25"><CalendarDays size={15} className="text-[#0078FE]" /><span><span className="block text-[10px] font-extrabold text-slate-500">Open shifts</span><strong className="ml-auto block text-sm leading-none text-[#002757]">{openShifts.length}</strong></span></button>
            <button type="button" className="group flex h-9 w-full items-center gap-2 rounded-xl border-2 border-amber-300 bg-gradient-to-r from-amber-50 to-white px-2.5 text-left shadow-sm transition hover:-translate-y-0.5 hover:border-amber-500 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-amber-300/30"><UsersRound size={15} className="text-amber-700" /><span><span className="block text-[10px] font-extrabold text-slate-500">Applicants</span><strong className="ml-auto block text-sm leading-none text-[#002757]">{applicantCount}</strong></span></button>
            <button type="button" className="group flex h-9 w-full items-center gap-2 rounded-xl border-2 border-[#01A32E]/35 bg-gradient-to-r from-[#eaf8ee] to-white px-2.5 text-left shadow-sm transition hover:-translate-y-0.5 hover:border-[#01A32E]/70 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#01A32E]/20"><Check size={15} className="text-[#017f27]" /><span><span className="block text-[10px] font-extrabold text-slate-500">Booked</span><strong className="ml-auto block text-sm leading-none text-[#002757]">{upcomingBookings.length}</strong></span></button>
          </div>
        </div>

        <div className="flex flex-wrap items-center gap-2 md:col-start-1 md:row-start-2 md:self-end">
          <button type="button" aria-label="Previous period" onClick={() => moveCalendar(-1)} className="secondary-btn px-3"><ChevronLeft size={19} /></button>
          <button type="button" onClick={() => { const now = new Date(); setCalendarCursor(now); setSelectedDate(localDateKey(now)); }} className="secondary-btn">Today</button>
          <button type="button" aria-label="Next period" onClick={() => moveCalendar(1)} className="secondary-btn px-3"><ChevronRight size={19} /></button>
          <div className="ml-1 grid grid-cols-3 rounded-xl bg-slate-100 p-1">{(["month", "week", "list"] as CalendarView[]).map((mode) => <button type="button" key={mode} onClick={() => setCalendarView(mode)} className={`rounded-lg px-3 py-2 text-sm font-extrabold capitalize transition ${calendarView === mode ? "bg-[#0078FE] text-white shadow-sm" : "text-slate-600 hover:text-[#002757]"}`}>{mode}</button>)}</div>
        </div>
      </div>'''

          if old not in s:
              raise SystemExit('calendar header block not found')
          s = s.replace(old, new, 1)

          old_grid = '''      <div className="grid gap-0 xl:grid-cols-[minmax(0,1fr)_340px]">'''
          new_grid = '''      {calendarView === "list" ? <div className="grid gap-4 p-4 sm:p-5 lg:grid-cols-2">
        <div><h3 className="text-lg font-black text-[#002757]">Open shifts & applicants</h3><div className="mt-3 space-y-3">{openShifts.length ? openShifts.slice().sort((a, b) => new Date(a.starts_at).getTime() - new Date(b.starts_at).getTime()).map((shift) => { const role = roleStyles[roleCode(shift.profession)]; const applications = (shift.applications || []).filter((item) => item.status === "applied").length; return <button type="button" key={shift.id} onClick={() => { setSelectedDate(localDateKey(shift.starts_at)); setCalendarCursor(new Date(shift.starts_at)); setCalendarView("month"); }} className="w-full rounded-2xl border border-slate-200 p-4 text-left hover:bg-slate-50"><div className="flex items-center justify-between gap-2"><strong className="text-[#002757]">{shift.profession}</strong><span className={`rounded-full px-2 py-1 text-[10px] font-black ${role.soft} ${role.text}`}>{applications} applicant{applications === 1 ? "" : "s"}</span></div><p className="mt-1 text-xs text-slate-500">{new Date(shift.starts_at).toLocaleDateString("en-CA", { weekday: "short", month: "short", day: "numeric" })} · {shortTime(shift.starts_at)}–{shortTime(shift.ends_at)}</p></button>; }) : <p className="rounded-2xl bg-slate-50 p-5 text-sm text-slate-500">No open shifts right now.</p>}</div></div>
        <div><h3 className="text-lg font-black text-[#002757]">Confirmed bookings</h3><div className="mt-3 space-y-3">{upcomingBookings.length ? upcomingBookings.map((booking) => <button type="button" key={booking.id} onClick={() => { if (!booking.shifts) return; setSelectedDate(localDateKey(booking.shifts.starts_at)); setCalendarCursor(new Date(booking.shifts.starts_at)); setCalendarView("month"); }} className="w-full rounded-2xl border border-slate-200 p-4 text-left hover:bg-slate-50"><div className="flex items-center justify-between gap-2"><strong className="text-[#002757]">{booking.shifts?.profession || "Booked shift"}</strong><span className="rounded-full bg-[#eaf8ee] px-2 py-1 text-[10px] font-black text-[#017f27]">Booked</span></div>{booking.shifts && <p className="mt-1 text-xs text-slate-500">{new Date(booking.shifts.starts_at).toLocaleDateString("en-CA", { weekday: "short", month: "short", day: "numeric" })} · {shortTime(booking.shifts.starts_at)}–{shortTime(booking.shifts.ends_at)}</p>}</button>) : <p className="rounded-2xl bg-slate-50 p-5 text-sm text-slate-500">No upcoming bookings right now.</p>}</div></div>
      </div> : <div className="grid gap-0 xl:grid-cols-[minmax(0,1fr)_340px]">'''
          if old_grid not in s:
              raise SystemExit('main calendar grid start not found')
          s = s.replace(old_grid, new_grid, 1)

          marker = '''        </aside>\n      </div>\n    </section>'''
          replacement = '''        </aside>\n      </div>}\n    </section>'''
          if marker not in s:
              raise SystemExit('main calendar grid end not found')
          s = s.replace(marker, replacement, 1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Match office calendar controls to professional portal'
          git push