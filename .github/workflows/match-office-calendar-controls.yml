name: Match office calendar controls
on:
  push:
    paths:
      - '.github/workflows/match-office-calendar-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add_office_list_selector.py
      - run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Match office calendar selector to professional portal'
          git push