name: Refine My DentalJobs cards

on:
  push:
    paths:
      - '.github/workflows/refine-my-dentaljobs-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply My DentalJobs card refinements
        run: python3 .github/scripts/refine-my-dentaljobs-cards.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add app/classifieds/page.tsx
          git diff --cached --quiet || git commit -m "Refine professional and office DentalJobs cards"
          git push origin main
