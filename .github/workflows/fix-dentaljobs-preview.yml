name: Fix DentalJobs listing preview

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix-dentaljobs-preview.py'
      - '.github/workflows/fix-dentaljobs-preview.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply DentalJobs preview fix
        run: python .github/scripts/fix-dentaljobs-preview.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified application change
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/classifieds/page.tsx
          if git diff --cached --quiet; then
            echo "No application change needed"
          else
            git commit -m "Make DentalJobs preview show listing details"
            git push
          fi
