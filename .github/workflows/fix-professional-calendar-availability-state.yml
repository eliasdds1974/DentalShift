name: Fix professional calendar availability state
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-professional-calendar-availability-state.py'
      - '.github/workflows/fix-professional-calendar-availability-state.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix-professional-calendar-availability-state.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet || (git commit -m "Fix professional calendar availability state" && git push)
