name: Add temporary homepage admin button
on:
  push:
    paths:
      - .github/workflows/add-temporary-admin-home-button.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage admin access
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()

          old = 'function AccountModal({ close, session, profile, onSaved, activeRole = "professional", initialMode = "signin", initialRole = "office", passwordRecovery = false, onPasswordRecoveryComplete }: { close: () => void; session: Session | null; profile: AccountProfile | null; onSaved: () => void; activeRole?: Role; initialMode?: "signin" | "signup"; initialRole?: "office" | "professional"; passwordRecovery?: boolean; onPasswordRecoveryComplete?: () => void }) {'
          new = 'function AccountModal({ close, session, profile, onSaved, activeRole = "professional", initialMode = "signin", initialRole = "office", adminSignIn = false, passwordRecovery = false, onPasswordRecoveryComplete }: { close: () => void; session: Session | null; profile: AccountProfile | null; onSaved: () => void; activeRole?: Role; initialMode?: "signin" | "signup"; initialRole?: "office" | "professional"; adminSignIn?: boolean; passwordRecovery?: boolean; onPasswordRecoveryComplete?: () => void }) {'
          if old not in s: raise SystemExit('AccountModal signature not found')
          s = s.replace(old, new, 1)

          old = 'const [signInRoleChosen, setSignInRoleChosen] = useState(initialMode !== "signin");'
          new = 'const [signInRoleChosen, setSignInRoleChosen] = useState(initialMode !== "signin" || adminSignIn);'
          if old not in s: raise SystemExit('signInRoleChosen init not found')
          s = s.replace(old, new, 1)

          old = 'window.sessionStorage.setItem("dentalshift_signin_role", role);'
          new = 'window.sessionStorage.setItem("dentalshift_signin_role", adminSignIn ? "admin" : role);'
          if old not in s: raise SystemExit('signin role storage not found')
          s = s.replace(old, new, 1)

          old = 'window.localStorage.setItem("dentalshift_password_recovery_role", role);'
          new = 'window.localStorage.setItem("dentalshift_password_recovery_role", adminSignIn ? "admin" : role);'
          if old not in s: raise SystemExit('recovery role storage not found')
          s = s.replace(old, new, 1)

          old = 'mode === "signin" ? `Sign in as a ${role === "office" ? "Dental Office" : "Dental Professional"}` : "Create your account"'
          new = 'mode === "signin" ? (adminSignIn ? "Admin sign in" : `Sign in as a ${role === "office" ? "Dental Office" : "Dental Professional"}`) : "Create your account"'
          if old not in s: raise SystemExit('modal title expression not found')
          s = s.replace(old, new, 1)

          old = '{mode === "signin" && <div className="flex items-center justify-between rounded-2xl border border-[#002757]/15 bg-[#edf3fa] px-4 py-3 sm:col-span-2"><div className="flex items-center gap-3"><span className="grid h-9 w-9 place-items-center rounded-xl bg-[#002757] text-white">{role === "office" ? <Building2 size={18} /> : <UserRound size={18} />}</span><div><p className="text-xs font-bold text-slate-500">Signing in as</p><p className="text-sm font-extrabold text-[#002757]">{role === "office" ? "Dental Office" : "Dental Professional"}</p></div></div><button type="button" onClick={() => setSignInRoleChosen(false)} className="text-sm font-extrabold text-[#002757] underline underline-offset-4">Change</button></div>}'
          new = '{mode === "signin" && <div className="flex items-center justify-between rounded-2xl border border-[#002757]/15 bg-[#edf3fa] px-4 py-3 sm:col-span-2"><div className="flex items-center gap-3"><span className="grid h-9 w-9 place-items-center rounded-xl bg-[#002757] text-white">{adminSignIn ? <ShieldCheck size={18} /> : role === "office" ? <Building2 size={18} /> : <UserRound size={18} />}</span><div><p className="text-xs font-bold text-slate-500">Signing in as</p><p className="text-sm font-extrabold text-[#002757]">{adminSignIn ? "DentalShift Admin" : role === "office" ? "Dental Office" : "Dental Professional"}</p></div></div>{!adminSignIn && <button type="button" onClick={() => setSignInRoleChosen(false)} className="text-sm font-extrabold text-[#002757] underline underline-offset-4">Change</button>}</div>}'
          if old not in s: raise SystemExit('signin banner not found')
          s = s.replace(old, new, 1)

          old = 'const [accountOpen, setAccountOpen] = useState(false);\n  const [accountIntent, setAccountIntent] = useState<{ mode: "signin" | "signup"; role: "office" | "professional" }>({ mode: "signin", role: "office" });'
          new = 'const [accountOpen, setAccountOpen] = useState(false);\n  const [adminSignIn, setAdminSignIn] = useState(false);\n  const [accountIntent, setAccountIntent] = useState<{ mode: "signin" | "signup"; role: "office" | "professional" }>({ mode: "signin", role: "office" });'
          if old not in s: raise SystemExit('account state block not found')
          s = s.replace(old, new, 1)

          old = '        onSignIn={() => { void (async () => {\n          if (session) {'
          new = '        onSignIn={() => { setAdminSignIn(false); void (async () => {\n          if (session) {'
          if old not in s: raise SystemExit('MarketingHome onSignIn not found')
          s = s.replace(old, new, 1)

          old = '        onGetStarted={(nextRole) => { setAccountIntent({ mode: "signup", role: nextRole }); setAccountOpen(true); }}'
          new = '        onGetStarted={(nextRole) => { setAdminSignIn(false); setAccountIntent({ mode: "signup", role: nextRole }); setAccountOpen(true); }}'
          if old not in s: raise SystemExit('onGetStarted not found')
          s = s.replace(old, new, 1)

          old = '      />\n      {accountOpen && <AccountModal close={() => setAccountOpen(false)} session={session ?? null} profile={profile} activeRole={role} initialMode={accountIntent.mode} initialRole={accountIntent.role} passwordRecovery={passwordRecovery}'
          new = '      />\n      <div className="flex justify-center border-t border-slate-100 bg-white py-5"><button type="button" onClick={() => { if (session && profile?.role === "admin") { navigate("admin", "overview"); return; } setAdminSignIn(true); setAccountIntent({ mode: "signin", role: "office" }); setAccountOpen(true); }} className="rounded-xl border border-slate-300 bg-white px-4 py-2 text-xs font-extrabold text-slate-500 shadow-sm transition hover:border-[#032757] hover:text-[#032757]">Temporary Admin</button></div>\n      {accountOpen && <AccountModal close={() => { setAccountOpen(false); setAdminSignIn(false); }} session={session ?? null} profile={profile} activeRole={role} initialMode={accountIntent.mode} initialRole={accountIntent.role} adminSignIn={adminSignIn} passwordRecovery={passwordRecovery}'
          if old not in s: raise SystemExit('homepage AccountModal block not found')
          s = s.replace(old, new, 1)

          old = 'const nextRole = savedRecoveryRole === "professional" || savedRecoveryRole === "office" ? savedRecoveryRole : role;'
          new = 'const nextRole = savedRecoveryRole === "professional" || savedRecoveryRole === "office" || savedRecoveryRole === "admin" ? savedRecoveryRole : role;'
          if old not in s: raise SystemExit('recovery completion role check not found')
          s = s.replace(old, new, 1)

          old = 'if (savedRecoveryRole === "professional" || savedRecoveryRole === "office") setRole(savedRecoveryRole);'
          new = 'if (savedRecoveryRole === "professional" || savedRecoveryRole === "office" || savedRecoveryRole === "admin") setRole(savedRecoveryRole);'
          if old not in s: raise SystemExit('recovery listener role check not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "DentalShift Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git rm .github/workflows/add-temporary-admin-home-button.yml
          git commit -m "Add temporary homepage admin access"
          git push
