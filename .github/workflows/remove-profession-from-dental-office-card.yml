name: Remove profession from Dental Office card

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/remove-profession-from-dental-office-card.py'
      - '.github/workflows/remove-profession-from-dental-office-card.yml'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove profession from Dental Office cards
        run: python .github/scripts/remove-profession-from-dental-office-card.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet || git commit -m "Remove redundant profession from Dental Office cards"
          git push
