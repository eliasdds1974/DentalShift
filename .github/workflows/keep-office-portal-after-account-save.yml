name: Keep office portal after account save

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/keep_office_portal_after_account_save.py'
      - '.github/workflows/keep-office-portal-after-account-save.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep office portal after save
        run: python .github/scripts/keep_office_portal_after_account_save.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Keep office portal after account save"
            git push
          fi
