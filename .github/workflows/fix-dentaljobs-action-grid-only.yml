name: Fix DentalJobs action grid only

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-dentaljobs-action-grid-only.py'
      - '.github/workflows/fix-dentaljobs-action-grid-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply targeted action grid fix
        run: python .github/scripts/fix-dentaljobs-action-grid-only.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/classifieds/page.tsx app/dental-jobs/page.tsx components/DentalJobsNativeMarketplace.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix DentalJobs action row without changing listing grid"
            git push origin main
          fi
