name: "Fix portal reload role"

on:
  push:
    paths:
      - ".github/workflows/fix-portal-reload-role.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve route role on reload
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          p = Path("app/page.tsx")
          s = p.read_text()

          s = s.replace(
              '  const [role, setRole] = useState<Role>("office");\n  const [view, setView] = useState<View>("overview");',
              '  const initialPortalState = portalState(pathname);\n  const [role, setRole] = useState<Role>(() => initialPortalState?.role ?? "office");\n  const [view, setView] = useState<View>(() => initialPortalState?.view ?? "overview");',
              1,
          )

          s = s.replace(
              '  useEffect(() => {\n    const next = portalState(pathname);\n    if (!next) return;\n    setRole(next.role);\n    setView(next.view);\n  }, [pathname]);',
              '  useEffect(() => {\n    const next = portalState(pathname);\n    if (!next) return;\n    setRole(next.role);\n    setView(next.view);\n    window.localStorage.setItem("dentalshift_portal_role", next.role);\n  }, [pathname]);',
              1,
          )

          s = s.replace(
              '        const requestedRole = window.sessionStorage.getItem("dentalshift_signin_role");\n        const routeRole = portalState(window.location.pathname)?.role;\n        const savedRole = window.localStorage.getItem("dentalshift_portal_role");',
              '        const requestedRole = window.sessionStorage.getItem("dentalshift_signin_role");\n        const routeState = portalState(pathname) ?? portalState(window.location.pathname);\n        const routeRole = routeState?.role;\n        const savedRole = window.localStorage.getItem("dentalshift_portal_role");',
              1,
          )

          s = s.replace(
              '        const nextRole = [requestedRole, routeRole, savedRole, account.profile.role].find(canUseRole) ?? account.profile.role;\n        setRole(nextRole);\n        window.localStorage.setItem("dentalshift_portal_role", nextRole);',
              '        const nextRole = routeRole && canUseRole(routeRole)\n          ? routeRole\n          : [requestedRole, savedRole, account.profile.role].find(canUseRole) ?? account.profile.role;\n        setRole(nextRole);\n        if (routeState) setView(routeState.view);\n        window.localStorage.setItem("dentalshift_portal_role", nextRole);',
              1,
          )

          marker = '  }, [router]);\n\n  const content = useMemo('
          if marker not in s:
              raise SystemExit("auth sync dependency marker not found")
          s = s.replace(marker, '  }, [router, pathname]);\n\n  const content = useMemo(', 1)

          p.write_text(s)
          PY
          python3 /tmp/patch.py
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit source fix
        run: |
          git config user.name "DentalShift Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Keep active portal on page reload"
          git push
