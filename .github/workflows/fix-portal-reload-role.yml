name: Fix portal reload role
on:
  push:
    paths:
      - '.github/workflows/fix-portal-reload-role.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve route role on reload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()

          old = '''  const [role, setRole] = useState<Role>("office");
  const [view, setView] = useState<View>("overview");'''
          new = '''  const initialPortalState = portalState(pathname);
  const [role, setRole] = useState<Role>(() => initialPortalState?.role ?? "office");
  const [view, setView] = useState<View>(() => initialPortalState?.view ?? "overview");'''
          if old not in s:
              raise SystemExit('initial role state block not found')
          s = s.replace(old, new, 1)

          old = '''  useEffect(() => {
    const next = portalState(pathname);
    if (!next) return;
    setRole(next.role);
    setView(next.view);
  }, [pathname]);'''
          new = '''  useEffect(() => {
    const next = portalState(pathname);
    if (!next) return;
    setRole(next.role);
    setView(next.view);
    window.localStorage.setItem("dentalshift_portal_role", next.role);
  }, [pathname]);'''
          if old not in s:
              raise SystemExit('pathname effect not found')
          s = s.replace(old, new, 1)

          old = '''        const requestedRole = window.sessionStorage.getItem("dentalshift_signin_role");
        const routeRole = portalState(window.location.pathname)?.role;
        const savedRole = window.localStorage.getItem("dentalshift_portal_role");'''
          new = '''        const requestedRole = window.sessionStorage.getItem("dentalshift_signin_role");
        const routeState = portalState(pathname) ?? portalState(window.location.pathname);
        const routeRole = routeState?.role;
        const savedRole = window.localStorage.getItem("dentalshift_portal_role");'''
          if old not in s:
              raise SystemExit('route role block not found')
          s = s.replace(old, new, 1)

          old = '''        const nextRole = [requestedRole, routeRole, savedRole, account.profile.role].find(canUseRole) ?? account.profile.role;
        setRole(nextRole);
        window.localStorage.setItem("dentalshift_portal_role", nextRole);
        if (requestedRole && canUseRole(requestedRole) && window.location.pathname === "/") {
          router.replace(portalRoutes[nextRole].overview);
        }'''
          new = '''        // A portal URL is authoritative during reload. Never switch an /office/* reload
        // to the professional workspace just because the base profile role is professional.
        const nextRole = routeRole && canUseRole(routeRole)
          ? routeRole
          : [requestedRole, savedRole, account.profile.role].find(canUseRole) ?? account.profile.role;
        setRole(nextRole);
        if (routeState) setView(routeState.view);
        window.localStorage.setItem("dentalshift_portal_role", nextRole);
        if (requestedRole && canUseRole(requestedRole) && window.location.pathname === "/") {
          router.replace(portalRoutes[nextRole].overview);
        }'''
          if old not in s:
              raise SystemExit('next role block not found')
          s = s.replace(old, new, 1)

          old = '''  }, [router]);'''
          # Replace the syncAccount effect dependency occurrence nearest auth listener by targeting last occurrence.
          idx = s.rfind(old)
          if idx == -1:
              raise SystemExit('sync effect dependency not found')
          s = s[:idx] + '''  }, [router, pathname]);''' + s[idx+len(old):]

          p.write_text(s)
          PY
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit source fix
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Keep active portal on page reload'
          git push
