name: Fix interest label syntax
on:
  push:
    paths:
      - '.github/workflows/fix-interest-label-syntax.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix-interest-label-syntax.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AnonymousAvailableStaffPanel.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix interest label syntax"
          git push
