name: Add availability cancel button

on:
  push:
    paths:
      - "scripts/add-availability-cancel-button.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/add-availability-cancel-button.py
      - run: npm install --no-audit --no-fund && npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet || git commit -m "Add cancel button to availability modal"
          git push
