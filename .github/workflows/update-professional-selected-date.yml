name: Update professional selected date card
on:
  push:
    paths:
      - 'scripts/update-professional-selected-date.py'
      - '.github/workflows/update-professional-selected-date.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply selected-date card changes
        run: python3 scripts/update-professional-selected-date.py
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit source changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m 'Improve professional selected date availability controls'
          git push
