name: Extend calendars to 400 days

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/extend-calendars-400-days.py'
      - '.github/workflows/extend-calendars-400-days.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply calendar navigation patch
        run: python .github/scripts/extend-calendars-400-days.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Extend calendars to 400 days with navigation'
          git push
