name: Add professional DentalJobs connection delete

on:
  push:
    paths:
      - '.github/scripts/add-professional-connection-delete.py'
      - '.github/workflows/add-professional-connection-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply professional connection delete
        run: python .github/scripts/add-professional-connection-delete.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "bot"
          git config user.email "eliasdds@gmail.com"
          git add app/classifieds/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add delete to professional DentalJobs connections"
          git push origin main
