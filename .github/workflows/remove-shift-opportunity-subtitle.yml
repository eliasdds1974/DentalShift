name: Remove Shift Opportunity subtitle

on:
  push:
    paths:
      - '.github/workflows/remove-shift-opportunity-subtitle.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Shift Opportunity subtitle
        run: python .github/scripts/remove-shift-opportunity-subtitle.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit Dental Office subtitle cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove Shift opportunity subtitle from Dental Office card"
          git push
