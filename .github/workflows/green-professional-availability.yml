name: Green professional availability
on:
  push:
    paths:
      - 'scripts/green-professional-availability.py'
      - '.github/workflows/green-professional-availability.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply professional availability changes
        run: python3 scripts/green-professional-availability.py
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit source changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m 'Use green professional availability styling'
          git push
