name: Apply anonymous available staff

on:
  push:
    branches:
      - feature/anonymous-available-staff-v2
    paths:
      - ".github/workflows/apply-anonymous-available-staff.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration patch
        run: python scripts/finish-anonymous-available-staff.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx lib/dentalshift.ts components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No source change needed"
            exit 0
          fi
          git commit -m "Finish anonymous Available Staff integration"
          git push
