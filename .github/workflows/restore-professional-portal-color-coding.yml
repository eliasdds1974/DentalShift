name: Restore professional DentalJobs color coding

on:
  push:
    paths:
      - '.github/workflows/restore-professional-portal-color-coding.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore professional portal colors
        run: python3 .github/scripts/restore-professional-portal-color-coding.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add app/dental-jobs/page.tsx
          git diff --cached --quiet || git commit -m "Restore professional DentalJobs color coding"
          git push origin main
