name: Move calendar action cards
on:
  push:
    paths:
      - '.github/workflows/move-calendar-action-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move office and professional action cards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          office = Path('components/OfficeWorkspaceV2.tsx')
          s = office.read_text()
          old_form = '<form onSubmit={postSelectedShift} className="rounded-2xl border border-[#0078FE]/25 bg-blue-50/40 p-4">'
          if old_form not in s:
              raise SystemExit('office post shift form not found')
          s = s.replace(old_form, '<form onSubmit={postSelectedShift} className="hidden">', 1)
          s = s.replace('md:grid-cols-[minmax(0,1fr)_170px]', 'md:grid-cols-[minmax(0,1fr)_300px]', 1)
          summary = '<div className="grid w-full gap-1 sm:w-[170px] md:col-start-2 md:row-span-2 md:row-start-1 md:shrink-0">'
          if summary not in s:
              raise SystemExit('office summary cards not found')
          action = '''<form onSubmit={postSelectedShift} className="w-full rounded-2xl border border-[#0078FE]/25 bg-blue-50/40 p-4 md:col-start-2 md:row-span-2 md:row-start-1 md:w-[300px]">
            <div className="flex items-center justify-between gap-3"><div><p className="text-xs font-black uppercase tracking-wide text-[#0078FE]">Post a shift</p><p className="mt-1 text-sm font-extrabold text-[#032757]">Cover this date</p></div><CalendarDays size={20} className="text-[#0078FE]" /></div>
            <div className="mt-4 space-y-3">
              <label className="block text-xs font-black text-slate-600">Professional needed<select name="profession" defaultValue="Registered Dental Hygienist" className="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-bold text-[#032757] outline-none focus:border-[#0078FE]"><option>Registered Dental Hygienist</option><option>Certified Dental Assistant</option><option>Dental Assistant</option><option>Sterilization Technician</option></select></label>
              <div className="grid grid-cols-2 gap-2"><label className="text-xs font-black text-slate-600">Start<input name="start_time" type="time" defaultValue="08:00" required className="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-bold text-[#032757] outline-none focus:border-[#0078FE]" /></label><label className="text-xs font-black text-slate-600">End<input name="end_time" type="time" defaultValue="17:00" required className="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-bold text-[#032757] outline-none focus:border-[#0078FE]" /></label></div>
              <label className="block text-xs font-black text-slate-600">Hourly rate<input name="hourly_rate" type="number" min="1" step="0.50" placeholder="$ / hr" required className="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-bold text-[#032757] outline-none focus:border-[#0078FE]" /></label>
              <label className="block text-xs font-black text-slate-600">Software<select name="software" defaultValue="Any software" className="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-bold text-[#032757] outline-none focus:border-[#0078FE]"><option>Any software</option>{(office.software || []).map((item) => <option key={item}>{item}</option>)}</select></label>
              <label className="block text-xs font-black text-slate-600">Notes<textarea name="notes" rows={2} placeholder="Optional shift details" className="mt-1 w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-[#0078FE]" /></label>
              <label className="flex items-start gap-2 rounded-xl bg-white p-3 text-xs font-bold text-slate-600"><input name="auto_invite" type="checkbox" className="mt-0.5 h-4 w-4" /><span>Automatically invite matching available professionals.</span></label>
              <button type="submit" disabled={busy === `post-${selectedDate}`} className="primary-btn w-full justify-center"><Plus size={16} />{busy === `post-${selectedDate}` ? "Posting…" : "Post shift"}</button>
            </div>
          </form>
          <div className="hidden">'''
          s = s.replace(summary, action, 1)
          office.write_text(s)

          pro = Path('components/WorkflowWorkspaceV2.tsx')
          s = pro.read_text()
          old_avail = '<form onSubmit={addAvailability} className="mt-3 rounded-2xl border-2 border-[#0078FE] bg-blue-50 p-4 shadow-md ring-4 ring-[#0078FE]/10">'
          if old_avail not in s:
              raise SystemExit('professional availability form not found')
          s = s.replace(old_avail, '<form onSubmit={addAvailability} className="hidden">', 1)
          s = s.replace('lg:grid-cols-[minmax(0,1fr)_170px]', 'lg:grid-cols-[minmax(0,1fr)_300px]', 1)
          summary = '<div className="grid w-full gap-1 sm:w-[170px] lg:col-start-2 lg:row-span-2 lg:row-start-1 lg:shrink-0">'
          if summary not in s:
              raise SystemExit('professional summary cards not found')
          action = '''<form onSubmit={addAvailability} className="w-full rounded-2xl border-2 border-[#0078FE] bg-blue-50 p-4 shadow-md ring-4 ring-[#0078FE]/10 lg:col-start-2 lg:row-span-2 lg:row-start-1 lg:w-[300px]">
            <div className="flex items-start justify-between gap-3"><div><p className="text-xs font-black uppercase tracking-[.1em] text-[#0064d8]">Availability</p><p className="mt-1 text-sm font-extrabold text-[#002757]">Set your hours for this date</p><p className="mt-1 text-xs leading-5 text-slate-600">Choose a start and end time so nearby offices can match you with shifts.</p></div><span className="mt-0.5 h-3 w-3 shrink-0 rounded-full bg-[#0078FE] ring-4 ring-[#0078FE]/15" /></div>
            <div className="mt-3 grid grid-cols-2 gap-2"><label className="field"><span>Start</span><input name="start" type="time" step={900} defaultValue="08:00" required /></label><label className="field"><span>End</span><input name="end" type="time" step={900} defaultValue="16:30" required /></label></div>
            <button type="submit" disabled={busy === "availability-add"} className="primary-btn mt-3 w-full justify-center">{busy === "availability-add" ? "Saving…" : "Add availability"}</button>
          </form>
          <div className="hidden">'''
          s = s.replace(summary, action, 1)
          pro.write_text(s)
          PY
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit source changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx components/WorkflowWorkspaceV2.tsx
          git commit -m 'Move calendar action cards into header area'
          git push
