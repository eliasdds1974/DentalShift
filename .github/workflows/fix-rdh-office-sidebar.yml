name: Fix RDH office sidebar

on:
  push:
    branches:
      - fix/rdh-office-sidebar-availability
    paths:
      - "scripts/fix-rdh-office-sidebar.py"
      - ".github/workflows/fix-rdh-office-sidebar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply RDH office sidebar fix
        run: python scripts/fix-rdh-office-sidebar.py
      - name: Commit source change and clean helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          git rm scripts/fix-rdh-office-sidebar.py .github/workflows/fix-rdh-office-sidebar.yml
          git commit -m "Show professional availability in office sidebar"
          git push
