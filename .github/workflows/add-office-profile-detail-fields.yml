name: Add office profile detail fields

on:
  push:
    paths:
      - '.github/scripts/add-office-profile-detail-fields.py'
      - '.github/workflows/add-office-profile-detail-fields.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply office account detail fields
        run: python .github/scripts/add-office-profile-detail-fields.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add office details fields to account"
          git push origin main
