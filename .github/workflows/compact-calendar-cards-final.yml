name: Move summary cards into calendar header

on:
  push:
    paths:
      - '.github/workflows/compact-calendar-cards-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch layout
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('components/WorkflowWorkspaceV2.tsx')
          s = p.read_text()
          start = s.index('    <section className="mt-6 grid gap-3 sm:grid-cols-3">')
          end = s.index('    <section className="mt-6 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">', start)
          s = s[:start] + s[end:]
          old = '<div className="flex flex-col justify-between gap-4 xl:flex-row xl:items-center">\n          <div><h2 className="text-2xl font-black tracking-tight text-[#002757]">Professional calendar</h2><p className="mt-1 text-sm text-slate-500">Availability fills the bottom half of each day. Bookings and office requests appear in the upper corner.</p></div>\n          <div className="flex flex-wrap items-center gap-2">'
          new = '<div className="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">\n          <div className="min-w-0"><h2 className="text-2xl font-black tracking-tight text-[#002757]">Professional calendar</h2><p className="mt-1 text-sm text-slate-500">Availability fills the bottom half of each day. Bookings and office requests appear in the upper corner.</p></div>\n          <div className="grid shrink-0 grid-cols-3 gap-2"><button type="button" onClick={() => setSelection({ type: "day" })} className="flex min-w-[112px] items-center gap-2 rounded-xl border border-[#0078FE]/20 bg-blue-50/60 px-3 py-2 text-left"><CalendarDays size={15} className="text-[#0078FE]" /><span><span className="block text-[10px] font-extrabold text-slate-500">Availability</span><strong className="block text-lg leading-none text-[#002757]">{workflow.availability.filter((slot) => slot.available && new Date(slot.ends_at).getTime() >= Date.now()).length}</strong></span></button><button type="button" onClick={() => onNavigate("bookings")} className="flex min-w-[96px] items-center gap-2 rounded-xl border border-[#01A32E]/20 bg-[#eaf8ee]/60 px-3 py-2 text-left"><Check size={15} className="text-[#017f27]" /><span><span className="block text-[10px] font-extrabold text-slate-500">Booked</span><strong className="block text-lg leading-none text-[#002757]">{upcomingBookings.length}</strong></span></button><button type="button" onClick={() => onNavigate("shifts")} className="flex min-w-[112px] items-center gap-2 rounded-xl border border-amber-200 bg-amber-50/70 px-3 py-2 text-left"><FileCheck2 size={15} className="text-amber-700" /><span><span className="block text-[10px] font-extrabold text-slate-500">Office requests</span><strong className="block text-lg leading-none text-[#002757]">{officeRequests.length}</strong></span></button></div>\n        </div>\n        <div className="mt-4 flex flex-wrap items-center gap-2">'
          if old not in s:
              raise SystemExit('header block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m 'Compact calendar summary cards into header'
          git push
