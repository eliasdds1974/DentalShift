name: Use latest office account form

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/use_latest_office_account_form.py'
      - '.github/workflows/use-latest-office-account-form.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use latest office account form
        run: python .github/scripts/use_latest_office_account_form.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use latest dental office account form"
            git push
          fi
