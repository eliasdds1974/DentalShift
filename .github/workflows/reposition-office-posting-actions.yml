name: Reposition office posting actions

on:
  push:
    paths:
      - '.github/scripts/reposition-office-posting-actions.py'
      - '.github/workflows/reposition-office-posting-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply action layout patch
        run: python .github/scripts/reposition-office-posting-actions.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/classifieds/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Reposition office posting action buttons"
          git push origin main
