name: Fix professional DentalJobs card overflow

on:
  push:
    paths:
      - '.github/workflows/fix-professional-dentaljobs-card-overflow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply professional card overflow fix
        run: python3 .github/scripts/fix-professional-dentaljobs-card-overflow.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add app/classifieds/page.tsx
          git diff --cached --quiet || git commit -m "Fix professional DentalJobs card overflow"
          git push origin main
