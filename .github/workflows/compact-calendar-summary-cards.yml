name: Compact calendar summary cards

on:
  push:
    paths:
      - .github/workflows/compact-calendar-summary-cards.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move summary cards into calendar header
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/WorkflowWorkspaceV2.tsx')
          text = path.read_text()
          old = '''    <section className="mt-6 grid gap-3 sm:grid-cols-3">
      <button type="button" onClick={() => setSelection({ type: "day" })} className="panel flex items-center gap-3 p-4 text-left"><span className={`grid h-10 w-10 place-items-center rounded-xl text-white ${signedRoleStyle.solid}`}><CalendarDays size={19} /></span><span><span className="block text-xs font-extrabold text-slate-500">Availability</span><strong className="block text-2xl text-[#002757]">{workflow.availability.filter((slot) => slot.available && new Date(slot.ends_at).getTime() >= Date.now()).length}</strong></span></button>
      <button type="button" onClick={() => onNavigate("bookings")} className="panel flex items-center gap-3 p-4 text-left"><span className="grid h-10 w-10 place-items-center rounded-xl bg-[#eaf8ee] text-[#017f27]"><Check size={19} /></span><span><span className="block text-xs font-extrabold text-slate-500">Booked</span><strong className="block text-2xl text-[#002757]">{upcomingBookings.length}</strong></span></button>
      <button type="button" onClick={() => onNavigate("shifts")} className="panel flex items-center gap-3 p-4 text-left"><span className="grid h-10 w-10 place-items-center rounded-xl bg-amber-50 text-amber-700"><FileCheck2 size={19} /></span><span><span className="block text-xs font-extrabold text-slate-500">Office requests</span><strong className="block text-2xl text-[#002757]">{officeRequests.length}</strong></span></button>
    </section>

    <section className="mt-6 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
      <div className="border-b border-slate-200 p-4 sm:p-5">
        <div className="flex flex-col justify-between gap-4 xl:flex-row xl:items-center">
          <div><h2 className="text-2xl font-black tracking-tight text-[#002757]">Professional calendar</h2><p className="mt-1 text-sm text-slate-500">Availability fills the bottom half of each day. Bookings and office requests appear in the upper corner.</p></div>
          <div className="flex flex-wrap items-center gap-2">'''
          new = '''    <section className="mt-6 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
      <div className="border-b border-slate-200 p-4 sm:p-5">
        <div className="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
          <div className="min-w-0"><h2 className="text-2xl font-black tracking-tight text-[#002757]">Professional calendar</h2><p className="mt-1 text-sm text-slate-500">Availability fills the bottom half of each day. Bookings and office requests appear in the upper corner.</p></div>
          <div className="grid shrink-0 grid-cols-3 gap-2 xl:w-auto">
            <button type="button" onClick={() => setSelection({ type: "day" })} className="flex min-w-[118px] items-center gap-2 rounded-xl border border-[#0078FE]/20 bg-blue-50/60 px-3 py-2 text-left transition hover:border-[#0078FE]/40 hover:bg-blue-50"><span className={`grid h-8 w-8 shrink-0 place-items-center rounded-lg text-white ${signedRoleStyle.solid}`}><CalendarDays size={15} /></span><span><span className="block text-[10px] font-extrabold leading-tight text-slate-500">Availability</span><strong className="block text-lg leading-none text-[#002757]">{workflow.availability.filter((slot) => slot.available && new Date(slot.ends_at).getTime() >= Date.now()).length}</strong></span></button>
            <button type="button" onClick={() => onNavigate("bookings")} className="flex min-w-[104px] items-center gap-2 rounded-xl border border-[#01A32E]/20 bg-[#eaf8ee]/60 px-3 py-2 text-left transition hover:border-[#01A32E]/40 hover:bg-[#eaf8ee]"><span className="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-[#017f27]"><Check size={15} /></span><span><span className="block text-[10px] font-extrabold leading-tight text-slate-500">Booked</span><strong className="block text-lg leading-none text-[#002757]">{upcomingBookings.length}</strong></span></button>
            <button type="button" onClick={() => onNavigate("shifts")} className="flex min-w-[118px] items-center gap-2 rounded-xl border border-amber-200 bg-amber-50/70 px-3 py-2 text-left transition hover:border-amber-300 hover:bg-amber-50"><span className="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-white text-amber-700"><FileCheck2 size={15} /></span><span><span className="block text-[10px] font-extrabold leading-tight text-slate-500">Office requests</span><strong className="block text-lg leading-none text-[#002757]">{officeRequests.length}</strong></span></button>
          </div>
        </div>
        <div className="mt-4 flex flex-wrap items-center gap-2">'''
          if old not in text:
              raise SystemExit('Target summary/header block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit source change
        run: |
          git config user.name "DentalShift Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m "Compact calendar summary cards into header"
          git push
