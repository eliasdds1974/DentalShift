name: Fix visible Back To Calendar buttons

on:
  push:
    paths:
      - '.github/scripts/fix-visible-back-to-calendar.py'
      - '.github/workflows/fix-visible-back-to-calendar.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visible Back To Calendar fix
        run: python .github/scripts/fix-visible-back-to-calendar.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit visible button fix
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/WorkflowWorkspace.tsx components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix visible Back To Calendar buttons"
            git push
          fi
