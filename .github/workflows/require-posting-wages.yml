name: Require posting wages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/require-posting-wages.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Require wages for shifts and availability
        run: |
          python - <<'PY'
          from pathlib import Path

          lib = Path('lib/dentalshift.ts')
          s = lib.read_text()
          reps = [
            (
              'export type ProfessionalAvailability = { id: string; starts_at: string; ends_at: string; available: boolean };',
              'export type ProfessionalAvailability = { id: string; starts_at: string; ends_at: string; available: boolean; hourly_rate: number };'
            ),
            (
              '  ends_at: string;\n  professional_profiles:',
              '  ends_at: string;\n  hourly_rate: number;\n  professional_profiles:'
            ),
            (
              'export async function addProfessionalAvailability(userId: string, startsAt: string, endsAt: string) {\n  const { error } = await supabase.from("availability").insert({ professional_id: userId, starts_at: startsAt, ends_at: endsAt, available: true });',
              'export async function addProfessionalAvailability(userId: string, startsAt: string, endsAt: string, hourlyRate: number) {\n  if (!Number.isFinite(hourlyRate) || hourlyRate <= 0) throw new Error("Enter a valid hourly rate.");\n  const { error } = await supabase.from("availability").insert({ professional_id: userId, starts_at: startsAt, ends_at: endsAt, hourly_rate: hourlyRate, available: true });'
            ),
            (
              'supabase.from("availability").select("id,starts_at,ends_at,available").eq("professional_id", userId)',
              'supabase.from("availability").select("id,starts_at,ends_at,available,hourly_rate").eq("professional_id", userId)'
            ),
            (
              'supabase.from("availability").select("id,professional_id,starts_at,ends_at,professional_profiles!availability_professional_id_fkey(',
              'supabase.from("availability").select("id,professional_id,starts_at,ends_at,hourly_rate,professional_profiles!availability_professional_id_fkey('
            ),
          ]
          for old, new in reps:
            if old not in s:
              raise SystemExit(f'lib patch target missing: {old[:90]}')
            s = s.replace(old, new, 1)
          lib.write_text(s)

          pro = Path('components/WorkflowWorkspaceV2.tsx')
          s = pro.read_text()
          old = '''    const start = String(form.get("start") || "");
    const end = String(form.get("end") || "");
    if (!start || !end) return;
    const startsAt = new Date(`${selectedDate}T${start}:00`);'''
          new = '''    const start = String(form.get("start") || "");
    const end = String(form.get("end") || "");
    const hourlyRate = Number(form.get("hourly_rate") || 0);
    if (!start || !end) return;
    if (!Number.isFinite(hourlyRate) || hourlyRate <= 0) {
      setError("Enter a valid hourly rate before posting availability.");
      return;
    }
    const startsAt = new Date(`${selectedDate}T${start}:00`);'''
          if old not in s: raise SystemExit('professional addAvailability parse target missing')
          s = s.replace(old, new, 1)
          old = 'await run("availability-add", () => addProfessionalAvailability(userId, startsAt.toISOString(), endsAt.toISOString()));'
          new = 'await run("availability-add", () => addProfessionalAvailability(userId, startsAt.toISOString(), endsAt.toISOString(), hourlyRate));'
          if old not in s: raise SystemExit('professional addAvailability call target missing')
          s = s.replace(old, new, 1)
          old = '''<div className="flex items-center justify-between gap-3"><div><p className="text-xs font-black uppercase tracking-wide text-[#34A853]">I’m Available</p>{selectedAvailability.map((slot) => <p key={slot.id} className="mt-1 text-sm font-black text-[#002757]">{shortTime(slot.starts_at)}–{shortTime(slot.ends_at)}</p>)}</div><button type="button" disabled={busy === selectedAvailability[0].id} onClick={() => void run(selectedAvailability[0].id, () => removeProfessionalAvailability(selectedAvailability[0].id))} className="secondary-btn">Remove</button></div>'''
          new = '''<div className="flex items-center justify-between gap-3"><div><p className="text-xs font-black uppercase tracking-wide text-[#34A853]">I’m Available</p>{selectedAvailability.map((slot) => <div key={slot.id}><p className="mt-1 text-sm font-black text-[#002757]">{shortTime(slot.starts_at)}–{shortTime(slot.ends_at)}</p><p className="mt-0.5 text-xs font-extrabold text-[#017f27]">${Number(slot.hourly_rate)}/hr</p></div>)}</div><button type="button" disabled={busy === selectedAvailability[0].id} onClick={() => void run(selectedAvailability[0].id, () => removeProfessionalAvailability(selectedAvailability[0].id))} className="secondary-btn">Cancel / Repost</button></div>'''
          if old not in s: raise SystemExit('professional availability card target missing')
          s = s.replace(old, new, 1)
          old = '''<div className="mt-4 grid grid-cols-2 gap-3"><label className="field"><span>Start</span><input name="start" type="time" step={900} defaultValue="08:00" required /></label><label className="field"><span>End</span><input name="end" type="time" step={900} defaultValue="16:30" required /></label></div>'''
          new = '''<div className="mt-4 grid grid-cols-2 gap-3"><label className="field"><span>Start</span><input name="start" type="time" step={900} defaultValue="08:00" required /></label><label className="field"><span>End</span><input name="end" type="time" step={900} defaultValue="16:30" required /></label></div><label className="field mt-3"><span>Hourly rate *</span><input name="hourly_rate" type="number" min="1" step="0.50" placeholder="$ / hr" required /></label>'''
          if old not in s: raise SystemExit('professional availability form target missing')
          s = s.replace(old, new, 1)
          pro.write_text(s)

          office = Path('components/OfficeWorkspaceV2.tsx')
          s = office.read_text()
          s = s.replace('<span>Hourly rate</span><input name="hourly_rate" type="number" min="1" step="0.50" placeholder="$ / hr" required />', '<span>Hourly rate *</span><input name="hourly_rate" type="number" min="1" step="0.50" placeholder="$ / hr" required />')
          office.write_text(s)
          PY
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/dentalshift.ts components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Require wages for shift and availability posts"
            git push
          fi