name: Apply shared login flow fix

on:
  push:
    paths:
      - '.github/workflows/tighten-professional-header.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shared login behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          s = s.replace('    const email = String(form.get("email") || "");', '    const email = String(form.get("email") || "").trim().toLowerCase();', 1)
          s = s.replace('        setError(signInError.message);', '        setError(signInError.message.toLowerCase().includes("invalid login credentials") ? "Incorrect email or password. This DentalShift login uses the same password for your Professional and Dental Office workspaces. Select Forgot password if you need to reset it." : signInError.message);', 1)
          old = '''      if (signUpError) setError(signUpError.message);
      else if (!data.session) {
        setCreatedEmail(email);
        setAccountCreated(true);
      } else close();'''
          new = '''      if (signUpError) {
        if (signUpError.message.toLowerCase().includes("already registered") || signUpError.message.toLowerCase().includes("already exists")) {
          setMode("signin");
          setSignInRoleChosen(true);
          setEmailValue(email);
          setError("This email already has a DentalShift login. Sign in with the existing password; that login can open both Professional and Dental Office workspaces.");
        } else setError(signUpError.message);
      } else if (!data.session && data.user?.identities?.length === 0) {
        setMode("signin");
        setSignInRoleChosen(true);
        setEmailValue(email);
        setError("This email already has a DentalShift login. Sign in with the existing password; that login can open both Professional and Dental Office workspaces.");
      } else if (!data.session) {
        setCreatedEmail(email);
        setAccountCreated(true);
      } else close();'''
          if old not in s:
              raise SystemExit('signup result block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source change
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Fix shared login flow for multi-workspace accounts'
          git push
