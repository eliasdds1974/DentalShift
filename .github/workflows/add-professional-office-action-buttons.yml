name: Add professional office action buttons

on:
  push:
    paths:
      - '.github/workflows/add-professional-office-action-buttons.yml'
      - '.github/scripts/add-professional-office-action-buttons.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python .github/scripts/add-professional-office-action-buttons.py
      - name: Validate build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/page.tsx components/GoogleAddressAutocomplete.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add multi-office account action buttons"
            git push
          fi