name: Unify Book Appointment and refresh
on:
  push:
    paths:
      - '.github/workflows/unify-book-appointment-and-refresh.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply booking and refresh patch
        run: python .github/scripts/unify-book-appointment-and-refresh.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dentalshift.ts components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Unify Book Appointment and add 30 second refresh"
          git push
