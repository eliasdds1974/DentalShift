name: Add Associate Dentist profession

on:
  push:
    branches:
      - feature/associate-dentist-profession
    paths:
      - '.github/workflows/add-associate-dentist.yml'
      - '.github/scripts/add-associate-dentist.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Associate Dentist patch
        run: python .github/scripts/add-associate-dentist.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit verified changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/page.tsx components/OfficeWorkspaceV2.tsx components/AnonymousAvailableStaffPanel.tsx components/WorkflowWorkspace.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Associate Dentist profession and calendar color"
            git push
          fi
