name: Add available professional Preferred badge

on:
  push:
    paths:
      - '.github/workflows/add-available-professional-preferred-badge.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Preferred badge patch
        run: python .github/scripts/add-available-professional-preferred-badge.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit Preferred badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AnonymousAvailableStaffPanel.tsx
          git commit -m "Show Preferred badge on available professional cards" || exit 0
          git push
