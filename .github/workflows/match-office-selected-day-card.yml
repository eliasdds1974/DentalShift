name: Match office selected day card
on:
  push:
    paths:
      - '.github/workflows/match-office-selected-day-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match office selected day layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/OfficeWorkspaceV2.tsx')
          s = p.read_text()

          old = '      {calendarView === "list" ? <div className="grid gap-4 p-4 sm:p-5 lg:grid-cols-2">'
          if old not in s:
              raise SystemExit('list view start not found')

          old_grid = '      </div> : <div className="grid gap-0 lg:grid-cols-[minmax(0,1fr)_340px]">'
          new_grid = '      </div> : <div className="grid lg:grid-cols-[minmax(0,1.8fr)_minmax(320px,.72fr)]">'
          if old_grid not in s:
              raise SystemExit('office calendar grid not found')
          s = s.replace(old_grid, new_grid, 1)

          old_calendar = '        <div className="p-3 sm:p-4">'
          new_calendar = '        <div className="border-b border-slate-200 p-3 sm:p-5 lg:border-b-0 lg:border-r">'
          if old_calendar not in s:
              raise SystemExit('calendar pane not found')
          s = s.replace(old_calendar, new_calendar, 1)

          old_aside = '        <aside className="border-t border-slate-200 bg-white p-4 lg:border-l lg:border-t-0 sm:p-5">\n          <p className="text-xs font-black uppercase tracking-[.12em] text-[#0078FE]">Selected date</p>\n          <h3 className="mt-1 text-xl font-black text-[#0f172a]">{longDate(selectedDate)}</h3>\n          <div className="mt-4 space-y-4">'
          new_aside = '        <aside className="bg-white p-4 sm:p-5">\n          <div className="flex items-start justify-between gap-3"><div><p className="text-xs font-black uppercase tracking-[.12em] text-[#0078FE]">Selected date</p><h3 className="mt-1 text-xl font-black text-[#0f172a]">{longDate(selectedDate)}</h3></div><span className="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-black text-slate-600">Office</span></div>\n          <div className="my-5 border-t border-slate-200" />\n          <div className="space-y-4">'
          if old_aside not in s:
              raise SystemExit('selected day aside header not found')
          s = s.replace(old_aside, new_aside, 1)

          p.write_text(s)
          PY
      - name: Commit source change
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Match office selected day card to professional portal'
          git push