name: Remove declined match cards

on:
  push:
    paths:
      - '.github/scripts/remove-declined-match-cards.py'
      - '.github/workflows/remove-declined-match-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/remove-declined-match-cards.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove declined match cards for the day"
          git push origin main
