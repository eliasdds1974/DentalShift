name: Restore cancelled interest shift
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/restore-cancelled-interest-shift.py'
      - '.github/workflows/restore-cancelled-interest-shift.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/restore-cancelled-interest-shift.py
      - run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Restore shift after cancelling interest" && git push; fi
