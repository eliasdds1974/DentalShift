name: Compact professional availability cards

on:
  push:
    paths:
      - '.github/workflows/compact-professional-availability-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact professional availability cards
        run: python3 .github/scripts/compact-professional-availability-cards.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add app/classifieds/page.tsx
          git diff --cached --quiet || git commit -m "Compact professional availability cards"
          git push origin main
