name: Add professional availability notes

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/add-professional-availability-notes.py'
      - '.github/workflows/add-professional-availability-notes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add availability notes UI
        run: python .github/scripts/add-professional-availability-notes.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/dentalshift.ts components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx components/AnonymousAvailableStaffPanel.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add notes to professional availability"
            git push
          fi
