name: Finish anonymous available staff

on:
  push:
    branches:
      - feature/anonymous-available-staff-v2
    paths:
      - "scripts/finish-anonymous-available-staff.py"
      - ".github/workflows/finish-anonymous-available-staff.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration patch
        run: python scripts/finish-anonymous-available-staff.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          if git diff --quiet -- app/page.tsx lib/dentalshift.ts components/OfficeWorkspaceV2.tsx; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx lib/dentalshift.ts components/OfficeWorkspaceV2.tsx
          git commit -m "Finish anonymous Available Staff integration"
          git push
