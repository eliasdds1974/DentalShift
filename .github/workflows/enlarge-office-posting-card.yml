name: Enlarge office posting card

on:
  push:
    paths:
      - '.github/scripts/enlarge-office-posting-card.py'
      - '.github/workflows/enlarge-office-posting-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply office posting card layout patch
        run: python .github/scripts/enlarge-office-posting-card.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/classifieds/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Enlarge office posting card and keep Manage visible"
          git push origin main
