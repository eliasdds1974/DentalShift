name: Remove professional availability toggle
on:
  push:
    paths:
      - '.github/scripts/remove-professional-availability-toggle.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/remove-professional-availability-toggle.py
      - run: |
          git config user.name dentalshift-bot
          git config user.email bot@users.noreply.github.com
          git add app/page.tsx lib/dentalshift.ts
          git diff --cached --quiet || git commit -m 'Remove professional availability profile toggle'
          git push origin main
