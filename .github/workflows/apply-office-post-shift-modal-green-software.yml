name: Apply office post shift modal green software

on:
  push:
    branches:
      - polish/office-post-shift-modal-green-software
    paths:
      - '.github/scripts/patch_software_other_and_modal_polish.py'
      - '.github/workflows/apply-office-post-shift-modal-green-software.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/office-post-shift-modal-green-software
      - name: Apply patch
        run: python .github/scripts/patch_software_other_and_modal_polish.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          if git diff --quiet -- app/page.tsx components/OfficeWorkspaceV2.tsx; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'DentalShift automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx components/OfficeWorkspaceV2.tsx
          git commit -m 'Update software options and office shift modal'
          git push origin HEAD:polish/office-post-shift-modal-green-software
