name: Apply office post shift modal green software

on:
  push:
    branches:
      - polish/office-post-shift-modal-green-software
    paths:
      - '.github/scripts/patch_office_post_shift_modal_green_software.py'
      - '.github/workflows/apply-office-post-shift-modal-green-software.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/office-post-shift-modal-green-software
      - name: Apply patch
        run: python .github/scripts/patch_office_post_shift_modal_green_software.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          if git diff --quiet -- components/OfficeWorkspaceV2.tsx; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'DentalShift automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Polish office post shift modal and software list'
          git push origin HEAD:polish/office-post-shift-modal-green-software

# Retry after correcting the modal patch pattern.
