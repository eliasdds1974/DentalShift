name: Fix office availability visibility

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_office_availability_visibility.py'
      - '.github/workflows/fix-office-availability-visibility.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch availability visibility
        run: python .github/scripts/fix_office_availability_visibility.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Show all qualifying office availability"
            git push
          fi
