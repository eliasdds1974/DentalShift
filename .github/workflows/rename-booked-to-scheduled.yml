name: Rename booked to scheduled

on:
  push:
    paths:
      - '.github/scripts/rename-booked-to-scheduled.py'
      - '.github/workflows/rename-booked-to-scheduled.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scheduled terminology
        run: python .github/scripts/rename-booked-to-scheduled.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit scheduled terminology
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use Scheduled for confirmed shift UI"
            git push
          fi
