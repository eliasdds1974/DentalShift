name: Build compact private exclusions

on:
  push:
    paths:
      - '.github/workflows/build-compact-private-exclusions.yml'
      - '.github/scripts/build-compact-private-exclusions.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply compact private exclusions patch
        run: python .github/scripts/build-compact-private-exclusions.py
      - name: Commit changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/page.tsx lib/dentalshift.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add private exclusions and compact account layouts"
            git push
          fi
