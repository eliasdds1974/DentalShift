name: Update DentalJobs manage card

on:
  push:
    paths:
      - '.github/workflows/update-manage-job-ads-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Manage Job Ads card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/classifieds/page.tsx')
          s = p.read_text()
          old = '''<button type="button" onClick={() => document.getElementById("my-dentaljobs")?.scrollIntoView({ behavior: "smooth", block: "start" })} className="group flex h-full min-h-[230px] flex-col rounded-2xl border-2 border-[#002757]/15 bg-white p-5 text-left shadow-sm transition hover:-translate-y-0.5 hover:border-[#002757] hover:shadow-md"><span className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-[#002757] text-white"><BriefcaseBusiness size={24} /></span><div className="mt-4 flex flex-1 flex-col"><p className="text-xs font-black uppercase tracking-[0.12em] text-[#4285F4]">Office Postings</p><h2 className="mt-1 text-xl font-black text-[#002757]">My DentalJobs</h2><p className="mt-2 flex-1 text-sm leading-6 text-slate-600">Review, edit, pause, renew or close your current and previous job ads.</p><span className="mt-4 inline-flex w-fit items-center gap-2 text-sm font-black text-[#002757]">Manage {myOfficeJobs.length} Posting{myOfficeJobs.length === 1 ? "" : "s"} <ChevronLeft size={16} className="rotate-[-90deg]" /></span></div></button>'''
          new = '''<button type="button" onClick={() => document.getElementById("my-dentaljobs")?.scrollIntoView({ behavior: "smooth", block: "start" })} className="group flex h-full min-h-[230px] flex-col rounded-2xl border-2 border-[#002757]/15 bg-white p-5 text-left shadow-sm transition hover:-translate-y-0.5 hover:border-[#002757] hover:shadow-md"><span className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-[#002757] text-white"><BriefcaseBusiness size={24} /></span><div className="mt-4 flex flex-1 flex-col"><p className="text-xs font-black uppercase tracking-[0.12em] text-[#4285F4]">Office Postings</p><h2 className="mt-1 text-xl font-black text-[#002757]">Manage Job Ads</h2><p className="mt-2 flex-1 text-sm leading-6 text-slate-600">Manage your active and previous job ads.</p><span className="mt-4 inline-flex w-fit items-center gap-2 rounded-xl bg-[#002757] px-4 py-2.5 text-sm font-black text-white shadow-sm transition group-hover:bg-[#01A32E]">Manage Job Ads <ChevronLeft size={16} className="rotate-[-90deg]" /></span></div></button>'''
          if old not in s:
              raise SystemExit('Target Manage DentalJobs card not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/classifieds/page.tsx
          git commit -m "Update DentalJobs manage card" || exit 0
          git push
