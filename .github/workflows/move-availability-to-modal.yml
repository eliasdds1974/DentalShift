name: Move professional availability to modal

on:
  push:
    paths:
      - "scripts/move-availability-to-modal.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply professional availability modal change
        run: python scripts/move-availability-to-modal.py
      - name: Build
        run: npm install && npm run build
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet || git commit -m "Move professional availability entry to calendar modal"
          git push
