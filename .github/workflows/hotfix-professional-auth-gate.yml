name: Professional auth gate hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-professional-auth-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove authenticated mock dashboard fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = '''      : role === "professional"
        ? session && profile
          ? <ProfessionalWorkspace userId={session.user.id} profile={profile} refreshKey={refreshKey} view={view} onNavigate={(nextView) => navigate("professional", nextView)} />
          : <ProfessionalDashboard userId={null} refreshKey={refreshKey} />
        : session && profile?.role === "admin"'''
          new = '''      : role === "professional"
        ? session
          ? profile
            ? <ProfessionalWorkspace userId={session.user.id} profile={profile} refreshKey={refreshKey} view={view} onNavigate={(nextView) => navigate("professional", nextView)} />
            : <div className="page-wrap"><div className="panel mx-auto max-w-xl p-8 text-center"><div className="mx-auto w-fit"><Brand compact /></div><h1 className="mt-4 text-xl font-black text-[#002757]">Loading your professional workspace</h1><p className="mt-2 text-sm leading-6 text-slate-500">DentalShift is reconnecting your account. Your calendar and workspace will appear here as soon as your profile is available.</p><button type="button" onClick={() => window.location.reload()} className="secondary-btn mx-auto mt-5 justify-center">Retry</button></div></div>
          : <ProfessionalDashboard userId={null} refreshKey={refreshKey} />
        : session && profile?.role === "admin"'''
          if old not in s:
              raise SystemExit('professional fallback target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source fix
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add app/page.tsx
          git commit -m "Keep authenticated professionals in live workspace"
          git push
