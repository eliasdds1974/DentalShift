name: Green available cards and requested wage
on:
  push:
    paths:
      - '.github/workflows/green-available-cards-add-wage.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update availability data and selected-day cards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('lib/dentalshift.ts')
          s = lib.read_text()
          old = 'professional_profiles: { profession: string; licence_province: string; rating: number; completed_shifts: number; reliability_score: number } | null;'
          new = 'professional_profiles: { profession: string; licence_province: string; rating: number; completed_shifts: number; reliability_score: number; hourly_rate: number | null } | null;'
          if old not in s:
              raise SystemExit('AvailableProfessionalSlot type not found')
          s = s.replace(old, new, 1)
          old = 'supabase.from("availability").select("id,professional_id,starts_at,ends_at,professional_profiles!availability_professional_id_fkey(profession,licence_province,rating,completed_shifts,reliability_score)").eq("available", true).gte("ends_at", new Date().toISOString()),'
          new = 'supabase.from("availability").select("id,professional_id,starts_at,ends_at,professional_profiles!availability_professional_id_fkey(profession,licence_province,rating,completed_shifts,reliability_score,hourly_rate)").eq("available", true).gte("ends_at", new Date().toISOString()),'
          if old not in s:
              raise SystemExit('office availability select not found')
          lib.write_text(s.replace(old, new, 1))

          office = Path('components/OfficeWorkspaceV2.tsx')
          s = office.read_text()
          old = '''                  return <article key={slot.id} className={`rounded-xl border-2 p-3 ${role.soft} ${code === "RDH" ? "border-[#0078FE]/35" : code === "CDA" ? "border-[#F21C13]/35" : code === "DA" ? "border-amber-300" : "border-[#04A62F]/35"}`}>'''
          new = '''                  return <article key={slot.id} className="rounded-xl border-2 border-[#04A62F]/35 bg-[#eaf8ee] p-3">'''
          if old not in s:
              raise SystemExit('available staff article style not found')
          s = s.replace(old, new, 1)
          old = '''                      <span>Reliability: <strong className="text-[#032757]">{profile?.reliability_score || 0}%</strong></span>'''
          new = '''                      <span>Reliability: <strong className="text-[#032757]">{profile?.reliability_score || 0}%</strong></span>\n                      <span className="col-span-2">Requested wage: <strong className="text-[#032757]">{profile?.hourly_rate ? `$${Number(profile.hourly_rate).toFixed(2)}/hr` : "Not set"}</strong></span>'''
          if old not in s:
              raise SystemExit('reliability line not found')
          office.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/dentalshift.ts components/OfficeWorkspaceV2.tsx
          git commit -m 'Show requested wage on green available staff cards'
          git push
