name: Admin office latest portal

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/admin_office_preview_latest.py'
      - '.github/workflows/admin-office-preview-latest.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin office preview
        run: python .github/scripts/admin_office_preview_latest.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use latest office portal for admin preview"
            git push
          fi
