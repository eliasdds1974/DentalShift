name: Add office Post a Position button

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/add-office-post-position-button.py'
      - '.github/workflows/add-office-post-position-button.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply office Post a Position shortcut
        run: python .github/scripts/add-office-post-position-button.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified application changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx app/classifieds/page.tsx
          if git diff --cached --quiet; then
            echo "No application changes needed"
          else
            git commit -m "Add office Post a Position shortcut"
            git push
          fi
