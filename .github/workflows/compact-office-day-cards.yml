name: Compact office day cards

on:
  push:
    paths:
      - '.github/workflows/compact-office-day-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact selected day cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/OfficeWorkspaceV2.tsx')
          s = p.read_text()
          replacements = [
            ('<div className="space-y-4">', '<div className="space-y-3">', 'day section spacing'),
            ('<section className="rounded-3xl bg-[#04A62F] p-3 shadow-sm sm:p-4">', '<section className="rounded-2xl bg-[#04A62F] p-2.5 shadow-sm sm:p-3">', 'posted section'),
            ('<h3 className="mb-4 text-center text-xl font-black text-white sm:text-2xl">Posted Shifts</h3>', '<h3 className="mb-2.5 text-center text-lg font-black text-white sm:text-xl">Posted Shifts</h3>', 'posted heading'),
            ('<div className="space-y-3">\n            {selectedShifts.map', '<div className="space-y-2">\n            {selectedShifts.map', 'shift list spacing'),
            ('className="rounded-2xl border border-white/70 bg-white p-4 shadow-sm"', 'className="rounded-xl border border-white/70 bg-white p-3 shadow-sm"', 'shift card'),
            ('<div className="flex items-start justify-between gap-3">', '<div className="flex items-start justify-between gap-2">', 'shift header gap'),
            ('<div className="flex flex-col items-end gap-2">', '<div className="flex flex-col items-end gap-1.5">', 'shift actions gap'),
            ('className="rounded-lg border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-[11px] font-black', 'className="rounded-lg border border-rose-200 bg-rose-50 px-2 py-1 text-[10px] font-black', 'cancel button'),
            ('<section className="mt-4 rounded-2xl bg-[#F21C13] p-2 sm:p-3">', '<section className="mt-3 rounded-xl bg-[#F21C13] p-2">', 'applicants section'),
            ('<h4 className="mb-3 text-center text-lg font-black text-white">Applicants</h4>', '<h4 className="mb-2 text-center text-base font-black text-white">Applicants</h4>', 'applicants heading'),
            ('<div className="space-y-3">{pendingPairings.map', '<div className="space-y-2">{pendingPairings.map', 'applicants spacing'),
            ('className="rounded-xl bg-white p-4"><h5', 'className="rounded-lg bg-white p-3"><h5', 'applicant card'),
            ('<p className="mt-2 text-xs font-bold text-[#017f27]">', '<p className="mt-1 text-[11px] font-bold text-[#017f27]">', 'credential spacing'),
            ('<div className="mt-3 grid grid-cols-2 gap-2 text-xs text-slate-600">', '<div className="mt-2 grid grid-cols-2 gap-x-2 gap-y-1 text-[11px] text-slate-600">', 'applicant details'),
            ('<p className="mt-3 text-xs text-slate-500">Identity and contact details are shared after booking confirmation.</p>', '<p className="mt-2 text-[10px] leading-4 text-slate-500">Identity and contact details are shared after booking confirmation.</p>', 'identity note'),
            ('className="primary-btn mt-3 w-full justify-center"', 'className="primary-btn mt-2 w-full justify-center py-2 text-xs"', 'book button'),
            ('<div className="mt-4 border-t border-slate-100 pt-4">', '<div className="mt-3 border-t border-slate-100 pt-3">', 'matches spacing'),
            ('className="w-full rounded-xl border border-[#04A62F]/25 bg-[#eaf8ee] p-3 text-left', 'className="w-full rounded-lg border border-[#04A62F]/25 bg-[#eaf8ee] p-2.5 text-left', 'match card'),
            ('className="rounded-2xl border border-[#04A62F]/25 bg-[#eaf8ee] p-4"', 'className="rounded-xl border border-[#04A62F]/25 bg-[#eaf8ee] p-3"', 'booked card'),
            ('<p className="mt-2 text-sm font-bold text-slate-700">', '<p className="mt-1 text-sm font-bold text-slate-700">', 'booked name spacing')
          ]
          for old,new,label in replacements:
            if old not in s:
              print('Skipping missing:', label)
            else:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit source update
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Compact office selected day cards'
          git push
