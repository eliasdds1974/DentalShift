name: Add DentalClassifieds header link

on:
  push:
    paths:
      - '.github/workflows/add-dentalclassifieds-header-link.yml'
      - '.github/scripts/add-dentalclassifieds-header-link.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DentalClassifieds header link
        run: python .github/scripts/add-dentalclassifieds-header-link.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Link portal header to DentalClassifieds"
            git push
          fi
