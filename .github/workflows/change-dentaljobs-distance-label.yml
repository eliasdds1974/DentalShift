name: Change DentalJobs distance label

on:
  push:
    paths:
      - '.github/scripts/change-dentaljobs-distance-label.py'
      - '.github/workflows/change-dentaljobs-distance-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply distance label change
        run: python .github/scripts/change-dentaljobs-distance-label.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/DentalJobsNativeMarketplace.tsx
          git diff --cached --quiet || git commit -m "Clarify DentalJobs distance labels"
          git push
