name: Build public DentalJobs

on:
  push:
    paths:
      - '.github/workflows/build-public-dentaljobs.yml'
      - '.github/scripts/patch-public-dentaljobs-link.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage DentalJobs links
        run: python .github/scripts/patch-public-dentaljobs-link.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit homepage links
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/MarketingHome.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Expose public DentalJobs from marketing homepage"
            git push
          fi
