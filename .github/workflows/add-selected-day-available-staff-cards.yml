name: Add selected-day available staff cards
on:
  push:
    paths:
      - '.github/workflows/add-selected-day-available-staff-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add available staff cards above post shift
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/OfficeWorkspaceV2.tsx')
          s = p.read_text()

          old = '''  const selectedBookings = upcomingBookings.filter((booking) => booking.shifts && localDateKey(booking.shifts.starts_at) === selectedDate);'''
          new = '''  const selectedBookings = upcomingBookings.filter((booking) => booking.shifts && localDateKey(booking.shifts.starts_at) === selectedDate);\n  const selectedAvailability = data.availability\n    .filter((slot) => localDateKey(slot.starts_at) === selectedDate)\n    .sort((a, b) => {\n      const roleCompare = roleCode(a.professional_profiles?.profession).localeCompare(roleCode(b.professional_profiles?.profession));\n      if (roleCompare) return roleCompare;\n      return (b.professional_profiles?.rating || 0) - (a.professional_profiles?.rating || 0);\n    });'''
          if old not in s:
              raise SystemExit('selected bookings anchor not found')
          s = s.replace(old, new, 1)

          old = '''          <div className="space-y-4">\n            <form onSubmit={postSelectedShift} className="rounded-2xl border border-[#0078FE]/25 bg-blue-50/40 p-4">'''
          new = '''          <div className="space-y-4">\n            {selectedAvailability.length > 0 && <section className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">\n              <div className="flex items-center justify-between gap-3">\n                <div><p className="text-xs font-black uppercase tracking-wide text-[#04A62F]">Available staff</p><p className="mt-1 text-sm font-extrabold text-[#032757]">{selectedAvailability.length} professional{selectedAvailability.length === 1 ? "" : "s"} available</p></div>\n                <UsersRound size={20} className="text-[#04A62F]" />\n              </div>\n              <div className="mt-3 space-y-2">\n                {selectedAvailability.map((slot) => {\n                  const profile = slot.professional_profiles;\n                  const code = roleCode(profile?.profession);\n                  const role = roleStyles[code];\n                  return <article key={slot.id} className={`rounded-xl border-2 p-3 ${role.soft} ${code === "RDH" ? "border-[#0078FE]/35" : code === "CDA" ? "border-[#F21C13]/35" : code === "DA" ? "border-amber-300" : "border-[#04A62F]/35"}`}>\n                    <div className="flex items-start justify-between gap-3">\n                      <div className="min-w-0">\n                        <div className="flex items-center gap-2"><span className={`h-2.5 w-2.5 shrink-0 rounded-full ${role.solid}`} /><strong className={`${role.text}`}>{role.label} · {profile?.profession || "Dental professional"}</strong></div>\n                        <p className="mt-1 text-[11px] font-black uppercase tracking-wide text-[#04A62F]">Available {shortTime(slot.starts_at)}–{shortTime(slot.ends_at)}</p>\n                      </div>\n                      <span className="shrink-0 rounded-full bg-[#eaf8ee] px-2 py-1 text-[10px] font-black text-[#017f27]">Available</span>\n                    </div>\n                    <div className="mt-3 grid grid-cols-2 gap-2 text-[11px] font-bold text-slate-600">\n                      <span>Province: <strong className="text-[#032757]">{profile?.licence_province || "—"}</strong></span>\n                      <span>Rating: <strong className="text-[#032757]">{profile?.rating || 0}★</strong></span>\n                      <span>Completed: <strong className="text-[#032757]">{profile?.completed_shifts || 0}</strong></span>\n                      <span>Reliability: <strong className="text-[#032757]">{profile?.reliability_score || 0}%</strong></span>\n                    </div>\n                  </article>;\n                })}\n              </div>\n            </section>}\n            <form onSubmit={postSelectedShift} className="rounded-2xl border border-[#0078FE]/25 bg-blue-50/40 p-4">'''
          if old not in s:
              raise SystemExit('post shift form anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit source change
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Show available staff cards above selected-day shift form'
          git push
