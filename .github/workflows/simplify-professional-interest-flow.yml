name: Simplify professional interest flow

on:
  push:
    paths:
      - '.github/scripts/simplify-professional-interest-flow.py'
      - '.github/workflows/simplify-professional-interest-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply simplified professional interest flow
        run: python .github/scripts/simplify-professional-interest-flow.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/DentalJobsNativeMarketplace.tsx app/classifieds/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Simplify professional DentalJobs interest flow"
            git push origin main
          fi
