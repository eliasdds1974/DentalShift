name: Fix admin magic link redirect
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-admin-magic-link-redirect.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch redirect
        shell: bash
        run: |
          sed -i 's#${window.location.origin}/admin/overview#${window.location.origin}/auth/admin-callback#g' app/page.tsx
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Fix admin magic link callback redirect"
            git push
          fi
