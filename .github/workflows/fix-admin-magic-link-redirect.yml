name: Fix admin magic link redirect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-magic-link-redirect.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin auth redirect
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = '''const redirectTo = role === "admin"
      ? `${window.location.origin}/admin/overview`
      : role === "office"'''
          new = '''const redirectTo = role === "admin"
      ? `${window.location.origin}/auth/admin-callback`
      : role === "office"'''
          count = s.count(old)
          if count == 0:
              raise SystemExit('Admin redirect target not found')
          s = s.replace(old, new)
          p.write_text(s)
          print(f'Updated {count} admin redirect occurrence(s)')
          PY
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix admin magic link callback redirect"
            git push
          fi
