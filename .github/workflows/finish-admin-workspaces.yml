name: Finish admin workspaces
on:
  push:
    paths:
      - '.github/scripts/add-admin-dentaljobs-nav.py'
      - '.github/workflows/finish-admin-workspaces.yml'
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply admin navigation patch
        run: python .github/scripts/add-admin-dentaljobs-nav.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified admin workspaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/overview/page.tsx
          git diff --cached --quiet || git commit -m "Wire completed admin workspaces"
          git push
