name: Fix shared login flow
"on":
  push:
    paths:
      - .github/workflows/fix-shared-login-flow.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login flow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("app/page.tsx")
          s = p.read_text()
          old = '''    const email = String(form.get("email") || "");
    const password = String(form.get("password") || "");

    if (mode === "signin") {
      // Save the intended workspace before Supabase emits SIGNED_IN.
      window.sessionStorage.setItem("dentalshift_signin_role", role);
      const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
      if (signInError) {
        window.sessionStorage.removeItem("dentalshift_signin_role");
        setError(signInError.message);
      } else {
        close();
      }
    } else {'''
          new = '''    const email = String(form.get("email") || "").trim().toLowerCase();
    const password = String(form.get("password") || "");

    if (mode === "signin") {
      // Authentication belongs to the user; the selected role only chooses the workspace.
      window.sessionStorage.setItem("dentalshift_signin_role", role);
      const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
      if (signInError) {
        window.sessionStorage.removeItem("dentalshift_signin_role");
        if (signInError.message.toLowerCase().includes("invalid login credentials")) {
          setError("Incorrect email or password. If this email has both a Professional and Dental Office workspace, use the same DentalShift password for either one. Select Forgot password if you need to reset it.");
        } else {
          setError(signInError.message);
        }
      } else {
        close();
      }
    } else {'''
          if old not in s:
              raise SystemExit("sign-in block not found")
          s = s.replace(old, new)
          old2 = '''      if (signUpError) setError(signUpError.message);
      else if (!data.session) {
        setCreatedEmail(email);
        setAccountCreated(true);
      } else close();'''
          new2 = '''      if (signUpError) {
        if (signUpError.message.toLowerCase().includes("already registered") || signUpError.message.toLowerCase().includes("already exists")) {
          setMode("signin");
          setSignInRoleChosen(true);
          setEmailValue(email);
          setError("This email already has a DentalShift login. Sign in with its existing password; the same login can access both Professional and Dental Office workspaces.");
        } else {
          setError(signUpError.message);
        }
      } else if (!data.session && data.user?.identities?.length === 0) {
        setMode("signin");
        setSignInRoleChosen(true);
        setEmailValue(email);
        setError("This email already has a DentalShift login. Sign in with its existing password; the same login can access both Professional and Dental Office workspaces.");
      } else if (!data.session) {
        setCreatedEmail(email);
        setAccountCreated(true);
      } else close();'''
          if old2 not in s:
              raise SystemExit("sign-up result block not found")
          p.write_text(s.replace(old2, new2))
          PY
      - name: Commit source change
        shell: bash
        run: |
          git config user.name "DentalShift Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Fix shared login flow for multi-workspace accounts"
          git push