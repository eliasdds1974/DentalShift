name: Apply personalized heading
on:
  push:
    branches: [polish/personalized-find-shifts-heading]
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/personalized-find-shifts-heading
      - run: python scripts/patch_personalized_heading.py
      - run: npm install
      - run: npm run build
      - name: Commit source changes
        run: |
          rm scripts/patch_personalized_heading.py .github/workflows/apply-personalized-heading.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx scripts/patch_personalized_heading.py .github/workflows/apply-personalized-heading.yml
          git commit -m "Personalize professional Find Shifts heading"
          git push origin HEAD:polish/personalized-find-shifts-heading
