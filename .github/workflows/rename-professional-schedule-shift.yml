name: Rename Professional Schedule Shift
on:
  push:
    paths:
      - '.github/workflows/rename-professional-schedule-shift.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply label patch
        run: python .github/scripts/rename-professional-schedule-shift.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m "Use Schedule Shift in Professional Portal" || exit 0
          git push
