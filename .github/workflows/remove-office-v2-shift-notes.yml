name: Remove Office V2 shift notes
on:
  push:
    paths:
      - '.github/scripts/remove-office-v2-shift-notes.py'
      - '.github/workflows/remove-office-v2-shift-notes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove notes from Office V2 post shift form
        run: python .github/scripts/remove-office-v2-shift-notes.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          git diff --cached --quiet || git commit -m "Remove notes from Office V2 post shift form"
          git push
