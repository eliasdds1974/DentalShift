name: Simplify office calendar days

on:
  push:
    paths:
      - "scripts/simplify-office-calendar-days.py"
      - ".github/workflows/simplify-office-calendar-days.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify office calendar day labels
        run: python scripts/simplify-office-calendar-days.py
      - name: Commit source change
        run: |
          if git diff --quiet -- components/OfficeWorkspaceV2.tsx; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          git commit -m "Simplify office calendar day display"
          git push
