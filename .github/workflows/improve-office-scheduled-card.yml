name: Improve office scheduled card

on:
  push:
    paths:
      - '.github/scripts/improve-office-scheduled-card.py'
      - '.github/workflows/improve-office-scheduled-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Office scheduled card improvements
        run: python .github/scripts/improve-office-scheduled-card.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit Office scheduled card improvements
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Improve Office Portal scheduled card"
            git push
          fi
