name: Style office applicants green
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/style-office-applicants-green.py'
      - '.github/workflows/style-office-applicants-green.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Style office applicants green
        run: python .github/scripts/style-office-applicants-green.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Style office applicant cards as professionals"
            git push
          fi
