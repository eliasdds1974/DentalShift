name: Install marketing calendar preview

on:
  push:
    paths:
      - '.github/scripts/install-marketing-calendar-preview.py'
      - '.github/workflows/install-marketing-calendar-preview.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate real professional calendar preview
        run: python .github/scripts/install-marketing-calendar-preview.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit homepage integration
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/MarketingHome.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use professional portal calendar design on homepage"
            git push
          fi
