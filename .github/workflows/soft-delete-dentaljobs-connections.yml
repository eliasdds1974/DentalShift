name: Soft delete DentalJobs connections

on:
  push:
    paths:
      - '.github/scripts/soft-delete-dentaljobs-connections.py'
      - '.github/workflows/soft-delete-dentaljobs-connections.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply DentalJobs connection changes
        run: python3 .github/scripts/soft-delete-dentaljobs-connections.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/classifieds/page.tsx components/DentalJobsNativeMarketplace.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refine DentalJobs connection status and soft delete"
            git push origin main
          fi
