name: Hide office names on professional cards

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/hide_office_name_on_professional_cards.py'
      - '.github/workflows/hide-office-name-on-professional-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide office names on professional cards
        run: python .github/scripts/hide_office_name_on_professional_cards.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Show Dental Office on professional cards"
            git push
          fi
