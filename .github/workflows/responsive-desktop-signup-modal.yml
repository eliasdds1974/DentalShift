name: Responsive desktop signup modal
on:
  push:
    paths:
      - '.github/workflows/responsive-desktop-signup-modal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make signup modal responsive to desktop viewport
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          old='''<section role="dialog" aria-modal="true" aria-labelledby="auth-title" className="relative z-10 max-h-[92vh] w-full max-w-2xl overflow-auto rounded-3xl bg-white shadow-2xl">'''
          new='''<section role="dialog" aria-modal="true" aria-labelledby="auth-title" className="auth-dialog relative z-10 max-h-[92vh] w-full max-w-2xl overflow-auto rounded-3xl bg-white shadow-2xl">'''
          if old in s:
            s=s.replace(old,new,1)
          elif 'className="auth-dialog relative z-10' not in s:
            raise SystemExit('auth dialog marker not found')
          p.write_text(s)

          css=Path('app/globals.css')
          c=css.read_text()
          marker='/* Responsive desktop signup modal */'
          rules=r'''

/* Responsive desktop signup modal */
@media (min-width: 768px) {
  .auth-dialog {
    width: min(760px, calc(100vw - 32px));
    max-height: calc(100vh - 24px);
  }

  .auth-dialog form {
    gap: clamp(0.45rem, 1vh, 1rem);
    padding: clamp(0.75rem, 1.6vh, 1.5rem);
  }

  .auth-dialog form .field {
    gap: clamp(0.2rem, 0.45vh, 0.5rem);
  }

  .auth-dialog form .field input,
  .auth-dialog form .field select,
  .auth-dialog form .field textarea {
    padding-top: clamp(0.48rem, 0.8vh, 0.75rem);
    padding-bottom: clamp(0.48rem, 0.8vh, 0.75rem);
  }
}

@media (min-width: 768px) and (max-height: 900px) {
  .auth-dialog {
    max-height: calc(100vh - 16px);
  }

  .auth-dialog form {
    gap: 0.45rem;
    padding: 0.7rem 1rem 0.8rem;
  }

  .auth-dialog form .field {
    gap: 0.15rem;
  }

  .auth-dialog form .field > span {
    font-size: 0.78rem;
    line-height: 1rem;
  }

  .auth-dialog form .field input,
  .auth-dialog form .field select,
  .auth-dialog form .field textarea {
    min-height: 2.45rem;
    padding-top: 0.4rem;
    padding-bottom: 0.4rem;
  }

  .auth-dialog form p {
    line-height: 1rem;
  }
}

@media (min-width: 768px) and (max-height: 760px) {
  .auth-dialog form {
    gap: 0.32rem;
    padding: 0.55rem 0.9rem 0.65rem;
  }

  .auth-dialog form .field input,
  .auth-dialog form .field select,
  .auth-dialog form .field textarea {
    min-height: 2.2rem;
    padding-top: 0.3rem;
    padding-bottom: 0.3rem;
  }
}
'''
          if marker not in c:
            css.write_text(c+rules)
          PY
      - name: Commit source update
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m 'Make signup modal responsive to desktop viewport'
          git push
