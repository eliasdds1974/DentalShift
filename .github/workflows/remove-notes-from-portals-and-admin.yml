name: Remove notes from portals and admin
on:
  push:
    paths:
      - '.github/workflows/remove-notes-from-portals-and-admin.yml'
      - '.github/scripts/remove-notes-from-portals-and-admin.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove notes UI
        run: python .github/scripts/remove-notes-from-portals-and-admin.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx components/AnonymousAvailableStaffPanel.tsx components/OfficeWorkspaceV2.tsx app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove free-text notes from portals and admin"
          git push
