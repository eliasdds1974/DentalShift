name: Clean professional sidebar header
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/clean-professional-sidebar-header.py'
      - '.github/workflows/clean-professional-sidebar-header.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/clean-professional-sidebar-header.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Simplify professional sidebar status header" && git push; fi
