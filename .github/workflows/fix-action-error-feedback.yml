name: Fix action error feedback
on:
  push:
    paths:
      - '.github/workflows/fix-action-error-feedback.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve action error feedback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('components/WorkflowWorkspaceV2.tsx'), Path('components/OfficeWorkspaceV2.tsx')]
          old = 'setError(value instanceof Error ? value.message : "The action could not be completed.");'
          new = 'setError(value instanceof Error ? value.message : (typeof value === "object" && value && "message" in value ? String((value as { message?: unknown }).message || "The action could not be completed.") : "The action could not be completed."));'
          for p in files:
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'error handler pattern not found in {p}')
              s = s.replace(old, new)
              p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -F '"message" in value' components/WorkflowWorkspaceV2.tsx
          grep -F '"message" in value' components/OfficeWorkspaceV2.tsx
      - name: Commit
        run: |
          rm .github/workflows/fix-action-error-feedback.yml
          git config user.name 'eliasdds1974'
          git config user.email 'eliasdds@gmail.com'
          git add components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx .github/workflows/fix-action-error-feedback.yml
          git commit -m 'Show actionable workflow errors'
          git push