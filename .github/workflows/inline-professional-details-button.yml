name: Inline professional Details button
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/inline-professional-details-button.py'
      - '.github/workflows/inline-professional-details-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/inline-professional-details-button.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Place Details inline with office information" && git push; fi
