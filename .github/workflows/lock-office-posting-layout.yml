name: Lock Office Postings card layout

on:
  push:
    paths:
      - '.github/workflows/lock-office-posting-layout.yml'
      - '.github/scripts/lock-office-posting-layout.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply locked Office Postings layout
        run: python .github/scripts/lock-office-posting-layout.py
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/classifieds/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Lock Office Postings card layout"
          git push origin main
