name: Fix magic link profile routing
on:
  push:
    paths:
      - '.github/workflows/fix-magic-link-profile-routing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make explicit portal URL win over stored account role
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("app/page.tsx")
          s = p.read_text()

          old = '''        const nextRole = routeRole && canUseRole(routeRole)
          ? routeRole
          : [requestedRole, savedRole, account.profile.role].find(canUseRole) ?? account.profile.role;'''

          new = '''        const nextRole = routeRole === "office"
          ? "office"
          : routeRole === "professional"
            ? "professional"
            : routeRole === "admin" && account.profile.role === "admin"
              ? "admin"
              : [requestedRole, savedRole, account.profile.role].find(canUseRole) ?? account.profile.role;'''

          if old not in s:
              raise SystemExit("role-resolution block not found")

          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source update
        shell: bash
        run: |
          git config user.name "DentalShift Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Keep office and professional routes in their selected workspace"
          git push
