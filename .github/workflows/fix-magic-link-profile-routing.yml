name: Fix magic link profile routing
on:
  push:
    paths:
      - '.github/workflows/fix-magic-link-profile-routing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route magic links to selected workspace
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('app/page.tsx'); s=p.read_text(); old='''const redirectTo = role === \"admin\"\n      ? `${window.location.origin}/admin/overview`\n      : `${window.location.origin}/?portal_role=${role}`;'''; new='''const redirectTo = role === \"admin\"\n      ? `${window.location.origin}/admin/overview`\n      : role === \"office\"\n        ? `${window.location.origin}/office/overview?portal_role=office`\n        : `${window.location.origin}/professionals/find-shifts?portal_role=professional`;'''; assert old in s, 'magic-link redirect block not found'; p.write_text(s.replace(old,new,1))"
      - name: Commit source update
        shell: bash
        run: |
          git config user.name "DentalShift Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Route magic links to selected workspace"
          git push
