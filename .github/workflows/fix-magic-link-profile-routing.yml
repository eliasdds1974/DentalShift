name: Fix magic link profile routing
on:
  push:
    paths:
      - '.github/workflows/fix-magic-link-profile-routing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make explicit portal URL win over stored account role
        shell: bash
        run: |
          python -c 'from pathlib import Path; import re; p=Path("app/page.tsx"); s=p.read_text(); pattern=r"        const nextRole = routeRole && canUseRole\(routeRole\)\n          \? routeRole\n          : \[requestedRole, savedRole, account\.profile\.role\]\.find\(canUseRole\) \?\? account\.profile\.role;"; replacement="        const nextRole = routeRole === \"office\"\n          ? \"office\"\n          : routeRole === \"professional\"\n            ? \"professional\"\n            : routeRole === \"admin\" && account.profile.role === \"admin\"\n              ? \"admin\"\n              : [requestedRole, savedRole, account.profile.role].find(canUseRole) ?? account.profile.role;"; s2,n=re.subn(pattern,replacement,s,count=1); assert n==1, f"role-resolution replacement count was {n}"; p.write_text(s2)'
      - name: Commit source update
        shell: bash
        run: |
          git config user.name "DentalShift Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Keep office and professional routes in their selected workspace"
          git push
