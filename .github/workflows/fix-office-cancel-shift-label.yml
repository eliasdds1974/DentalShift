name: Fix office Cancel Shift label

on:
  push:
    paths:
      - '.github/scripts/fix-office-cancel-shift-label.py'
      - '.github/workflows/fix-office-cancel-shift-label.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply office Cancel Shift label fix
        run: python .github/scripts/fix-office-cancel-shift-label.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit office Cancel Shift label fix
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Office Portal scheduled card Cancel Shift label"
            git push
          fi
