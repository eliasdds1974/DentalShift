name: Sync professional interest calendar state
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync-interest-calendar-state.py'
      - '.github/workflows/sync-interest-calendar-state.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/sync-interest-calendar-state.py
      - run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Sync professional interest calendar state" && git push; fi
