name: Highlight Manage Posting button

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/highlight-manage-posting-button.py'
      - '.github/workflows/highlight-manage-posting-button.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Manage Posting highlight
        run: python .github/scripts/highlight-manage-posting-button.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified application change
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/classifieds/page.tsx
          if git diff --cached --quiet; then
            echo "No application change needed"
          else
            git commit -m "Make Manage Posting button prominent"
            git push
          fi
