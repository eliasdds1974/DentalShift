name: Add office communication email

on:
  push:
    paths:
      - '.github/workflows/add-office-communication-email.yml'
      - '.github/scripts/add-office-communication-email.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add office communication email
        run: python .github/scripts/add-office-communication-email.py
      - name: Commit changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/page.tsx lib/dentalshift.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add office communication email setting"
            git push
          fi
