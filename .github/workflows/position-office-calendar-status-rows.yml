name: Position office calendar status rows

on:
  push:
    paths:
      - "scripts/position-office-calendar-status-rows.py"
      - ".github/workflows/position-office-calendar-status-rows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Position office calendar status rows
        run: python scripts/position-office-calendar-status-rows.py
      - name: Commit source change
        run: |
          if git diff --quiet -- components/OfficeWorkspaceV2.tsx; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          git commit -m "Position office calendar status rows"
          git push
