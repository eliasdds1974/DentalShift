name: Change office calendar subtitle

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/change_office_calendar_subtitle.py'
      - '.github/workflows/change-office-calendar-subtitle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change subtitle
        run: python .github/scripts/change_office_calendar_subtitle.py
      - name: Commit source change
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Update office calendar subtitle"
            git push
          fi
