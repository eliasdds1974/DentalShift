name: Apply office shift cancel buttons

on:
  push:
    branches:
      - fix/office-shift-cancel-buttons
    paths:
      - scripts/patch_office_shift_cancel_buttons.py
      - .github/workflows/apply-office-shift-cancel-buttons.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_office_shift_cancel_buttons.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          rm scripts/patch_office_shift_cancel_buttons.py
          rm .github/workflows/apply-office-shift-cancel-buttons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx lib/dentalshift.ts scripts/patch_office_shift_cancel_buttons.py .github/workflows/apply-office-shift-cancel-buttons.yml
          git commit -m "Add cancel buttons to office posted shifts"
          git push
