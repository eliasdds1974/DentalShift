name: Restore professional Cancel Repost
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/restore-professional-cancel-repost.py'
      - '.github/workflows/restore-professional-cancel-repost.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/restore-professional-cancel-repost.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Restore professional Cancel Repost button" && git push; fi
