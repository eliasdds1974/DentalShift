name: Show Back To Calendar on desktop

on:
  push:
    paths:
      - '.github/scripts/show-back-to-calendar-desktop.py'
      - '.github/workflows/show-back-to-calendar-desktop.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Back To Calendar visible on desktop
        run: python .github/scripts/show-back-to-calendar-desktop.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Show Back To Calendar buttons on desktop"
            git push
          fi
