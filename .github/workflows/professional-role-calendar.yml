name: Professional role and availability calendar

on:
  push:
    paths:
      - '.github/workflows/professional-role-calendar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update professional calendar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/WorkflowWorkspace.tsx')
          s = p.read_text()

          old_effect = '''  useEffect(() => {
    if (view !== "profile") return;
    setProfileNotice("");
    void loadAccountDetails(userId)
      .then(setAccountDetails)
      .catch((value) => setError(value instanceof Error ? value.message : "Could not load your professional profile."));
  }, [userId, refreshKey, view]);'''
          new_effect = '''  useEffect(() => {
    if (view === "profile") setProfileNotice("");
    void loadAccountDetails(userId)
      .then(setAccountDetails)
      .catch((value) => setError(value instanceof Error ? value.message : "Could not load your professional profile."));
  }, [userId, refreshKey, view]);'''
          if old_effect not in s:
              raise SystemExit('account detail effect target not found')
          s = s.replace(old_effect, new_effect, 1)

          old_visible = '''  const visibleShifts = data.open
    .filter((shift) => {
      const haystack = [shift.offices?.name, shift.offices?.city, shift.offices?.province, shift.profession, shift.required_software].filter(Boolean).join(" ").toLowerCase();
      const matchesSearch = !shiftSearch.trim() || haystack.includes(shiftSearch.trim().toLowerCase());
      const matchesRate = !minimumRate || Number(shift.hourly_rate) >= Number(minimumRate);
      return matchesSearch && matchesRate && (!availabilityOnly || matchesAvailability(shift));
    })'''
          new_visible = '''  const professionalRoleCode = accountDetails?.professional ? shiftRoleCode(accountDetails.professional.profession) : null;
  const professionalRole = professionalRoleCode ? shiftRoles.find((role) => role.code === professionalRoleCode) ?? null : null;
  const visibleShifts = data.open
    .filter((shift) => {
      const haystack = [shift.offices?.name, shift.offices?.city, shift.offices?.province, shift.profession, shift.required_software].filter(Boolean).join(" ").toLowerCase();
      const matchesSearch = !shiftSearch.trim() || haystack.includes(shiftSearch.trim().toLowerCase());
      const matchesRate = !minimumRate || Number(shift.hourly_rate) >= Number(minimumRate);
      const matchesProfession = !professionalRoleCode || shiftRoleCode(shift.profession) === professionalRoleCode;
      return matchesProfession && matchesSearch && matchesRate && (!availabilityOnly || matchesAvailability(shift));
    })'''
          if old_visible not in s:
              raise SystemExit('visible shifts target not found')
          s = s.replace(old_visible, new_visible, 1)

          old_counts = '''  const roleFilteredShifts = visibleShifts.filter((shift) => roleFilter === "all" || shiftRoleCode(shift.profession) === roleFilter);
  const selectedDayShifts = roleFilteredShifts.filter((shift) => localDateKey(shift.starts_at) === selectedDate);
  const selectedRoleCounts = shiftRoles.map((role) => ({ ...role, count: visibleShifts.filter((shift) => localDateKey(shift.starts_at) === selectedDate && shiftRoleCode(shift.profession) === role.code).length }));'''
          new_counts = '''  const roleFilteredShifts = visibleShifts;
  const selectedDayShifts = visibleShifts.filter((shift) => localDateKey(shift.starts_at) === selectedDate);
  const selectedRoleCount = professionalRole ? { ...professionalRole, count: selectedDayShifts.length } : null;
  const selectedAvailability = data.availability
    .filter((slot) => slot.available && localDateKey(slot.starts_at) === selectedDate)
    .sort((first, second) => new Date(first.starts_at).getTime() - new Date(second.starts_at).getTime());'''
          if old_counts not in s:
              raise SystemExit('selected role counts target not found')
          s = s.replace(old_counts, new_counts, 1)

          old_role_filters = '''          <div className="mt-4 flex flex-wrap gap-2"><button type="button" onClick={() => setRoleFilter("all")} className={`rounded-full border px-3 py-1.5 text-xs font-extrabold transition ${roleFilter === "all" ? "border-[#002757] bg-[#002757] text-white" : "border-slate-200 text-slate-600"}`}>All roles</button>{shiftRoles.map((role) => <button type="button" key={role.code} title={role.label} onClick={() => setRoleFilter(roleFilter === role.code ? "all" : role.code)} className={`inline-flex items-center gap-2 rounded-full border px-3 py-1.5 text-xs font-extrabold transition ${roleFilter === role.code ? `${role.soft} border-current` : "border-slate-200 text-slate-600"}`}><span className={`h-3 w-3 rounded-full ${role.dot}`} />{role.code}</button>)}</div>'''
          new_role_filters = '''          {professionalRole && <div className="mt-4 flex flex-wrap gap-2"><span className={`inline-flex items-center gap-2 rounded-full border border-current px-3 py-1.5 text-xs font-extrabold ${professionalRole.soft}`}><span className={`h-3 w-3 rounded-full ${professionalRole.dot}`} />{professionalRole.code} · {professionalRole.label}</span></div>}'''
          if old_role_filters not in s:
              raise SystemExit('role filters target not found')
          s = s.replace(old_role_filters, new_role_filters, 1)

          old_day_counts = '''              const counts = shiftRoles.map((role) => ({ ...role, count: visibleShifts.filter((shift) => localDateKey(shift.starts_at) === key && shiftRoleCode(shift.profession) === role.code).length })).filter((role) => role.count > 0 && (roleFilter === "all" || roleFilter === role.code));
              return <button type="button" key={key} onClick={() => { setSelectedDate(key); setCalendarCursor(day); }} className={`min-h-24 bg-white p-1.5 text-left transition hover:bg-blue-50 sm:min-h-28 sm:p-2 ${calendarView === "month" && !inMonth ? "text-slate-300" : "text-slate-800"} ${selected ? "relative z-10 ring-2 ring-inset ring-[#0078FE] bg-blue-50/50" : ""}`}><span className={`inline-grid h-7 w-7 place-items-center rounded-full text-sm font-black ${today ? "bg-[#002757] text-white" : ""}`}>{day.getDate()}</span><div className="mt-2 flex flex-wrap gap-1">{counts.map((role) => <span key={role.code} title={`${role.count} ${role.label} ${role.count === 1 ? "shift" : "shifts"}`} className={`inline-flex h-6 min-w-6 items-center justify-center rounded-full px-1.5 text-[11px] font-black text-white ${role.dot}`}>{role.count}</span>)}</div></button>;'''
          new_day_counts = '''              const roleShiftCount = professionalRole ? visibleShifts.filter((shift) => localDateKey(shift.starts_at) === key).length : 0;
              const dayAvailability = data.availability.filter((slot) => slot.available && localDateKey(slot.starts_at) === key);
              return <button type="button" key={key} onClick={() => { setSelectedDate(key); setCalendarCursor(day); }} className={`min-h-24 bg-white p-1.5 text-left transition hover:bg-blue-50 sm:min-h-28 sm:p-2 ${calendarView === "month" && !inMonth ? "text-slate-300" : "text-slate-800"} ${selected ? "relative z-10 ring-2 ring-inset ring-[#0078FE] bg-blue-50/50" : ""}`}><span className={`inline-grid h-7 w-7 place-items-center rounded-full text-sm font-black ${today ? "bg-[#002757] text-white" : ""}`}>{day.getDate()}</span><div className="mt-2 flex flex-wrap gap-1">{professionalRole && roleShiftCount > 0 && <span title={`${roleShiftCount} ${professionalRole.label} ${roleShiftCount === 1 ? "shift" : "shifts"}`} className={`inline-flex h-6 min-w-6 items-center justify-center rounded-full px-1.5 text-[11px] font-black text-white ${professionalRole.dot}`}>{roleShiftCount}</span>}{dayAvailability.length > 0 && <span className="inline-flex items-center rounded-md bg-[#eaf8ee] px-1.5 py-1 text-[10px] font-black text-[#017f27] ring-1 ring-inset ring-[#01A32E]/25">Available</span>}</div></button>;'''
          if old_day_counts not in s:
              raise SystemExit('calendar day target not found')
          s = s.replace(old_day_counts, new_day_counts, 1)

          old_sidebar = '''            <div className="mt-4 grid grid-cols-4 gap-2">{selectedRoleCounts.map((role) => <button type="button" key={role.code} onClick={() => setRoleFilter(roleFilter === role.code ? "all" : role.code)} className={`rounded-xl p-2 text-center transition ${role.soft} ${roleFilter === role.code ? "ring-2 ring-current" : ""}`}><strong className="block text-xl font-black">{role.count}</strong><span className="text-[10px] font-black">{role.code}</span></button>)}</div>
            <div className="my-5 border-t border-slate-200" />'''
          new_sidebar = '''            {selectedRoleCount && <div className="mt-4"><div className={`rounded-xl p-3 text-center ${selectedRoleCount.soft}`}><strong className="block text-2xl font-black">{selectedRoleCount.count}</strong><span className="text-[11px] font-black">{selectedRoleCount.code} · {selectedRoleCount.label}</span></div></div>}
            <div className="mt-3 rounded-xl border border-[#01A32E]/20 bg-[#eaf8ee] p-3"><div className="flex items-center justify-between gap-3"><div><p className="text-xs font-black uppercase tracking-wide text-[#017f27]">Your availability</p>{selectedAvailability.length ? <p className="mt-1 text-sm font-extrabold text-[#002757]">{selectedAvailability.map((slot) => `${new Date(slot.starts_at).toLocaleTimeString("en-CA", { hour: "numeric", minute: "2-digit" })}–${new Date(slot.ends_at).toLocaleTimeString("en-CA", { hour: "numeric", minute: "2-digit" })}`).join(", ")}</p> : <p className="mt-1 text-sm font-bold text-slate-500">Not marked available</p>}</div></div></div>
            <div className="my-5 border-t border-slate-200" />'''
          if old_sidebar not in s:
              raise SystemExit('selected date sidebar target not found')
          s = s.replace(old_sidebar, new_sidebar, 1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add components/WorkflowWorkspace.tsx
          git commit -m "Show professional role and availability on calendar"
          git push
