name: Apply position order and Dental Administrator label

on:
  push:
    branches:
      - fix/position-order-and-admin-label
    paths:
      - scripts/patch_position_order_and_admin_label.py
      - .github/workflows/apply-position-order-and-admin-label.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_position_order_and_admin_label.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          rm scripts/patch_position_order_and_admin_label.py
          rm .github/workflows/apply-position-order-and-admin-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx scripts/patch_position_order_and_admin_label.py .github/workflows/apply-position-order-and-admin-label.yml
          git commit -m "Order posted positions and rename Dental Administrator option"
          git push
