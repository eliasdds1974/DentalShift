name: Add DentalJobs connections

on:
  push:
    paths:
      - '.github/scripts/add-dentaljobs-connections.py'
      - '.github/workflows/add-dentaljobs-connections.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply DentalJobs connection workflow
        run: python .github/scripts/add-dentaljobs-connections.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified application change
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add app/classifieds/page.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Build DentalJobs application and interest workflow"
            git push
          fi
