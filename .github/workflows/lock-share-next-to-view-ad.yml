name: Lock Share Listing beside View Ad

on:
  push:
    paths:
      - '.github/workflows/lock-share-next-to-view-ad.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move Share Listing beside View Ad
        run: python .github/scripts/lock-share-next-to-view-ad.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/classifieds/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Move Share Listing beside View Ad"
          git push origin main
