name: Fix calendar day lanes
on:
  push:
    paths:
      - '.github/workflows/fix-calendar-day-lanes.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixed calendar lanes
        run: |
          python - <<'PY'
          from pathlib import Path

          pro = Path('components/WorkflowWorkspaceV2.tsx')
          s = pro.read_text()
          replacements = [
            ('relative min-h-[78px] rounded-2xl border p-1.5 pt-9 text-center transition sm:min-h-[108px] sm:p-2 sm:pt-11',
             'relative min-h-[92px] rounded-2xl border p-1.5 text-center transition sm:min-h-[122px] sm:p-2'),
            ('absolute left-1 top-1 grid h-7 w-7 place-items-center rounded-full text-xs font-black sm:left-1 sm:top-1 sm:h-8 sm:w-8 sm:text-sm lg:left-0.5 lg:top-0.5',
             'absolute left-1 top-1 grid h-7 w-7 place-items-center rounded-full text-xs font-black sm:h-8 sm:w-8 sm:text-sm'),
            ('mt-1.5 flex flex-wrap justify-center gap-1 sm:mt-2 sm:gap-1.5',
             'absolute left-1 right-1 top-9 flex min-h-6 flex-wrap items-start justify-center gap-1 sm:left-2 sm:right-2 sm:top-11 sm:min-h-7 sm:gap-1.5'),
          ]
          for old, new in replacements:
            if old in s:
              s = s.replace(old, new, 1)
          pro.write_text(s)

          office = Path('components/OfficeWorkspaceV2.tsx')
          s = office.read_text()
          replacements = [
            ('relative min-h-20 bg-white p-1 text-left transition hover:bg-blue-50 sm:min-h-28 sm:p-2',
             'relative min-h-[132px] bg-white p-1 text-left transition hover:bg-blue-50 sm:min-h-[148px] sm:p-2'),
            ('grid h-7 w-7 place-items-center rounded-full text-xs font-black sm:h-8 sm:w-8 sm:text-sm lg:absolute lg:left-1 lg:top-0.5',
             'absolute left-1 top-1 grid h-7 w-7 place-items-center rounded-full text-xs font-black sm:h-8 sm:w-8 sm:text-sm'),
            ('mt-1.5 flex flex-wrap justify-center gap-1 sm:mt-2 sm:gap-1.5 lg:mt-9',
             'absolute left-1 right-1 top-9 flex min-h-6 flex-wrap items-start justify-center gap-1 sm:left-2 sm:right-2 sm:top-11 sm:min-h-7 sm:gap-1.5'),
          ]
          for old, new in replacements:
            if old in s:
              s = s.replace(old, new, 1)

          old = '''              <div className="mt-1 flex flex-wrap justify-center gap-1">
                {dayShifts.length > 0 && <span className="rounded-full bg-[#4285F4]/10 px-1.5 py-0.5 text-[8px] font-black text-[#2f6fd0] sm:text-[9px]">{dayShifts.length} shift{dayShifts.length === 1 ? "" : "s"}</span>}
                {interestedCount > 0 && <span className="rounded-full bg-[#FBBC05]/20 px-1.5 py-0.5 text-[8px] font-black text-amber-800 sm:text-[9px]">{interestedCount} applicant{interestedCount === 1 ? "" : "s"}</span>}
                {dayBookings.length > 0 && <span className="rounded-full bg-[#34A853]/15 px-1.5 py-0.5 text-[8px] font-black text-[#278841] sm:text-[9px]">✓ {dayBookings.length}</span>}
              </div>'''
          new = '''              <div className="absolute left-1 right-1 top-[68px] flex justify-center sm:left-2 sm:right-2 sm:top-[82px]">
                {dayShifts.length > 0 && <span className="rounded-full bg-[#4285F4]/10 px-1.5 py-0.5 text-[8px] font-black text-[#2f6fd0] sm:text-[9px]">{dayShifts.length} shift{dayShifts.length === 1 ? "" : "s"}</span>}
              </div>
              <div className="absolute left-1 right-1 top-[88px] flex justify-center sm:left-2 sm:right-2 sm:top-[104px]">
                {interestedCount > 0 && <span className="rounded-full bg-[#FBBC05]/20 px-1.5 py-0.5 text-[8px] font-black text-amber-800 sm:text-[9px]">{interestedCount} applicant{interestedCount === 1 ? "" : "s"}</span>}
              </div>
              <div className="absolute bottom-1 left-1 right-1 flex justify-center sm:bottom-2 sm:left-2 sm:right-2">
                {dayBookings.length > 0 && <span className="rounded-full bg-[#34A853]/15 px-1.5 py-0.5 text-[8px] font-black text-[#278841] sm:text-[9px]">✓ {dayBookings.length}</span>}
              </div>'''
          if old in s:
            s = s.replace(old, new, 1)
          office.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx
          git diff --cached --quiet || git commit -m "Use fixed lanes in professional and office calendars"
          git push
