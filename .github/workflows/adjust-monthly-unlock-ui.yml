name: Adjust monthly Candidate Unlock billing

on:
  push:
    paths:
      - '.github/workflows/adjust-monthly-unlock-ui.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply monthly billing UI
        run: python .github/scripts/adjust-monthly-unlock-ui.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified monthly billing UI
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add app/classifieds/page.tsx app/api/dentaljobs/unlock/checkout/route.ts app/api/dentaljobs/unlock/details/route.ts app/api/dentaljobs/unlock/webhook/route.ts app/api/dentaljobs/billing/setup/route.ts
          git commit -m "Use monthly billing for Candidate Unlock"
          git push
