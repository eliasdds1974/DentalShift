name: Fix compact calendar header layout

on:
  push:
    paths:
      - '.github/workflows/fix-compact-calendar-header-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep summary cards compact beside calendar title
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/WorkflowWorkspaceV2.tsx')
          text = path.read_text()
          text = text.replace(
            'className="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between"',
            'className="flex flex-wrap items-start justify-between gap-4"',
            1,
          )
          text = text.replace(
            'className="grid shrink-0 grid-cols-3 gap-2"',
            'className="flex shrink-0 flex-wrap items-center justify-end gap-2"',
            1,
          )
          path.write_text(text)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit source
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m 'Keep calendar summary cards compact beside title'
          git push
