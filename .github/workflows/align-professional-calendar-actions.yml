name: Align professional calendar actions

on:
  push:
    paths:
      - '.github/scripts/align-professional-calendar-actions.py'
      - '.github/workflows/align-professional-calendar-actions.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply professional calendar alignment
        run: python .github/scripts/align-professional-calendar-actions.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit professional calendar alignment
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Align professional calendar actions with office portal"
            git push
          fi
