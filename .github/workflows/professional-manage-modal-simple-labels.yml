name: Professional Manage modal simple labels

on:
  push:
    paths:
      - '.github/workflows/professional-manage-modal-simple-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply simplified Manage modal
        run: python3 .github/scripts/professional-manage-modal-simple-labels.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add app/classifieds/page.tsx
          git diff --cached --quiet || git commit -m "Simplify professional posting management"
          git push origin main
