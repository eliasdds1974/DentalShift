name: Inspect account preference anchors
on:
  push:
    paths:
      - '.github/workflows/inspect-account-preferences.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show account preference anchors
        run: |
          grep -n -C 12 -E 'GoogleOfficeFavouriteSearch|favourites|Favourite|AccountModal|accountOpen|role === "office"|role === "professional"' app/page.tsx | tail -n 260
