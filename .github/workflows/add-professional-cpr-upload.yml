name: Add professional CPR upload

on:
  push:
    paths:
      - '.github/workflows/add-professional-cpr-upload.yml'
      - '.github/scripts/add-professional-cpr-upload.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CPR upload patch
        run: python .github/scripts/add-professional-cpr-upload.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/page.tsx lib/dentalshift.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add CPR certificate upload for RDH and CDA"
            git push
          fi
