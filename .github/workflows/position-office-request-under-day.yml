name: Position office request under day
on:
  push:
    paths:
      - 'scripts/position-office-request-under-day.py'
      - '.github/workflows/position-office-request-under-day.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply office request placement
        run: python3 scripts/position-office-request-under-day.py
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit source changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m 'Place office request under calendar day number'
          git push
