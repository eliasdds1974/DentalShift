name: Add preferred office badges

on:
  push:
    paths:
      - '.github/scripts/add-preferred-office-badges.py'
      - '.github/workflows/add-preferred-office-badges.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply preferred office badges
        run: python .github/scripts/add-preferred-office-badges.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit preferred office badges
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx components/WorkflowWorkspace.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Show preferred office badges on professional bookings"
            git push
          fi
