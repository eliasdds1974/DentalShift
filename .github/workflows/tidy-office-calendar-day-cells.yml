name: Tidy office calendar day cells
on:
  push:
    paths:
      - '.github/workflows/tidy-office-calendar-day-cells.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move day numbers top-left and remove header post button
        run: |
          python3 - <<'PY'
          from pathlib import Path

          office = Path('components/OfficeWorkspaceV2.tsx')
          s = office.read_text()
          old = 'return <button type="button" key={key} onClick={() => { setSelectedDate(key); setCalendarCursor(day); }} className={`min-h-24 bg-white p-1.5 text-left transition hover:bg-blue-50 sm:min-h-28 sm:p-2 ${calendarView === "month" && !inMonth ? "text-slate-300" : "text-slate-800"} ${selected ? "relative z-10 bg-blue-50/50 ring-2 ring-inset ring-[#0078FE]" : ""}`}>\n              <span className={`inline-grid h-7 w-7 place-items-center rounded-full text-sm font-black ${today ? "bg-[#032757] text-white" : ""}`}>{day.getDate()}</span>\n              <div className="mt-2 space-y-1">'
          new = 'return <button type="button" key={key} onClick={() => { setSelectedDate(key); setCalendarCursor(day); }} className={`relative min-h-24 bg-white p-1.5 pt-10 text-left transition hover:bg-blue-50 sm:min-h-28 sm:p-2 sm:pt-10 ${calendarView === "month" && !inMonth ? "text-slate-300" : "text-slate-800"} ${selected ? "z-10 bg-blue-50/50 ring-2 ring-inset ring-[#0078FE]" : ""}`}>\n              <span className={`absolute left-2 top-2 inline-grid h-7 w-7 place-items-center rounded-full text-sm font-black ${today ? "bg-[#032757] text-white" : ""}`}>{day.getDate()}</span>\n              <div className="space-y-1">'
          if old not in s:
              raise SystemExit('office calendar day cell block not found')
          office.write_text(s.replace(old, new, 1))

          page = Path('app/page.tsx')
          s = page.read_text()
          old = '{role === "office" && <button onClick={onPost} className="primary-btn"><Plus size={18} /> <span className="hidden sm:inline">Post a shift</span></button>}'
          if old not in s:
              raise SystemExit('office header post button not found')
          page.write_text(s.replace(old, '', 1))
          PY
      - name: Commit source changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx app/page.tsx
          git commit -m 'Align office day numbers and remove header post button'
          git push
