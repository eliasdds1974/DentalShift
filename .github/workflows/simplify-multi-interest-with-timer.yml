name: Simplify multi interest with timer
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/simplify_multi_interest_with_timer.py'
      - '.github/workflows/simplify-multi-interest-with-timer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/simplify_multi_interest_with_timer.py
      - run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Simplify professional interest flow with shared timers" && git push; fi
