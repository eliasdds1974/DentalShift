name: Highlight remove availability button

on:
  push:
    paths:
      - .github/workflows/highlight-remove-availability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Highlight destructive action
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/WorkflowWorkspaceV2.tsx')
          text = path.read_text()
          old = 'className="secondary-btn mt-4">{busy === selectedAvailability.id ? "Removing…" : "Remove availability"}'
          new = 'className="mt-4 inline-flex min-h-11 items-center justify-center rounded-xl border-2 border-rose-500 bg-rose-50 px-4 py-2.5 text-sm font-extrabold text-rose-700 shadow-sm transition hover:bg-rose-100 focus:outline-none focus:ring-4 focus:ring-rose-500/20 disabled:cursor-not-allowed disabled:opacity-60">{busy === selectedAvailability.id ? "Removing…" : "Remove availability"}'
          if old not in text:
              raise SystemExit('Remove availability button pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit source change
        run: |
          git config user.name "DentalShift Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m "Highlight remove availability action"
          git push
