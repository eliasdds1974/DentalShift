name: Wire office calendar workspace
on:
  push:
    paths:
      - '.github/workflows/wire-office-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire OfficeWorkspaceV2
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/WorkflowWorkspaceV2.tsx')
          s = p.read_text()
          old = '''import {\n  OfficeWorkspace,\n  ProfessionalWorkspace as LegacyProfessionalWorkspace,\n} from "./WorkflowWorkspace";\n\nexport { OfficeWorkspace };'''
          new = '''import {\n  ProfessionalWorkspace as LegacyProfessionalWorkspace,\n} from "./WorkflowWorkspace";\nexport { OfficeWorkspace } from "./OfficeWorkspaceV2";'''
          if old not in s:
              raise SystemExit('Expected OfficeWorkspace import/export block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m 'Use calendar-first office workspace'
          git push
