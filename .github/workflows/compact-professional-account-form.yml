name: Compact professional account form

on:
  push:
    paths:
      - '.github/scripts/compact-professional-account-form.py'
      - '.github/workflows/compact-professional-account-form.yml'

permissions:
  contents: write

jobs:
  compact-professional-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compact professional account form
        run: python .github/scripts/compact-professional-account-form.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Compact professional account form"
            git push origin main
          fi
