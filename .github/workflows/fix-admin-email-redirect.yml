name: Fix admin email redirect
on:
  push:
    paths:
      - '.github/workflows/fix-admin-email-redirect.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route temporary admin directly to admin portal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = '''        onAdmin={() => { void (async () => {
          if (session) {
            const { error: signOutError } = await supabase.auth.signOut();
            if (signOutError) { window.alert(signOutError.message); return; }
            setSession(null); setProfile(null); setOfficeId(null); setOffice(null);
          }
          window.sessionStorage.setItem("dentalshift_signin_role", "admin");
          window.localStorage.setItem("dentalshift_portal_role", "admin");
          setRole("admin");
          setAccountIntent({ mode: "signin", role: "admin" });
          setAccountOpen(true);
        })(); }}'''
          new = '''        onAdmin={() => router.push("/admin/overview")}'''
          if old not in s:
              raise SystemExit('temporary admin handler not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'eliasdds1974'
          git config user.email 'eliasdds@gmail.com'
          git add app/page.tsx
          git commit -m 'Route temporary admin directly to admin page'
          git push
