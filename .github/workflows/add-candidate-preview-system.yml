name: Add Candidate Preview system

on:
  push:
    paths:
      - '.github/workflows/add-candidate-preview-system.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install resume parsers
        run: npm install pdf-parse@1.1.1 mammoth@1.9.1 --save --no-audit --no-fund
      - name: Apply Candidate Preview system
        run: python .github/scripts/add-candidate-preview-system.py
      - name: Production build
        run: npm run build
      - name: Commit verified Candidate Preview system
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add app/page.tsx app/classifieds/page.tsx app/api/dentaljobs/candidate-preview/route.ts package.json package-lock.json
          git commit -m "Add privacy-safe DentalJobs candidate previews"
          git push
