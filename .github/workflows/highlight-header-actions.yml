name: Highlight header actions
on:
  push:
    paths:
      - '.github/workflows/highlight-header-actions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Highlight Account Messages and Sign out
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          old='''<div className="flex items-center gap-2 sm:gap-3"><button onClick={onAccount} className="secondary-btn"><span className={"h-2 w-2 rounded-full " + (signedIn ? "bg-[#01A32E]" : "bg-slate-300")} /><span className="hidden sm:inline">{signedIn ? "Account" : "Sign in"}</span></button><button onClick={onMessages} className="secondary-btn"><MessageCircle size={17} /><span className="hidden sm:inline">Messages</span></button>{signedIn && <button onClick={onSignOut} className="secondary-btn text-rose-700 hover:border-rose-200 hover:bg-rose-50"><LogOut size={17} /><span className="hidden sm:inline">Sign out</span></button>}'''
          new='''<div className="flex items-center gap-2 sm:gap-3"><button onClick={onAccount} className="inline-flex items-center gap-2 rounded-xl border-2 border-[#0078FE]/30 bg-blue-50 px-3 py-2 text-sm font-extrabold text-[#002757] shadow-sm transition hover:-translate-y-0.5 hover:border-[#0078FE]/60 hover:bg-blue-100 hover:shadow-md"><span className={"h-2.5 w-2.5 rounded-full ring-2 ring-white " + (signedIn ? "bg-[#01A32E]" : "bg-slate-300")} /><span className="hidden sm:inline">{signedIn ? "Account" : "Sign in"}</span></button><button onClick={onMessages} className="inline-flex items-center gap-2 rounded-xl border-2 border-[#01A32E]/25 bg-[#eaf8ee] px-3 py-2 text-sm font-extrabold text-[#017f27] shadow-sm transition hover:-translate-y-0.5 hover:border-[#01A32E]/55 hover:bg-[#def4e5] hover:shadow-md"><MessageCircle size={17} /><span className="hidden sm:inline">Messages</span></button>{signedIn && <button onClick={onSignOut} className="inline-flex items-center gap-2 rounded-xl border-2 border-rose-200 bg-rose-50 px-3 py-2 text-sm font-extrabold text-rose-700 shadow-sm transition hover:-translate-y-0.5 hover:border-rose-300 hover:bg-rose-100 hover:shadow-md"><LogOut size={17} /><span className="hidden sm:inline">Sign out</span></button>}'''
          if old not in s:
            raise SystemExit('Expected header action block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit source change
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Highlight header account actions'
          git push
