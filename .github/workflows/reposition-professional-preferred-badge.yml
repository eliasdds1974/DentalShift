name: Reposition professional Preferred badge

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/reposition-professional-preferred-badge.py'
      - '.github/workflows/reposition-professional-preferred-badge.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reposition Preferred badge
        run: python .github/scripts/reposition-professional-preferred-badge.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit Preferred badge reposition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet || git commit -m "Reposition Preferred badge in Professional Portal scheduled card"
          git push
