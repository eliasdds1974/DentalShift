name: Default professional availability rate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/default-professional-availability-rate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Default availability rate from professional profile
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/WorkflowWorkspaceV2.tsx')
          s = path.read_text()

          old = '  const [profession, setProfession] = useState("Dental Professional");\n  const [loading, setLoading] = useState(true);'
          new = '  const [profession, setProfession] = useState("Dental Professional");\n  const [profileHourlyRate, setProfileHourlyRate] = useState<number | null>(null);\n  const [loading, setLoading] = useState(true);'
          if old not in s:
              raise SystemExit('state insertion target missing')
          s = s.replace(old, new, 1)

          old = '      setProfession(account.professional?.profession || "Dental Professional");\n      setWorkflow({'
          new = '      setProfession(account.professional?.profession || "Dental Professional");\n      setProfileHourlyRate(account.professional?.hourly_rate != null ? Number(account.professional.hourly_rate) : null);\n      setWorkflow({'
          if old not in s:
              raise SystemExit('profile rate load target missing')
          s = s.replace(old, new, 1)

          old = '<label className="field mt-3"><span>Hourly rate *</span><input name="hourly_rate" type="number" min="1" step="0.50" placeholder="$ / hr" required /></label>'
          new = '<label className="field mt-3"><span>Hourly rate *</span><input key={profileHourlyRate ?? "no-rate"} name="hourly_rate" type="number" min="1" step="0.50" defaultValue={profileHourlyRate ?? undefined} placeholder="$ / hr" required /></label>'
          if old not in s:
              raise SystemExit('availability rate input target missing')
          s = s.replace(old, new, 1)

          path.write_text(s)
          PY
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Default availability wage from professional profile"
            git push
          fi
