name: Build professional interest card

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/build_professional_interest_card.py'
      - '.github/workflows/build-professional-interest-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build professional interest selection
        run: python .github/scripts/build_professional_interest_card.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx lib/dentalshift.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Build pinned professional interest selection"
            git push
          fi
