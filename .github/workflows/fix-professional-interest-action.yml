name: Fix professional interest action
on:
  push:
    paths:
      - '.github/workflows/fix-professional-interest-action.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply professional interest fix
        run: python .github/scripts/fix-professional-interest-action.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx lib/dentalshift.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix professional I'm Interested action"
          git push
