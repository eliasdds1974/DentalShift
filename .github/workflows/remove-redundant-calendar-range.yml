name: Remove redundant calendar range

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/remove-redundant-calendar-range.py'
      - '.github/workflows/remove-redundant-calendar-range.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply calendar range cleanup
        run: python .github/scripts/remove-redundant-calendar-range.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified application changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No application change needed"
          else
            git commit -m "Remove redundant calendar range labels"
            git push
          fi
