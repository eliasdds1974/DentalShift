name: Style selected office red header
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/style-selected-office-red-header.py'
      - '.github/workflows/style-selected-office-red-header.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/style-selected-office-red-header.py
      - run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Style selected Dental Office header red" && git push; fi
