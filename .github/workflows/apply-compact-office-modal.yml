name: Apply compact office modal
on:
  push:
    branches:
      - polish/compact-office-post-modal
    paths:
      - '.github/scripts/patch_compact_office_modal.py'
      - '.github/workflows/apply-compact-office-modal.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/compact-office-post-modal
      - name: Apply patch
        run: python .github/scripts/patch_compact_office_modal.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name 'DentalShift automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Compact office posting modal for desktop'
          git push origin HEAD:polish/compact-office-post-modal
