name: Add preferred office badge to professional card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-preferred-office-badge-to-professional-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply preferred badge patch
        run: python .github/scripts/add-preferred-office-badge-to-professional-card.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit preferred badge update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dentalshift.ts components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Show Preferred badge when office prefers professional"
          git push origin main
