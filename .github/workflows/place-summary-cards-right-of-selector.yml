name: Place summary cards beside calendar selector

on:
  push:
    paths:
      - '.github/workflows/place-summary-cards-right-of-selector.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move compact cards beside selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/WorkflowWorkspaceV2.tsx')
          s = p.read_text()
          old = '''        <div className="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
          <div className="min-w-0"><h2 className="text-2xl font-black tracking-tight text-[#002757]">Professional calendar</h2><p className="mt-1 text-sm text-slate-500">Availability fills the bottom half of each day. Bookings and office requests appear in the upper corner.</p></div>
          <div className="grid w-full shrink-0 grid-cols-1 gap-2 sm:w-auto sm:min-w-[180px]"><button type="button" onClick={() => setSelection({ type: "day" })} className="flex w-full items-center gap-2 rounded-xl border border-[#0078FE]/20 bg-blue-50/60 px-3 py-2 text-left"><CalendarDays size={15} className="text-[#0078FE]" /><span><span className="block text-[10px] font-extrabold text-slate-500">Availability</span><strong className="block text-lg leading-none text-[#002757]">{workflow.availability.filter((slot) => slot.available && new Date(slot.ends_at).getTime() >= Date.now()).length}</strong></span></button><button type="button" onClick={() => onNavigate("bookings")} className="flex w-full items-center gap-2 rounded-xl border border-[#01A32E]/20 bg-[#eaf8ee]/60 px-3 py-2 text-left"><Check size={15} className="text-[#017f27]" /><span><span className="block text-[10px] font-extrabold text-slate-500">Booked</span><strong className="block text-lg leading-none text-[#002757]">{upcomingBookings.length}</strong></span></button><button type="button" onClick={() => onNavigate("shifts")} className="flex w-full items-center gap-2 rounded-xl border border-amber-200 bg-amber-50/70 px-3 py-2 text-left"><FileCheck2 size={15} className="text-amber-700" /><span><span className="block text-[10px] font-extrabold text-slate-500">Office requests</span><strong className="block text-lg leading-none text-[#002757]">{officeRequests.length}</strong></span></button></div>
        </div>
        <div className="mt-4 flex flex-wrap items-center gap-2">
            <button type="button" aria-label="Previous period" onClick={() => moveCalendar(-1)} className="secondary-btn px-3"><ChevronLeft size={19} /></button>
            <button type="button" onClick={() => { const today = new Date(); chooseDate(today); }} className="secondary-btn">Today</button>
            <button type="button" aria-label="Next period" onClick={() => moveCalendar(1)} className="secondary-btn px-3"><ChevronRight size={19} /></button>
            <div className="ml-1 grid grid-cols-3 rounded-xl bg-slate-100 p-1">{(["month", "week", "list"] as CalendarView[]).map((mode) => <button type="button" key={mode} onClick={() => { setCalendarView(mode); setSelection({ type: "day" }); }} className={`rounded-lg px-3 py-2 text-sm font-extrabold capitalize transition ${calendarView === mode ? "bg-[#0078FE] text-white shadow-sm" : "text-slate-600 hover:text-[#002757]"}`}>{mode}</button>)}</div>
          </div>'''
          new = '''        <div>
          <h2 className="text-2xl font-black tracking-tight text-[#002757]">Professional calendar</h2>
          <p className="mt-1 text-sm text-slate-500">Availability fills the bottom half of each day. Bookings and office requests appear in the upper corner.</p>
        </div>
        <div className="mt-4 flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
          <div className="flex flex-wrap items-center gap-2">
            <button type="button" aria-label="Previous period" onClick={() => moveCalendar(-1)} className="secondary-btn px-3"><ChevronLeft size={19} /></button>
            <button type="button" onClick={() => { const today = new Date(); chooseDate(today); }} className="secondary-btn">Today</button>
            <button type="button" aria-label="Next period" onClick={() => moveCalendar(1)} className="secondary-btn px-3"><ChevronRight size={19} /></button>
            <div className="ml-1 grid grid-cols-3 rounded-xl bg-slate-100 p-1">{(["month", "week", "list"] as CalendarView[]).map((mode) => <button type="button" key={mode} onClick={() => { setCalendarView(mode); setSelection({ type: "day" }); }} className={`rounded-lg px-3 py-2 text-sm font-extrabold capitalize transition ${calendarView === mode ? "bg-[#0078FE] text-white shadow-sm" : "text-slate-600 hover:text-[#002757]"}`}>{mode}</button>)}</div>
          </div>
          <div className="grid w-full gap-1.5 sm:w-[170px] lg:-mt-1 lg:shrink-0">
            <button type="button" onClick={() => setSelection({ type: "day" })} className="flex h-9 items-center justify-between rounded-lg border border-[#0078FE]/20 bg-blue-50/60 px-2.5 text-left"><span className="flex items-center gap-2"><CalendarDays size={13} className="text-[#0078FE]" /><span className="text-[11px] font-extrabold text-slate-600">Availability</span></span><strong className="text-sm text-[#002757]">{workflow.availability.filter((slot) => slot.available && new Date(slot.ends_at).getTime() >= Date.now()).length}</strong></button>
            <button type="button" onClick={() => onNavigate("bookings")} className="flex h-9 items-center justify-between rounded-lg border border-[#01A32E]/20 bg-[#eaf8ee]/60 px-2.5 text-left"><span className="flex items-center gap-2"><Check size={13} className="text-[#017f27]" /><span className="text-[11px] font-extrabold text-slate-600">Booked</span></span><strong className="text-sm text-[#002757]">{upcomingBookings.length}</strong></button>
            <button type="button" onClick={() => onNavigate("shifts")} className="flex h-9 items-center justify-between rounded-lg border border-amber-200 bg-amber-50/70 px-2.5 text-left"><span className="flex items-center gap-2"><FileCheck2 size={13} className="text-amber-700" /><span className="text-[11px] font-extrabold text-slate-600">Office requests</span></span><strong className="text-sm text-[#002757]">{officeRequests.length}</strong></button>
          </div>
        </div>'''
          if old not in s:
              raise SystemExit('Target calendar header block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m 'Place compact summary cards beside calendar selector'
          git push
