name: Place summary cards beside calendar selector

on:
  push:
    paths:
      - '.github/workflows/place-summary-cards-right-of-selector.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch compact layout
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit source
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m 'Place compact summary cards beside calendar selector'
          git push
