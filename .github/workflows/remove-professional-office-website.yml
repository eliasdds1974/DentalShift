name: Remove professional office website

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/remove_professional_office_website.py'
      - '.github/workflows/remove-professional-office-website.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove office website from professional cards
        run: python .github/scripts/remove_professional_office_website.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Remove office website from professional cards"
            git push
          fi
