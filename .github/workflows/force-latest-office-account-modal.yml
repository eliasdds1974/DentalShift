name: Force latest office account modal

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/force_latest_office_account_modal.py'
      - '.github/workflows/force-latest-office-account-modal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route office account to latest modal
        run: python .github/scripts/force_latest_office_account_modal.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Route office account to latest form"
            git push
          fi
