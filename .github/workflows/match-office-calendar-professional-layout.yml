name: Match office calendar professional layout

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/match_office_calendar_professional_layout.py'
      - '.github/workflows/match-office-calendar-professional-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match office calendar layout
        run: python .github/scripts/match_office_calendar_professional_layout.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Match office calendar to professional layout"
            git push
          fi
