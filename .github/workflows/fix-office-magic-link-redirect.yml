name: Fix office magic link redirect
on:
  push:
    paths:
      - '.github/scripts/fix-office-magic-link-redirect.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/fix-office-magic-link-redirect.py
      - run: |
          git config user.name dentalshift-bot
          git config user.email bot@users.noreply.github.com
          git add app/page.tsx
          git diff --cached --quiet || git commit -m 'Fix office magic link redirect'
          git push origin main
