name: Clean calendar navigation

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/clean-calendar-navigation.py'
      - '.github/workflows/clean-calendar-navigation.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply calendar navigation cleanup
        run: python .github/scripts/clean-calendar-navigation.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified application changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No application change needed"
          else
            git commit -m "Clean calendar navigation labels"
            git push
          fi
