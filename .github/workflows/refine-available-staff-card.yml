name: Refine available staff card styling
on:
  push:
    paths:
      - '.github/workflows/refine-available-staff-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine selected-day availability card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/OfficeWorkspaceV2.tsx')
          s = p.read_text()
          old = '''                    <div className="flex items-start justify-between gap-3">
                      <div className="min-w-0">
                        <div className="flex items-center gap-2"><span className={`h-2.5 w-2.5 shrink-0 rounded-full ${role.solid}`} /><strong className={`${role.text}`}>{role.label} · {profile?.profession || "Dental professional"}</strong></div>
                        <p className="mt-1 text-[11px] font-black uppercase tracking-wide text-[#04A62F]">Available {shortTime(slot.starts_at)}–{shortTime(slot.ends_at)}</p>
                      </div>
                      <span className="shrink-0 rounded-full bg-[#eaf8ee] px-2 py-1 text-[10px] font-black text-[#017f27]">Available</span>
                    </div>'''
          new = '''                    <div>
                      <strong className={`block ${role.text}`}>{role.label} · {profile?.profession || "Dental professional"}</strong>
                      <div className="mt-2 flex items-center justify-between gap-2 rounded-lg bg-[#04A62F] px-3 py-2 text-xs font-black text-white">
                        <span>{shortTime(slot.starts_at)}–{shortTime(slot.ends_at)}</span>
                        <span className="uppercase tracking-wide">Available</span>
                      </div>
                    </div>'''
          if old not in s:
              raise SystemExit('selected-day availability header block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source change
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Refine available staff time and status styling'
          git push
