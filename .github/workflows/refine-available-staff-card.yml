name: Refine available staff card styling
on:
  push:
    paths:
      - '.github/workflows/refine-available-staff-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine selected-day availability card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/OfficeWorkspaceV2.tsx')
          s = p.read_text()
          dot = '<span className={`h-2.5 w-2.5 shrink-0 rounded-full ${role.solid}`} />'
          if dot not in s:
              raise SystemExit('role dot not found')
          s = s.replace(dot, '', 1)
          old_time = '<p className="mt-1 text-[11px] font-black uppercase tracking-wide text-[#04A62F]">Available {shortTime(slot.starts_at)}–{shortTime(slot.ends_at)}</p>'
          new_time = '<span className="mt-2 inline-block rounded-lg bg-[#04A62F] px-3 py-2 text-[11px] font-black text-white">{shortTime(slot.starts_at)}–{shortTime(slot.ends_at)}</span>'
          if old_time not in s:
              raise SystemExit('availability time line not found')
          s = s.replace(old_time, new_time, 1)
          old_badge = '<span className="shrink-0 rounded-full bg-[#eaf8ee] px-2 py-1 text-[10px] font-black text-[#017f27]">Available</span>'
          new_badge = '<span className="shrink-0 rounded-lg bg-[#04A62F] px-3 py-2 text-[11px] font-black uppercase tracking-wide text-white">Available</span>'
          if old_badge not in s:
              raise SystemExit('availability badge not found')
          s = s.replace(old_badge, new_badge, 1)
          p.write_text(s)
          PY
      - name: Commit source change
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Refine available staff time and status styling'
          git push
