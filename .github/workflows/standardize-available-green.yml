name: Standardize Available status to logo green
on:
  push:
    paths:
      - '.github/workflows/standardize-available-green.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make office availability badges logo green
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/OfficeWorkspaceV2.tsx')
          s = p.read_text()
          old = '''{availableByRole.map(({ code, count }) => { const role = roleStyles[code]; return <div key={`available-${code}`} className={`truncate rounded-lg px-1.5 py-1 text-[10px] font-black ${role.soft} ${role.text}`}><span className={`mr-1 inline-block h-1.5 w-1.5 rounded-full ${role.solid}`} />Available {role.label} · {count}</div>; })}'''
          new = '''{availableByRole.map(({ code, count }) => { const role = roleStyles[code]; return <div key={`available-${code}`} className="truncate rounded-lg bg-[#eaf8ee] px-1.5 py-1 text-[10px] font-black text-[#017f27]"><span className="mr-1 inline-block h-1.5 w-1.5 rounded-full bg-[#04A62F]" />Available {role.label} · {count}</div>; })}'''
          if old not in s:
              raise SystemExit('availability badge block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source change
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Use logo green for available professionals'
          git push
