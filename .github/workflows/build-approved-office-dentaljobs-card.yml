name: Build approved office DentalJobs card

on:
  push:
    paths:
      - '.github/workflows/build-approved-office-dentaljobs-card.yml'
      - '.github/scripts/build-approved-office-dentaljobs-card.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build approved card only
        run: |
          python .github/scripts/build-approved-office-dentaljobs-card.py
          python - <<'PY'
          from pathlib import Path
          p = Path('app/classifieds/page.tsx')
          s = p.read_text()
          s = s.replace('CalendarDays size={16}', 'Clock3 size={16}')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/classifieds/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build approved office DentalJobs card"
          git push origin main
