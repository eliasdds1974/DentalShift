name: Apply office software account
on:
  push:
    branches:
      - feature/office-software-account
    paths:
      - '.github/scripts/patch_office_software_account.py'
      - '.github/workflows/apply-office-software-account.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/office-software-account
      - name: Apply patch
        run: python .github/scripts/patch_office_software_account.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name 'DentalShift automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Move office software into account settings'
          git push origin HEAD:feature/office-software-account
