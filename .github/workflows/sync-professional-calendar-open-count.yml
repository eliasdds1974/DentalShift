name: Sync professional calendar open count

on:
  push:
    paths:
      - '.github/scripts/sync-professional-calendar-open-count.py'
      - '.github/workflows/sync-professional-calendar-open-count.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/sync-professional-calendar-open-count.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Sync professional calendar blue counts with visible offices"
          git push origin main
