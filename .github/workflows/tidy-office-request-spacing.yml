name: Tidy office request spacing
on:
  push:
    paths:
      - 'scripts/tidy-office-request-spacing.py'
      - '.github/workflows/tidy-office-request-spacing.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply spacing fix
        run: python3 scripts/tidy-office-request-spacing.py
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit source changes
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m 'Tidy professional calendar office request spacing'
          git push
