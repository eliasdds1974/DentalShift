name: Match office posting mockup

on:
  push:
    paths:
      - '.github/scripts/match-office-posting-mockup.py'
      - '.github/workflows/match-office-posting-mockup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply office posting mockup layout
        run: python .github/scripts/match-office-posting-mockup.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/classifieds/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Match office posting interest card mockup"
          git push origin main
