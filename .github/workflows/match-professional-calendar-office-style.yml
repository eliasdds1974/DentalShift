name: Match professional calendar office style

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/match_professional_calendar_office_style.py'
      - '.github/workflows/match-professional-calendar-office-style.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match professional calendar styling
        run: python .github/scripts/match_professional_calendar_office_style.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspace.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Match professional calendar to office style"
            git push
          fi
