name: Switch admin to magic link

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/switch_admin_magic.py'
      - '.github/workflows/switch-admin-to-magic-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin sign in
        run: python .github/scripts/switch_admin_magic.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/admin/overview/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use magic link for admin sign in"
            git push
          fi
