name: Show office selected day card
on:
  push:
    paths:
      - '.github/workflows/show-office-selected-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep selected-day card visible beside office calendar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/OfficeWorkspaceV2.tsx')
          s = p.read_text()
          old = '      </div> : <div className="grid lg:grid-cols-[minmax(0,1.8fr)_minmax(320px,.72fr)]">'
          new = '      </div> : <div className="grid md:grid-cols-[minmax(0,1.8fr)_minmax(300px,.72fr)]">'
          if old not in s:
              raise SystemExit('office selected-day grid not found')
          s = s.replace(old, new, 1)
          old = '        <div className="border-b border-slate-200 p-3 sm:p-5 lg:border-b-0 lg:border-r">'
          new = '        <div className="border-b border-slate-200 p-3 sm:p-5 md:border-b-0 md:border-r">'
          if old not in s:
              raise SystemExit('office calendar pane not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit source change
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Keep office selected-day card visible beside calendar'
          git push
