name: Add office day shift form
on:
  push:
    paths:
      - '.github/workflows/add-office-day-shift-form.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add_office_day_shift_form.py
      - run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Add shift posting form to office calendar day panel'
          git push
