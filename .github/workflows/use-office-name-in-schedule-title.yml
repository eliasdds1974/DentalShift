name: Use office name in schedule title
on:
  push:
    paths:
      - '.github/workflows/use-office-name-in-schedule-title.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update office schedule title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/OfficeWorkspaceV2.tsx')
          s = p.read_text()
          old = '<h1 className="page-title">Office schedule</h1>'
          new = '<h1 className="page-title">{office.name} schedule</h1>'
          if old not in s:
              raise SystemExit('Office schedule title not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Use office name in schedule title'
          git push
