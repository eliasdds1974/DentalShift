name: Show professional availability on office calendar
on:
  push:
    paths:
      - '.github/workflows/show-professional-availability-on-office-calendar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add availability counts to office calendar days
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/OfficeWorkspaceV2.tsx')
          s = p.read_text()

          old = '''            const dayShifts = data.shifts.filter((shift) => localDateKey(shift.starts_at) === key);\n            const dayBookings = upcomingBookings.filter((booking) => booking.shifts && localDateKey(booking.shifts.starts_at) === key);\n            return <button type="button" key={key} onClick={() => { setSelectedDate(key); setCalendarCursor(day); }}'''
          new = '''            const dayShifts = data.shifts.filter((shift) => localDateKey(shift.starts_at) === key);\n            const dayBookings = upcomingBookings.filter((booking) => booking.shifts && localDateKey(booking.shifts.starts_at) === key);\n            const dayAvailability = data.availability.filter((slot) => localDateKey(slot.starts_at) === key);\n            const availableByRole = (["RDH", "CDA", "DA", "ST"] as RoleCode[]).map((code) => ({ code, count: dayAvailability.filter((slot) => roleCode(slot.professional_profiles?.profession) === code).length })).filter((item) => item.count > 0);\n            return <button type="button" key={key} onClick={() => { setSelectedDate(key); setCalendarCursor(day); }}'''
          if old not in s:
              raise SystemExit('calendar day data block not found')
          s = s.replace(old, new, 1)

          old = '''              <div className="space-y-1">{dayShifts.slice(0, 3).map((shift) => { const role = roleStyles[roleCode(shift.profession)]; const applications = (shift.applications || []).filter((item) => item.status === "applied").length; return <div key={shift.id} className={`truncate rounded-lg px-1.5 py-1 text-[10px] font-black ${role.soft} ${role.text}`}><span className={`mr-1 inline-block h-1.5 w-1.5 rounded-full ${role.solid}`} />{role.label} · {applications} appl.</div>; })}{dayBookings.length > 0 && <div className="rounded-lg bg-[#eaf8ee] px-1.5 py-1 text-[10px] font-black text-[#017f27]">{dayBookings.length} booked</div>}</div>'''
          new = '''              <div className="space-y-1">{availableByRole.map(({ code, count }) => { const role = roleStyles[code]; return <div key={`available-${code}`} className={`truncate rounded-lg px-1.5 py-1 text-[10px] font-black ${role.soft} ${role.text}`}><span className={`mr-1 inline-block h-1.5 w-1.5 rounded-full ${role.solid}`} />Available {role.label} · {count}</div>; })}{dayShifts.slice(0, 3).map((shift) => { const role = roleStyles[roleCode(shift.profession)]; const applications = (shift.applications || []).filter((item) => item.status === "applied").length; return <div key={shift.id} className={`truncate rounded-lg px-1.5 py-1 text-[10px] font-black ${role.soft} ${role.text}`}><span className={`mr-1 inline-block h-1.5 w-1.5 rounded-full ${role.solid}`} />{role.label} · {applications} appl.</div>; })}{dayBookings.length > 0 && <div className="rounded-lg bg-[#eaf8ee] px-1.5 py-1 text-[10px] font-black text-[#017f27]">{dayBookings.length} booked</div>}</div>'''
          if old not in s:
              raise SystemExit('calendar day badges block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit source change
        run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Show available professionals on office calendar'
          git push
