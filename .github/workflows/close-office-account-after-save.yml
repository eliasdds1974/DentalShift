name: Close office account after save
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "from pathlib import Path; p=Path('app/page.tsx'); s=p.read_text(); old='      onSaved();\\n    } catch (value) { setError(value instanceof Error ? value.message : \\\"The office account could not be saved.\\\"); }'; new='      onSaved();\\n      close();\\n    } catch (value) { setError(value instanceof Error ? value.message : \\\"The office account could not be saved.\\\"); }'; assert old in s; p.write_text(s.replace(old,new,1))"
      - run: |
          git config user.name 'DentalShift Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Close office account after saving'
          git push
