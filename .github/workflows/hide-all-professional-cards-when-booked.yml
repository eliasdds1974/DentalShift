name: Hide all professional cards when booked

on:
  push:
    paths:
      - '.github/workflows/hide-all-professional-cards-when-booked.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/hide-all-professional-cards-when-booked.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          git commit -m "Show only booked card in professional sidebar" || exit 0
          git push
