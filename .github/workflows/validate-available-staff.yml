name: Validate anonymous available staff

on:
  push:
    branches:
      - feature/anonymous-available-staff-v2
    paths:
      - ".github/workflows/validate-available-staff.yml"
      - "components/AnonymousAvailableStaffPanel.tsx"
      - "components/OfficeWorkspaceV2.tsx"
      - "app/page.tsx"
      - "lib/dentalshift.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
