name: Reorder preferred and excluded profession dropdowns

on:
  push:
    paths:
      - '.github/workflows/reorder-preferred-excluded-profession-dropdowns.yml'
      - '.github/scripts/reorder-preferred-excluded-profession-dropdowns.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/reorder-preferred-excluded-profession-dropdowns.py
      - name: Commit changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Reorder preferred and excluded profession dropdowns"
            git push
          fi
