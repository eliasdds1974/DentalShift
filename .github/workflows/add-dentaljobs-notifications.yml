name: Add DentalJobs notifications

on:
  push:
    paths:
      - '.github/workflows/add-dentaljobs-notifications.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply DentalJobs notification UI
        run: python .github/scripts/add-dentaljobs-notifications.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified application change
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add app/classifieds/page.tsx app/api/dentaljobs/notify/route.ts
          git commit -m "Add DentalJobs notifications"
          git push
