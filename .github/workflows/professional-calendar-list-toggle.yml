name: Professional calendar list toggle

on:
  push:
    paths:
      - '.github/scripts/professional-calendar-list-toggle.py'
      - '.github/workflows/professional-calendar-list-toggle.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply professional calendar/list update
        run: python .github/scripts/professional-calendar-list-toggle.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit professional calendar/list update
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Match professional calendar controls to office portal"
            git push
          fi
