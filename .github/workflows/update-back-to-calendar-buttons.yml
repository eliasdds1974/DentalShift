name: Update Back To Calendar buttons

on:
  push:
    paths:
      - '.github/scripts/update-back-to-calendar-buttons.py'
      - '.github/workflows/update-back-to-calendar-buttons.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Back To Calendar button updates
        run: python .github/scripts/update-back-to-calendar-buttons.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit refinement
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Style Back To Calendar buttons in both portals"
            git push
          fi
