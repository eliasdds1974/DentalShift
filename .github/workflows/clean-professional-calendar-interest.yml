name: Clean professional calendar interest indicators
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/clean-professional-calendar-interest.py'
      - '.github/workflows/clean-professional-calendar-interest.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean professional calendar indicators
        run: python .github/scripts/clean-professional-calendar-interest.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Clean professional calendar interest indicators"
            git push
          fi
