name: Fix dual-role booking contact view
on:
  push:
    paths:
      - '.github/workflows/fix-dual-role-booking-contact-view.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix-dual-role-booking-contact-view.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dentalshift.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix booking contact details for dual-role accounts"
          git push
