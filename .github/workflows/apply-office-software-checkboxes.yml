name: Apply office software checkboxes

on:
  push:
    branches:
      - fix/office-software-checkboxes
    paths:
      - '.github/scripts/patch_office_software_checkboxes.py'
      - '.github/workflows/apply-office-software-checkboxes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/office-software-checkboxes
      - name: Apply patch
        run: python .github/scripts/patch_office_software_checkboxes.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          if git diff --quiet -- components/OfficeWorkspaceV2.tsx; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'DentalShift automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/OfficeWorkspaceV2.tsx
          git commit -m 'Use software checkboxes and remove auto-invite'
          git push origin HEAD:fix/office-software-checkboxes
