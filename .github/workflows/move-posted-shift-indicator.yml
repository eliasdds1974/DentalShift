name: Move posted shift indicator

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/move_posted_shift_indicator.py'
      - '.github/workflows/move-posted-shift-indicator.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move posted shift indicator
        run: python .github/scripts/move_posted_shift_indicator.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Move posted shift indicator lower"
            git push
          fi
