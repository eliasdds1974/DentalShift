name: Edit professional sidebar rate inline
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/edit-rate-inline-professional-sidebar.py'
      - '.github/workflows/edit-rate-inline-professional-sidebar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/edit-rate-inline-professional-sidebar.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Allow inline day rate editing in professional sidebar" && git push; fi
