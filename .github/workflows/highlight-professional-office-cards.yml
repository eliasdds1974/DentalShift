name: Highlight professional office cards
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/highlight_professional_office_cards.py'
      - '.github/workflows/highlight-professional-office-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Highlight professional office cards
        run: python .github/scripts/highlight_professional_office_cards.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Highlight dental office cards in professional portal"
            git push
          fi
