name: Add DentalJobs messaging

on:
  push:
    paths:
      - '.github/workflows/add-dentaljobs-messaging.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply DentalJobs messaging
        run: python .github/scripts/add-dentaljobs-messaging.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified application change
        run: |
          git config user.name "eliasdds1974"
          git config user.email "eliasdds@gmail.com"
          git add app/classifieds/page.tsx
          git commit -m "Add anonymous DentalJobs messaging"
          git push
