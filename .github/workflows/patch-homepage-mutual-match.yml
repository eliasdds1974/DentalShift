name: Patch homepage mutual-match messaging

on:
  push:
    paths:
      - '.github/scripts/patch-homepage-mutual-match.py'
      - '.github/workflows/patch-homepage-mutual-match.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage messaging
        run: python .github/scripts/patch-homepage-mutual-match.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit homepage change
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/MarketingHome.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Clarify mutual DentalShift matching on homepage"
            git push
          fi
