name: Add professional office distance v2

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_professional_office_distance_v2.py'
      - '.github/workflows/add-professional-office-distance-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add distance to active professional cards
        run: python .github/scripts/add_professional_office_distance_v2.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Show office distance in professional portal"
            git push
          fi
