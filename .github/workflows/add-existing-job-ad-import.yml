name: Add existing job ad import

on:
  push:
    paths:
      - '.github/workflows/add-existing-job-ad-import.yml'
      - '.github/scripts/add-existing-job-ad-import.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add existing job ad import
        run: python .github/scripts/add-existing-job-ad-import.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/classifieds/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add existing job ad import to DentalJobs"
            git push
          fi
