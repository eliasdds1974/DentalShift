name: Update dynamic Schedule role button

on:
  push:
    paths:
      - '.github/scripts/update-schedule-role-button.py'
      - '.github/workflows/update-schedule-role-button.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Schedule role button update
        run: python .github/scripts/update-schedule-role-button.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit refinement
        run: |
          git config user.name "dentalshift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add components/AnonymousAvailableStaffPanel.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use dynamic Schedule role wording"
            git push
          fi
