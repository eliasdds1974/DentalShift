name: Lock DentalJobs three columns and remove search

on:
  push:
    paths:
      - '.github/workflows/lock-dentaljobs-three-columns-remove-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply DentalJobs layout fix
        run: python .github/scripts/lock-dentaljobs-three-columns-remove-search.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dental-jobs/page.tsx components/DentalJobsNativeMarketplace.tsx
          git diff --cached --quiet || git commit -m "Lock DentalJobs to three columns and remove search"
          git push
