name: Fix Office Postings component types

on:
  push:
    paths:
      - '.github/workflows/fix-office-postings-component-types.yml'
      - '.github/scripts/fix-office-postings-component-types.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align component types
        run: python .github/scripts/fix-office-postings-component-types.py
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OfficePostingsCard.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Office Postings component types"
          git push origin main
