name: Apply availability mobile UX update

on:
  push:
    paths:
      - .github/workflows/availability-mobile-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch availability experience
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python /tmp/patch.py
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ProfessionalAvailabilityCalendar.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Highlight selected-date availability entry"
          git push
