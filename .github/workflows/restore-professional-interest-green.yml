name: Restore professional interest green
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/restore-professional-interest-green.py'
      - '.github/workflows/restore-professional-interest-green.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore professional interest green
        run: python .github/scripts/restore-professional-interest-green.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Restore professional interest card green"
            git push
          fi
