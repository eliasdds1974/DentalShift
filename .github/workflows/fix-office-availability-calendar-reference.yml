name: Fix office availability calendar reference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-office-availability-calendar-reference.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale radius helper call
        run: python -c "from pathlib import Path; p=Path('components/OfficeWorkspaceV2.tsx'); s=p.read_text(); old='.filter((slot) => localDateKey(slot.starts_at) === key && isSlotInProfessionalRadius(slot));'; new='.filter((slot) => localDateKey(slot.starts_at) === key);'; assert old in s, 'target missing'; p.write_text(s.replace(old,new,1))"
      - name: Commit source change
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/OfficeWorkspaceV2.tsx
          git commit -m "Fix office availability calendar radius reference"
          git push
