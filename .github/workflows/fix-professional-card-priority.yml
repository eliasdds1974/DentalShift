name: Fix professional card priority

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_professional_card_priority.py'
      - '.github/workflows/fix-professional-card-priority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix professional card priority
        run: python .github/scripts/fix_professional_card_priority.py
      - name: Commit source changes
        run: |
          git config user.name "DentalShift automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/WorkflowWorkspaceV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix professional card display priority"
            git push
          fi
